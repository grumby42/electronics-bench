<!DOCTYPE html>
<!-- ===================================================================
     EL500-LEARN  ·  Electronics Basics — guided bench
     Companion to the 500-in-1 trainer. Walks the foundations, every core
     component (live micro-sims), then 4 functionally distinct projects,
     then how they combine. Pedagogy sequenced after the Navy NEETS series.
     build 2026.11.09-3   ·   shipped 2026-11-09T05:34:47Z (UTC)
     single-file, offline, no external deps
     ==================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Electronics Basics — Guided Bench</title>
<style>
  :root{
    --bench:#15171c; --card:#1b1f26; --card2:#21262f; --inset:#11141a;
    --ink:#e9edf1; --muted:#9aa6b2; --faint:#69727e; --line:#2b313b;
    --copper:#e0922f; --copper-d:#b6741f; --phos:#46d39a; --phos-d:#2c9d72;
    --red:#ec5b4f; --blue:#5b9bd6; --violet:#a98bdb;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, #1d222b 0%, transparent 60%),
      var(--bench);
    color:var(--ink); font-family:var(--sans); line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  /* ---------- frame ---------- */
  header{
    display:flex; align-items:center; gap:14px; padding:12px 18px;
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30;
    background:rgba(21,23,28,.9); backdrop-filter:blur(8px);
  }
  .brand{font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:13px}
  .brand b{color:var(--copper)}
  .badge{font-family:var(--mono); font-size:11px; color:var(--faint);
    border:1px solid var(--line); border-radius:6px; padding:3px 8px}
  .grow{flex:1}
  .rm{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:7px; cursor:pointer; user-select:none}
  .rm input{accent-color:var(--copper)}
  .progress{height:3px; background:var(--line); position:relative; z-index:30}
  .progress > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--copper),var(--phos)); transition:width .35s ease}

  .wrap{display:grid; grid-template-columns:248px 1fr; min-height:calc(100% - 49px)}
  /* ---------- table of contents ---------- */
  nav.toc{
    border-right:1px solid var(--line); padding:14px 10px 40px; overflow-y:auto;
    position:sticky; top:49px; height:calc(100vh - 49px);
  }
  .toc .part{font-size:10px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--faint); margin:16px 10px 6px}
  .toc button{
    display:flex; gap:9px; align-items:baseline; width:100%; text-align:left;
    background:none; border:0; color:var(--muted); font:inherit; font-size:13px;
    padding:7px 10px; border-radius:8px; cursor:pointer; line-height:1.3;
  }
  .toc button .n{font-family:var(--mono); font-size:11px; color:var(--faint); min-width:18px}
  .toc button:hover{background:var(--card)}
  .toc button.active{background:var(--card); color:var(--ink)}
  .toc button.active .n{color:var(--copper)}
  .toc button.done .n{color:var(--phos-d)}

  /* ---------- lesson pane ---------- */
  main{padding:30px clamp(18px,5vw,64px) 120px; max-width:920px}
  .eyebrow{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--copper); font-weight:600}
  h1.title{font-size:clamp(26px,4vw,40px); line-height:1.08; margin:.25em 0 .15em; letter-spacing:-.01em}
  .sub{color:var(--muted); font-size:16px; margin:0 0 22px; max-width:62ch}
  main p{max-width:66ch}
  main p, main li{font-size:15.5px}
  strong{color:var(--ink)}
  .key{color:var(--copper); font-weight:600}
  .term{border-bottom:1px dotted var(--faint)}
  h3.h{font-size:13px; letter-spacing:.04em; margin:30px 0 8px; color:var(--ink)}
  .lead{font-size:17px; color:var(--ink)}
  ul.clean{padding-left:20px; max-width:66ch} ul.clean li{margin:5px 0}

  /* ---------- bench readout (signature) ---------- */
  .bench{
    margin:22px 0; border:1px solid var(--line); border-radius:14px; overflow:hidden;
    background:linear-gradient(180deg,var(--card),#171b21);
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 14px 30px -22px #000;
  }
  .bench .strip{display:flex; align-items:center; gap:8px; padding:8px 12px;
    border-bottom:1px solid var(--line); background:var(--card2)}
  .bench .strip .dot{width:8px;height:8px;border-radius:50%;background:var(--phos);box-shadow:0 0 8px var(--phos)}
  .bench .strip .lbl{font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted)}
  .bench .body{display:grid; grid-template-columns:1fr 220px; gap:0}
  .bench .stage{padding:16px; display:flex; align-items:center; justify-content:center; min-height:190px; position:relative}
  .bench .panel{border-left:1px solid var(--line); background:var(--inset); padding:14px}
  @media(max-width:640px){ .bench .body{grid-template-columns:1fr} .bench .panel{border-left:0; border-top:1px solid var(--line)} }

  .ctrl{margin:0 0 14px}
  .ctrl label{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:5px}
  .ctrl label b{color:var(--ink); font-family:var(--mono)}
  input[type=range]{width:100%; accent-color:var(--copper); height:22px}
  .seg{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 12px}
  .seg button{flex:1; min-width:54px; background:var(--card); border:1px solid var(--line); color:var(--muted);
    border-radius:8px; padding:7px 6px; font:inherit; font-size:12px; cursor:pointer}
  .seg button.on{border-color:var(--copper); color:var(--copper); background:#241d14}
  .tog{display:inline-flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line);
    border-radius:999px; padding:6px 12px; cursor:pointer; font-size:13px; color:var(--muted); user-select:none}
  .tog.on{border-color:var(--phos); color:var(--phos)}
  .tog .sw{width:30px;height:16px;border-radius:999px;background:var(--line);position:relative;transition:.2s}
  .tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#cfd6dd;transition:.2s}
  .tog.on .sw{background:var(--phos-d)} .tog.on .sw::after{left:16px}

  .read{font-family:var(--mono)}
  .read .row{display:flex; justify-content:space-between; align-items:baseline; padding:6px 0; border-bottom:1px dashed var(--line)}
  .read .row:last-child{border-bottom:0}
  .read .k{font-size:11px; color:var(--faint); text-transform:uppercase; letter-spacing:.08em}
  .read .v{font-size:19px; color:var(--phos)}
  .read .v.warn{color:var(--red)} .read .v.cool{color:var(--blue)} .read .v.amber{color:var(--copper)}
  .read .u{font-size:11px; color:var(--faint); margin-left:3px}
  .note{font-size:12.5px; color:var(--muted); margin-top:10px}
  .warnbox{margin-top:10px; border:1px solid var(--red); background:#2a1714; color:#ffd9d4; border-radius:8px; padding:8px 11px; font-size:13px}

  /* ---------- project framing ---------- */
  .frame{margin:18px 0 4px; border:1px solid var(--line); border-radius:14px; overflow:hidden}
  .frame .r{display:grid; grid-template-columns:160px 1fr; border-bottom:1px solid var(--line)}
  .frame .r:last-child{border-bottom:0}
  .frame .r .t{padding:12px 14px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--copper);
    background:var(--card2); border-right:1px solid var(--line); font-weight:600}
  .frame .r .d{padding:12px 14px; font-size:14.5px}
  @media(max-width:640px){ .frame .r{grid-template-columns:1fr} .frame .r .t{border-right:0;border-bottom:1px solid var(--line)} }

  table.tt{border-collapse:collapse; font-family:var(--mono); font-size:13px; margin:4px 0}
  table.tt th,table.tt td{border:1px solid var(--line); padding:6px 12px; text-align:center}
  table.tt th{color:var(--muted); font-weight:600; font-size:11px; letter-spacing:.06em}
  table.tt tr.hot td{background:#241d14; color:var(--copper)}
  table.tt td.one{color:var(--phos)} table.tt td.zero{color:var(--faint)}

  .map{width:100%; border-collapse:collapse; font-size:13px; margin-top:6px}
  .map th,.map td{border-bottom:1px solid var(--line); padding:9px 10px; text-align:left; vertical-align:top}
  .map th{color:var(--muted); font-size:11px; letter-spacing:.08em; text-transform:uppercase}
  .map td.m{font-family:var(--mono); color:var(--copper); white-space:nowrap}

  /* ---------- footer nav ---------- */
  .nav{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; gap:10px; align-items:center;
    padding:12px clamp(14px,5vw,40px); border-top:1px solid var(--line);
    background:rgba(21,23,28,.92); backdrop-filter:blur(8px)}
  .nav .step{font-family:var(--mono); font-size:12px; color:var(--faint)}
  .nav .grow{flex:1}
  .btn{background:var(--card); border:1px solid var(--line); color:var(--ink); border-radius:10px;
    padding:10px 16px; font:inherit; font-size:14px; cursor:pointer; display:inline-flex; gap:8px; align-items:center}
  .btn:disabled{opacity:.4; cursor:not-allowed}
  .btn.go{background:var(--copper); border-color:var(--copper); color:#1a1206; font-weight:600}
  .btn.go:hover{background:#eaa043}

  .menu-btn{display:none; background:var(--card); border:1px solid var(--line); color:var(--ink);
    border-radius:8px; padding:6px 11px; font-size:13px; cursor:pointer}
  @media(max-width:860px){
    .wrap{grid-template-columns:1fr}
    nav.toc{position:fixed; left:0; top:49px; bottom:0; width:280px; background:var(--bench);
      z-index:40; transform:translateX(-100%); transition:transform .25s ease; box-shadow:0 0 40px #000}
    nav.toc.open{transform:none}
    .menu-btn{display:inline-block}
    main{padding-bottom:96px}
  }
  .scrim{display:none; position:fixed; inset:49px 0 0; background:rgba(0,0,0,.5); z-index:35}
  .scrim.show{display:block}

  /* svg helpers */
  /* ---------- origin stories ---------- */
  .origin{margin:4px 0 26px; border:1px solid var(--line); border-left:3px solid var(--copper); border-radius:12px; background:linear-gradient(180deg,#1d1a16,var(--card))}
  .origin summary{list-style:none; cursor:pointer; display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; padding:12px 14px; min-height:44px}
  .origin summary::-webkit-details-marker{display:none}
  .origin summary::before{content:"▸"; color:var(--copper); transition:transform .2s; display:inline-block}
  .origin[open] summary::before{transform:rotate(90deg)}
  .olabel{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--copper); font-weight:600; flex:1; min-width:180px}
  .verdict{font-size:11.5px; border-radius:999px; padding:3px 10px; border:1px solid; white-space:nowrap}
  .v-found{color:var(--blue); border-color:var(--blue)} .v-built{color:var(--copper); border-color:var(--copper)} .v-both{color:var(--violet); border-color:var(--violet)}
  .obody{padding:0 16px 14px}
  .obody h4{margin:14px 0 4px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  .obody p{margin:0 0 6px; font-size:15px}
  .evo{display:grid; grid-template-columns:repeat(4,1fr); gap:3px; margin:6px 0 10px}
  .evseg{font-size:10.5px; text-align:center; padding:5px 2px; border-radius:5px; background:var(--inset); color:var(--faint); border:1px solid var(--line)}
  .evseg.on{background:#2a2117; color:var(--copper-d); border-color:#4a3720}
  .evseg.cur{background:#3a2a16; color:var(--copper); border-color:var(--copper); font-weight:600}
  .otl{list-style:none; margin:12px 0 0; padding:0 0 0 12px; border-left:2px solid var(--line)}
  .otl li{position:relative; display:grid; grid-template-columns:76px 1fr; gap:10px; padding:5px 0; font-size:13.5px; color:var(--muted)}
  .otl li::before{content:""; position:absolute; left:-18px; top:11px; width:9px; height:9px; border-radius:50%; background:var(--copper)}
  .oy{font-family:var(--mono); color:var(--ink)}
  .handoff{margin:28px 0 8px; border:1px solid var(--copper-d); border-radius:14px; padding:14px 16px; background:#1f1810}
  .handoff .hot{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--copper); font-weight:600}
  .handoff a.btn{text-decoration:none; margin:4px 0 6px}
  .nbar{display:flex; height:26px; border-radius:8px; overflow:hidden; margin:10px 0 12px; font-size:11px; font-family:var(--mono)}
  .nbar span{display:flex; align-items:center; justify-content:center; color:#0b0d10; font-weight:600; white-space:nowrap; overflow:hidden; padding:0 4px}
  .nst{display:inline-block; border:1px solid; border-radius:999px; padding:1px 8px; font-size:11.5px; white-space:nowrap}
  table.neets td{font-size:13px}
  @media(max-width:640px){
    main table.neets{display:block; overflow:visible}
    table.neets tr:first-child{display:none}
    table.neets tr{display:grid; grid-template-columns:26px 1fr auto; gap:2px 8px; padding:10px 0; border-bottom:1px solid var(--line)}
    table.neets td{border:0; padding:0}
    table.neets td:nth-child(4), table.neets td:nth-child(5){grid-column:2 / 4; color:var(--muted); font-size:12.5px}
    table.neets td:nth-child(4)::before{content:"Taught: "; color:var(--phos)}
    table.neets td:nth-child(5)::before{content:"Still to do: "; color:var(--copper)}
  }
  .fgsvg{width:100%; max-width:430px}
  .fgvalve{cursor:pointer} .fgvalve:focus{outline:none} .fgvalve:focus-visible circle{stroke-width:3.5}
  .fgrule{font-size:16px; margin:14px 0 6px}
  .fgsay{border-left:3px solid var(--copper); background:var(--card); border-radius:0 10px 10px 0; padding:10px 14px; font-size:15px; margin:0 0 12px; max-width:66ch}
  .ladwrap{display:grid; grid-template-columns:minmax(200px,260px) 1fr; gap:14px; margin:14px 0}
  @media(max-width:640px){ .ladwrap{grid-template-columns:1fr} }
  .ladder{display:flex; flex-direction:column; gap:6px; border-left:3px solid var(--copper-d); padding-left:10px}
  .rung{display:flex; gap:10px; align-items:baseline; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 12px; color:var(--ink); font:inherit; font-size:14px; cursor:pointer; min-height:44px}
  .rung:hover{border-color:var(--copper)} .rung.on{border-color:var(--copper); background:#241d14}
  .ry{font-family:var(--mono); font-size:11.5px; color:var(--copper); min-width:62px}
  .rungdet{border:1px solid var(--line); border-radius:12px; padding:14px 16px; background:var(--card)}
  .rd-h{font-weight:600; color:var(--copper); margin-bottom:6px}
  .rd-k{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:10px}
  .rungdet pre{background:var(--inset); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-family:var(--mono); font-size:13px; color:var(--phos); white-space:pre-wrap; margin:6px 0}
  .kwork{border:1px solid var(--line); border-radius:12px; padding:12px 16px; background:var(--card); margin:12px 0; max-width:66ch}
  .kh{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--violet); font-weight:600; margin-bottom:6px}
  .ktab{width:100%; border-collapse:collapse; font-size:14px; margin:4px 0 8px}
  .ktab td{padding:6px 4px; border-bottom:1px dashed var(--line)}
  .ktab td.num{font-family:var(--mono); text-align:right; color:var(--phos); white-space:nowrap}
  .ktab tr.sum td{border-bottom:0; border-top:1px solid var(--line); font-weight:600}
  .ktab tr.sum td.num{color:var(--copper)}
  .handoff .hl{display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 6px}
  .ctrlrow{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0}
  .pcbpair{display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start; width:100%}
  .pcbpair svg{width:100%; height:auto; display:block; background:var(--bg2); border-radius:8px}
  @media (max-width:760px){ .pcbpair{grid-template-columns:1fr} }
  .ctrl select{width:100%; min-height:40px; background:var(--bg2); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:inherit}
  .tdia{border:1px solid var(--line); border-radius:12px; background:var(--card); padding:8px; margin:12px 0; max-width:66ch}
  .tdia svg{width:100%; height:auto; display:block}
  .kwork .mguess{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0}
  .kwork .good{color:var(--phos)}
  /* ---------- deep history ---------- */
  .pmlist{margin-top:4px}
  .pmlist li.last{color:var(--ink)} .pmlist li.none{opacity:.75}
  .bn{font-style:normal; color:var(--red); font-size:12px; margin-left:4px}
  .lostgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; margin:12px 0 18px}
  .lostcard{border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--card)}
  .lt{font-weight:600; color:var(--copper); margin-bottom:4px; font-size:14.5px}
  .ld{font-size:14px; color:var(--ink)}
  .eugrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; margin:12px 0}
  .eucard{display:flex; flex-direction:column; gap:6px; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; color:var(--ink); font:inherit; cursor:pointer; min-height:120px}
  .eucard:hover{border-color:var(--copper)}
  .euy{font-family:var(--mono); font-size:12px; color:var(--copper); letter-spacing:.04em}
  .eum{font-size:14.5px}
  .eub{display:none; font-size:14px; color:var(--muted); border-top:1px dashed var(--line); padding-top:8px}
  .eub b{color:var(--phos)}
  .eucard::after{content:"Tap for the years before ›"; font-size:12px; color:var(--faint); margin-top:auto}
  .eucard.flip .eub{display:block} .eucard.flip::after{content:"Tap to hide"}
  /* ---------- oscilloscope ---------- */
  .scopestage{padding:12px 10px}
  .scope{width:100%; max-width:420px}
  .sel{width:100%; background:var(--card); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:8px 10px; font:inherit; font-size:14px; min-height:40px}
  .sel:focus-visible{outline:2px solid var(--copper); outline-offset:1px}
  /* ---------- recall checks ---------- */
  .qcard{margin:16px 0; border:1px solid var(--line); border-radius:14px; padding:14px 16px; background:var(--card)}
  .qn{font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--copper); font-weight:600}
  .qq{margin:6px 0 12px; font-size:16px; color:var(--ink)}
  .qopts{display:grid; gap:8px}
  .qopt{text-align:left; background:var(--inset); border:1px solid var(--line); color:var(--ink); border-radius:10px;
    padding:11px 13px; font:inherit; font-size:15px; cursor:pointer; min-height:44px}
  .qopt:hover:not(:disabled){border-color:var(--copper)}
  .qopt:disabled{cursor:default; opacity:.55}
  .qopt.right{border-color:var(--phos); background:#10251c; color:var(--phos); opacity:1}
  .qopt.wrong{border-color:var(--red); background:#2a1714; color:#ffd9d4; opacity:1}
  .qwhy{margin-top:10px; font-size:14.5px; color:var(--muted)}
  .qwhy b{color:var(--ink)}
  .qsee{display:block; margin-top:8px; background:none; border:0; padding:4px 0; color:var(--copper); font:inherit; font-size:13.5px; cursor:pointer; text-align:left}
  .qsee:hover{text-decoration:underline}
  .qscore{margin-top:18px; padding:12px 14px; border:1px dashed var(--line); border-radius:10px; font-size:14.5px; color:var(--muted)}
  .qscore b{color:var(--copper); font-family:var(--mono)}
  .toc button .qbadge{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--phos-d)}
  .toc button.isquiz .n{color:var(--copper-d)}
  .toc .resetp{margin-top:22px; color:var(--faint); font-size:12px; justify-content:center; border:1px dashed var(--line)}
  /* ---------- glossary ---------- */
  .glossbtn{background:var(--card); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:6px 11px; font:inherit; font-size:13px; cursor:pointer}
  .glossbtn:hover{border-color:var(--copper)}
  .gloss{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.6); display:flex; justify-content:center; align-items:flex-start; padding:56px 14px 14px}
  .gloss[hidden]{display:none}
  .gpanel{width:100%; max-width:640px; max-height:calc(100vh - 80px); display:flex; flex-direction:column; background:var(--bench); border:1px solid var(--line); border-radius:14px; overflow:hidden}
  .ghead{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--line)}
  .ghead h2{margin:0; font-size:16px; letter-spacing:.06em}

  @media(max-width:340px){

  svg{max-width:100%; height:auto; overflow:visible}
  .reduce *{animation:none !important; transition:none !important}
</style>
</head>
<body>
<header>
  <button class="menu-btn" id="menuBtn" aria-label="Lessons">☰</button>
  <div class="brand">EL500 · <b>Learn</b></div>
  <span class="badge" id="badge">build 2026.11.09-3</span>
  <span class="grow"></span>
  <button class="glossbtn" id="glossBtn" type="button" aria-haspopup="dialog">Glossary</button>
  <label class="rm"><input type="checkbox" id="reduceMotion"> Reduce motion</label>
</header>
<div class="gloss" id="gloss" hidden role="dialog" aria-modal="true" aria-labelledby="glossTitle">
  <div class="gpanel">
    <div class="ghead">
      <h2 id="glossTitle">Glossary</h2>
      <button class="btn" id="glossClose" type="button">Close</button>
    </div>
    <input class="gsearch" id="glossQ" type="search" placeholder="Find a term — e.g. node, gain, τ" aria-label="Find a term">
    <div class="glist" id="glossList"></div>
  </div>
</div>
<div class="progress"><i id="progBar"></i></div>

<div class="wrap">
  <nav class="toc" id="toc" aria-label="Lessons"></nav>
  <main id="main"></main>
</div>
<div class="scrim" id="scrim"></div>

<div class="nav">
  <button class="btn" id="prev">‹ Back</button>
  <span class="step" id="stepLbl"></span>
  <span class="grow"></span>
  <button class="btn go" id="next">Next ›</button>
</div>

<script>
"use strict";
/* ====================================================================
   Engine: a linear sequence of lesson steps. Each step renders HTML and
   optionally wires a live micro-sim. Sims never measure layout (so they
   are deterministic and testable); all geometry is fixed in the SVG.
   ==================================================================== */
const NS="http://www.w3.org/2000/svg";
let REDUCE=false;
let anims=[];                       // cancel fns for the active step
function rAFLoop(fn){               // motion-respecting animation loop
  if(REDUCE){ fn(0); return; }
  let id, t0=null, stop=false;
  const tick=ts=>{ if(stop)return; if(t0===null)t0=ts; fn((ts-t0)/1000); id=requestAnimationFrame(tick); };
  id=requestAnimationFrame(tick);
  anims.push(()=>{ stop=true; cancelAnimationFrame(id); });
}
function clearAnims(){ anims.forEach(c=>c()); anims=[]; }
const el=(t,a,kids)=>{ const e=document.createElement(t); if(a)for(const k in a){ if(k==='html')e.innerHTML=a[k]; else e.setAttribute(k,a[k]); } (kids||[]).forEach(c=>e.appendChild(c)); return e; };
const S=(t,a)=>{ const e=document.createElementNS(NS,t); for(const k in (a||{}))e.setAttribute(k,a[k]); return e; };
const fmt=(x,d)=>{ const n=Math.abs(x); if(n>=1e6)return (x/1e6).toFixed(d??2)+'M'; if(n>=1e3)return (x/1e3).toFixed(d??2)+'k'; return x.toFixed(d??0); };

/* small reusable readout panel */
function readout(rows){ // rows: [{k, id, u, cls}]
  const wrap=el('div',{class:'read'});
  rows.forEach(r=>{
    wrap.appendChild(el('div',{class:'row'},[
      el('span',{class:'k'},[document.createTextNode(r.k)]),
      el('span',{},[ Object.assign(document.createElement('span'),{className:'v '+(r.cls||''),id:r.id}),
                     el('span',{class:'u'},[document.createTextNode(r.u||'')]) ])
    ]));
  });
  return wrap;
}
function bench(label, stageSvg, panelEl){
  return el('div',{class:'bench'},[
    el('div',{class:'strip'},[ el('span',{class:'dot'}), el('span',{class:'lbl'},[document.createTextNode(label)]) ]),
    el('div',{class:'body'},[
      el('div',{class:'stage'},[stageSvg]),
      el('div',{class:'panel'},[panelEl])
    ])
  ]);
}

/* ====================================================================
   OSCILLOSCOPE — a 10 × 8 division graticule, like a real scope.
   Two ways to feed it:
     push(t, [v…]) + draw(tNow)  → roll mode from recorded samples (state that depends on history)
     drawFn(tEnd, f)              → evaluate f(t) finely across the window (exact edges, no frame aliasing)
   ==================================================================== */
const DIVS=[0.001,0.002,0.005,0.01,0.02,0.05,0.1,0.2,0.5,1,2,5,10,20];
function niceDiv(x){ for(const d of DIVS) if(d>=x*0.999) return d; return DIVS[DIVS.length-1]; }
function fmtTime(s){ if(s<1e-3) return +(s*1e6).toFixed(0)+' µs'; if(s<1) return +(s*1e3).toFixed(s<0.01?1:0)+' ms'; return +s.toFixed(2)+' s'; }
function makeScope(o){
  const W=320,H=200,GX=W/10,GY=H/8;
  let vdiv=o.vdiv||2, tdiv=o.tdiv||0.5; const zero=o.zeroDiv??1, chans=o.chans;
  const svg=S('svg',{viewBox:`-30 -8 ${W+38} ${H+34}`,class:'scope',role:'img','aria-label':'Oscilloscope screen: voltage up the side, time along the bottom'});
  svg.appendChild(S('rect',{x:0,y:0,width:W,height:H,rx:6,fill:'#0b1210',stroke:'#24332d'}));
  for(let i=1;i<10;i++) svg.appendChild(S('line',{x1:i*GX,y1:0,x2:i*GX,y2:H,stroke:'#1d2b26','stroke-width':i===5?1.4:1,'stroke-dasharray':i===5?'':'2 3'}));
  for(let j=1;j<8;j++) svg.appendChild(S('line',{x1:0,y1:j*GY,x2:W,y2:j*GY,stroke:'#1d2b26','stroke-width':j===4?1.4:1,'stroke-dasharray':j===4?'':'2 3'}));
  const yOf=v=>H-(zero+v/vdiv)*GY;
  const zc=ci=>(chans[ci].zero??zero), yC=(ci,v)=>H-(zc(ci)+v/vdiv)*GY;
  const multi=chans.some(c=>c.zero!=null);
  const gnd=S('path',{fill:'var(--faint)'}); svg.appendChild(gnd);
  const gndT=S('text',{x:-26,y:0,fill:'var(--faint)','font-size':'9'}); gndT.textContent='0 V'; svg.appendChild(gndT);
  const chMarks=chans.map((c,ci)=>{ const g=S('g',{}); const pth=S('path',{fill:c.color}); const tx=S('text',{x:-24,fill:c.color,'font-size':'9','font-family':'var(--mono)'}); tx.textContent=String(ci+1); g.appendChild(pth); g.appendChild(tx); if(multi) svg.appendChild(g); return {pth,tx}; });
  const refG=S('g',{}); svg.appendChild(refG);
  const lines=chans.map(c=>{ const p=S('polyline',{fill:'none',stroke:c.color,'stroke-width':2.2,'stroke-linejoin':'round',points:''}); svg.appendChild(p); return p; });
  const info=S('text',{x:0,y:H+16,fill:'var(--muted)','font-size':'10','font-family':'var(--mono)'}); svg.appendChild(info);
  const leg=S('text',{x:W,y:H+16,'font-size':'10','text-anchor':'end','font-family':'var(--mono)'}); svg.appendChild(leg);
  chans.forEach((c,i)=>{ const ts=document.createElementNS(NS,'tspan'); ts.setAttribute('fill',c.color); ts.textContent=(i?'   ':'')+'■ '+c.name; leg.appendChild(ts); });
  let refs=o.refs||[], buf=[];
  function chrome(){
    const g=yOf(0); if(multi){ gnd.setAttribute('d',''); gndT.textContent=''; chMarks.forEach((m,ci)=>{ const y=yC(ci,0); m.pth.setAttribute('d',`M-8 ${y-4} L-1 ${y} L-8 ${y+4} Z`); m.tx.setAttribute('y',y+3); }); }
    else { gnd.setAttribute('d',`M-8 ${g-4} L-1 ${g} L-8 ${g+4} Z`); gndT.setAttribute('y',g-6); }
    info.textContent=`${vdiv} V/div    ${fmtTime(tdiv)}/div`;
    refG.innerHTML=''; refs.forEach(r=>{ const y=yOf(r.v); if(y<0||y>H) return;
      refG.appendChild(S('line',{x1:0,y1:y,x2:W,y2:y,stroke:r.color||'var(--copper)','stroke-dasharray':'5 4',opacity:.7}));
      const t=S('text',{x:W-4,y:y-4,fill:r.color||'var(--copper)','font-size':'9','text-anchor':'end'}); t.textContent=r.label; refG.appendChild(t); });
  }
  const clip=y=>Math.max(-1,Math.min(H+1,y));
  const api={ el:svg,
    set(p){ if(p.vdiv!=null) vdiv=p.vdiv; if(p.tdiv!=null) tdiv=p.tdiv; if(p.refs) refs=p.refs; chrome(); },
    get tdiv(){ return tdiv; }, get vdiv(){ return vdiv; },
    clear(){ buf=[]; lines.forEach(l=>l.setAttribute('points','')); },
    push(t,vals){ buf.push([t,...vals]); const keep=t-10*tdiv*1.1; while(buf.length>2 && buf[1][0]<keep) buf.shift(); if(buf.length>4000) buf.splice(0,buf.length-4000); },
    draw(tNow){ const win=10*tdiv, t0=tNow-win;
      chans.forEach((c,ci)=>{ let pts='', prev=null;
        for(const s of buf){ if(s[0]<t0) { prev=s; continue; }
          const x=(s[0]-t0)/win*W, y=clip(yC(ci,s[ci+1]));
          if(c.step && prev && pts) pts+=`${x.toFixed(1)},${clip(yC(ci,prev[ci+1])).toFixed(1)} `;
          pts+=`${x.toFixed(1)},${y.toFixed(1)} `; prev=s; }
        lines[ci].setAttribute('points',pts); }); },
    drawFn(tEnd,f,n){ n=n||480; const win=10*tdiv, t0=tEnd-win; const cols=chans.map(()=>[]);
      let prev=null;
      for(let i=0;i<=n;i++){ const t=t0+win*i/n, v=f(t), x=(i/n*W).toFixed(1);
        chans.forEach((c,ci)=>{ if(v[ci]==null || Number.isNaN(v[ci])) return; // not happened yet: leave the screen blank there
          if(c.step && prev && prev[ci]!=null && prev[ci]!==v[ci]) cols[ci].push(`${x},${clip(yC(ci,prev[ci])).toFixed(1)}`); cols[ci].push(`${x},${clip(yC(ci,v[ci])).toFixed(1)}`); });
        prev=v; }
      cols.forEach((c,ci)=>lines[ci].setAttribute('points',c.join(' '))); }
  };
  chrome(); return api;
}
function scopeBench(label, scope, panelEl){
  return el('div',{class:'bench'},[
    el('div',{class:'strip'},[ el('span',{class:'dot'}), el('span',{class:'lbl'},[document.createTextNode(label)]) ]),
    el('div',{class:'body'},[ el('div',{class:'stage scopestage'},[scope.el]), el('div',{class:'panel'},[panelEl]) ])
  ]);
}
function selectCtrl(label,id,opts,val,fmt){ // opts: numbers
  const wrap=el('div',{class:'ctrl'},[el('label',{for:id},[document.createTextNode(label)])]);
  const s=el('select',{id,class:'sel'}); opts.forEach(v=>{ const op=el('option',{value:String(v)},[document.createTextNode(fmt?fmt(v):String(v))]); if(v===val) op.selected=true; s.appendChild(op); });
  wrap.appendChild(s); return {wrap,sel:s};
}

/* ====================================================================
   STEPS
   ==================================================================== */
const STEPS=[];
const P_FOUND="Foundations", P_COMP="Components", P_PROJ="Projects", P_SYS="Systems";

/* ---- saved progress (this browser only; keyed by lesson name so it survives new lessons) ---- */
const STORE_KEY='el500-learn-v1';
const PROG=(()=>{ try{ const o=JSON.parse(localStorage.getItem(STORE_KEY)||'{}'); return {at:o.at||null, seen:Array.isArray(o.seen)?o.seen:[], quiz:o.quiz||{}, oc:o.oc===1?1:0}; }catch(e){ return {at:null,seen:[],quiz:{},oc:0}; } })();
function saveProg(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(PROG)); }catch(e){} }

/* ---- recall check: a step that asks, waits for an answer, then explains ---- */
function recallStep(part, id, nav, title, sub, qs){
  return {part, nav, title, sub, quiz:true, body(root){
    root.appendChild(el('p',{class:'note',html:"Answer from memory before you look anything up — the effort of pulling an answer out is what makes it stick. Every answer explains itself, right or wrong."}));
    let answered=0, right=0;
    const score=el('div',{class:'qscore',role:'status'});
    function paintScore(){
      score.innerHTML = answered<qs.length
        ? `<b>${answered}</b> of ${qs.length} answered`
        : `<b>${right} / ${qs.length}</b> from memory. ` + (right===qs.length ? 'Solid — on to the next part.' : 'Revisit the lessons linked under any you missed, then come back and try again.');
    }
    qs.forEach((q,qi)=>{
      const card=el('div',{class:'qcard'});
      card.appendChild(el('div',{class:'qn'},[document.createTextNode('Question '+(qi+1))]));
      card.appendChild(el('p',{class:'qq',html:q.q}));
      const opts=el('div',{class:'qopts'});
      const why=el('div',{class:'qwhy',role:'status'});
      q.o.forEach((txt,oi)=>{
        const b=el('button',{class:'qopt',type:'button',html:txt});
        b.addEventListener('click',()=>{
          if(card.dataset.done) return;
          card.dataset.done='1'; answered++;
          const ok=oi===q.a; if(ok) right++;
          opts.querySelectorAll('.qopt').forEach((x,xi)=>{ x.disabled=true; if(xi===q.a) x.classList.add('right'); else if(xi===oi) x.classList.add('wrong'); });
          why.innerHTML=`<b>${ok?'Correct.':'Not quite — the answer is highlighted.'}</b> ${q.why}`;
          if(q.see){ const link=el('button',{class:'qsee',type:'button'},[document.createTextNode('Revisit: '+q.see+' ›')]);
            link.addEventListener('click',()=>goNav(q.see)); why.appendChild(link); }
          paintScore();
          if(answered===qs.length){ const best=Math.max(PROG.quiz[id]||0,right); PROG.quiz[id]=best; saveProg(); paintTOC(); }
        });
        opts.appendChild(b);
      });
      card.appendChild(opts); card.appendChild(why); root.appendChild(card);
    });
    paintScore(); root.appendChild(score);
    const again=el('button',{class:'btn',type:'button',style:'margin-top:10px'},[document.createTextNode('Reset these questions')]);
    again.addEventListener('click',()=>go(cur)); root.appendChild(again);
    if(PROG.quiz[id]!=null) root.appendChild(el('p',{class:'note'},[document.createTextNode('Best so far: '+PROG.quiz[id]+' / '+qs.length)]));
  }, quizId:id, qcount:qs.length};
}

/* ---- Foundations: the notation (numbers, units, prefixes, symbols) ---- */
STEPS.push({part:P_FOUND, nav:"First: the language", title:"First, the language: numbers, units & symbols",
  sub:"Two minutes on notation before any electricity — because every lesson after this is written in it, and you already use the core idea every day.",
  body(root){
    root.appendChild(el('p',{class:'lead',html:"You don’t write $0.05 — you say <strong>5 cents</strong>. Same money, friendlier unit. Electronics does that exact trick with every quantity, and once you see the pattern, the symbols stop being mysterious."}));
    root.appendChild(el('p',{html:"<strong>A measurement is a number + a unit.</strong> “12 V” is the number 12 with the unit <em>volts</em>. The unit says <em>what</em> you’re counting; the number says <em>how many</em>. Strip the unit off and the number means nothing — 12 volts, 12 ohms, and 12 dollars are wildly different things."}));
    root.appendChild(el('p',{html:"<strong>Why prefixes exist.</strong> Electronics spans an enormous range — millionths of an amp in a sensor, thousands of ohms in a resistor. Writing 0.000050 or 4700 everywhere invites mistakes, so we shift the number by factors of <strong>1000</strong> and rename it with a <span class='key'>prefix</span>. Every step is ×1000 or ÷1000 — that’s the whole system."}));
    // interactive prefix ladder
    const svg=S('svg',{viewBox:'0 0 360 110'});
    const bands=[['µ','micro',-6],['m','milli',-3],['—','(base unit)',0],['k','kilo',3],['M','mega',6]];
    const BX0=20,BX1=340,BW=(BX1-BX0)/5;
    bands.forEach((b,i)=>{ const x=BX0+i*BW;
      svg.appendChild(S('rect',{id:'band'+i,x:x+3,y:30,width:BW-6,height:44,rx:7,fill:'var(--card2)',stroke:'var(--line)'}));
      const t=S('text',{x:x+BW/2,y:52,fill:'var(--ink)','font-size':'15','text-anchor':'middle','font-family':'var(--mono)'}); t.textContent=b[0]; svg.appendChild(t);
      const s=S('text',{x:x+BW/2,y:66,fill:'var(--faint)','font-size':'8.5','text-anchor':'middle'}); s.textContent=b[1]; svg.appendChild(s);
      const e=S('text',{x:x+BW/2,y:22,fill:'var(--faint)','font-size':'8','text-anchor':'middle'}); e.textContent=(b[2]===0?'×1':(b[2]<0?'÷'+ '1'+'0'.repeat(-b[2]):'×1'+'0'.repeat(b[2]))); svg.appendChild(e);
    });
    const marker=S('path',{id:'pfMark',d:'',fill:'var(--copper)'}); svg.appendChild(marker);
    const panel=el('div',{},[]);
    const seg=el('div',{class:'seg'},[]); [['A','amps'],['Ω','ohms'],['F','farads']].forEach((u,i)=>{const b=el('button',{class:i===0?'on':''},[document.createTextNode(u[0]+' · '+u[1])]); b.dataset.u=u[0]; seg.appendChild(b);}); panel.appendChild(seg);
    const cE=el('div',{class:'ctrl'},[el('label',{},[document.createTextNode('Size (×10 per step)'),Object.assign(document.createElement('b'),{id:'pfExp'})])]);
    const rngE=el('input',{type:'range',min:'-6',max:'6',step:'1',value:'-4'}); cE.appendChild(rngE);
    panel.appendChild(cE);
    panel.appendChild(readout([{k:'Reads as',id:'pfNice',u:'',cls:'amber'},{k:'Plain number',id:'pfPlain',u:''},{k:'Powers of ten',id:'pfSci',u:''}]));
    root.appendChild(bench('PREFIX LADDER', svg, panel));
    let unit='A';
    const PFX={'-6':'µ','-3':'m','0':'','3':'k','6':'M'};
    function plain(exp){ if(exp>=0){ let s='1'+'0'.repeat(exp); return s.replace(/\B(?=(\d{3})+(?!\d))/g,','); } return '0.'+'0'.repeat(-exp-1)+'1'; }
    function upd(){
      const exp=parseInt(rngE.value,10);
      const g=Math.floor(exp/3)*3; const mant=Math.round(Math.pow(10,exp-g));
      const pfx=PFX[String(g)]||'';
      root.querySelector('#pfExp').textContent=(exp>=0?'+':'')+exp;
      root.querySelector('#pfNice').textContent=mant+' '+pfx+unit;
      root.querySelector('#pfPlain').textContent=plain(exp)+' '+unit;
      root.querySelector('#pfSci').textContent='1×10'+sup(exp)+' '+unit;
      // marker over the active band
      const bi=[-6,-3,0,3,6].indexOf(g); const x=BX0+(bi<0?0:bi)*BW + BW/2;
      marker.setAttribute('d',`M${x-6} 80 L${x+6} 80 L${x} 90 Z`);
      [0,1,2,3,4].forEach(i=>{ const r=root.querySelector('#band'+i); const on=i===bi; r.setAttribute('stroke',on?'var(--copper)':'var(--line)'); r.setAttribute('fill',on?'#241d14':'var(--card2)'); });
    }
    function sup(n){ const m={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'}; return String(n).split('').map(c=>m[c]||c).join(''); }
    seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{unit=b.dataset.u; seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); upd();}));
    rngE.addEventListener('input',upd); upd();
    root.appendChild(el('p',{class:'note',html:"Slide it: every time you cross into a new prefix the lead number resets to 1, because you’ve folded three zeros into the prefix. That’s the entire point — keep the number small and readable. <strong>Watch the case:</strong> small <strong>m</strong> = milli (tiny), capital <strong>M</strong> = mega (huge). They are a billion-fold apart."}));
    root.appendChild(el('h3',{class:'h'},[document.createTextNode('The prefixes worth knowing')]));
    const pt=el('table',{class:'map'});
    pt.appendChild(el('tr',{},[el('th',{},[document.createTextNode('symbol')]),el('th',{},[document.createTextNode('name')]),el('th',{},[document.createTextNode('factor')]),el('th',{},[document.createTextNode('zeros')])]));
    [['p','pico','÷ 1,000,000,000,000','trillionth'],['n','nano','÷ 1,000,000,000','billionth'],['µ','micro','÷ 1,000,000','millionth'],['m','milli','÷ 1,000','thousandth'],['(none)','base unit','× 1','—'],['k','kilo','× 1,000','thousand'],['M','mega','× 1,000,000','million'],['G','giga','× 1,000,000,000','billion']].forEach(r=>pt.appendChild(el('tr',{},[el('td',{class:'m'},[document.createTextNode(r[0])]),el('td',{},[document.createTextNode(r[1])]),el('td',{},[document.createTextNode(r[2])]),el('td',{},[document.createTextNode(r[3])])])));
    root.appendChild(pt);
    root.appendChild(el('p',{class:'note',html:"You only need four for this kit — <strong>µ, m, k, M</strong> — and the rest slot in by the same ×1000 rhythm. Notice they jump by 1000s; the everyday ones like <em>centi</em> (as in centimeter, ÷100) mostly don’t show up in electronics."}));
    root.appendChild(el('h3',{class:'h'},[document.createTextNode('Quantity vs. unit — why “I” and “A” both touch current')]));
    root.appendChild(el('p',{html:"Every measurement has <strong>two different jobs</strong> in it, and they’re easy to mix up. The <span class='key'>quantity</span> is the thing you’re measuring; the <span class='key'>unit</span> is the yardstick you measure it in. They sit on opposite sides of the equals sign:"}));
    root.appendChild(el('p',{class:'lead',style:'font-family:var(--mono);font-size:16px',html:"I = 0.04 A &nbsp;→&nbsp; “the <strong>current</strong> (I) equals 0.04 <strong>amperes</strong> (A)”"}));
    root.appendChild(el('p',{html:"It’s the same split you already use for distance: <em>d = 5 m</em> — “d” is the quantity (distance), “m” is the unit (meters). Nobody asks why both “mean distance,” because they don’t: one names <em>what</em>, the other names <em>how much, in what</em>. So the rule is simply: <strong>letters in a formula are quantities; letters after a number are units.</strong>"}));
    const qt=el('table',{class:'map'});
    qt.appendChild(el('tr',{},[el('th',{},[document.createTextNode('quantity')]),el('th',{},[document.createTextNode('symbol in formulas')]),el('th',{},[document.createTextNode('unit')]),el('th',{},[document.createTextNode('unit symbol')])]));
    [['current','I','ampere','A'],['voltage','V','volt','V'],['resistance','R','ohm','Ω'],['power','P','watt','W'],['capacitance','C','farad','F']].forEach(r=>qt.appendChild(el('tr',{},[el('td',{},[document.createTextNode(r[0])]),el('td',{class:'m'},[document.createTextNode(r[1])]),el('td',{},[document.createTextNode(r[2])]),el('td',{class:'m'},[document.createTextNode(r[3])])])));
    root.appendChild(qt);
    root.appendChild(el('p',{class:'note',html:"<strong>Voltage is the trap:</strong> its quantity symbol and its unit symbol are <em>both</em> “V,” so “V = 5 V” really does say “voltage equals 5 volts.” That’s just bad luck of notation — and it’s exactly why current borrows <strong>I</strong> (from <em>intensité</em>) instead of C: the letter C was already taken by the coulomb. When a formula symbol and a unit symbol collide, context (formula side vs. after-a-number side) tells them apart."}));
    root.appendChild(el('h3',{class:'h'},[document.createTextNode('The symbols you’ll meet')]));
    const st=el('table',{class:'map'});
    st.appendChild(el('tr',{},[el('th',{},[document.createTextNode('symbol')]),el('th',{},[document.createTextNode('reads as')]),el('th',{},[document.createTextNode('measures')]),el('th',{},[document.createTextNode('note')])]));
    [['Ω','ohm','resistance','Greek capital “omega” — engineers borrow Greek letters constantly'],['µ','micro','the prefix above','Greek lowercase “mu”; often typed as “u” (uF = µF)'],['V','volt','voltage','after Volta'],['A','amp (ampere)','current','after Ampère'],['W','watt','power','after James Watt'],['F','farad','capacitance','after Faraday'],['Hz','hertz','frequency','after Hertz — cycles per second']].forEach(r=>st.appendChild(el('tr',{},[el('td',{class:'m'},[document.createTextNode(r[0])]),el('td',{},[document.createTextNode(r[1])]),el('td',{},[document.createTextNode(r[2])]),el('td',{},[document.createTextNode(r[3])])])));
    root.appendChild(st);
    root.appendChild(el('p',{class:'note',html:"Putting it together, a label like <strong>4.7&nbsp;kΩ</strong> reads “4.7 kilo-ohms” = 4.7 × 1000 = 4700 ohms; <strong>100&nbsp;µF</strong> is “100 micro-farads.” That’s the whole language. With it in hand, the rest of the bench is just electricity."}));
  }});

STEPS.push({part:P_FOUND, nav:"What electricity is", title:"Three quantities, one idea",

      "The plumbing picture is exact enough to build on: <strong>voltage</strong> is water <em>pressure</em>, <strong>current</strong> is the <em>flow rate</em> through the pipe, and <strong>resistance</strong> is how much the pipe <em>pinches</em> that flow. Raise pressure and more flows. Pinch the pipe and less flows."}));

    panel.appendChild(el('div',{class:'note',html:"This is <span class='key'>Ohm’s Law</span>: <strong>V = I × R</strong>, where <strong>I</strong> is current (amps — the symbol comes from the French <em>intensité</em>). Memorize it; every other lesson leans on it."}));
    panel.appendChild(el('div',{class:'note',html:"<strong>Why 0.04 A and 40 mA are the same current.</strong> Ohm’s law hands you amps directly: 12 ÷ 300 = 0.04 A. This bench shows <strong>milliamps</strong> because real circuits run in tiny fractions of an amp, and <em>milli-</em> means a thousandth — so 0.04 A × 1000 = 40 mA. No new math, just a friendlier unit. The prefixes you’ll keep meeting:<table class='tt' style='margin-top:8px'><tr><th>prefix</th><th>means</th><th>example</th></tr><tr><td>k · kilo</td><td>× 1000</td><td>1 kΩ = 1000 Ω</td></tr><tr><td>m · milli</td><td>÷ 1000</td><td>40 mA = 0.04 A</td></tr><tr><td>µ · micro</td><td>÷ 1,000,000</td><td>50 µA = 0.00005 A</td></tr><tr><td>M · mega</td><td>× 1,000,000</td><td>1 MΩ = 1,000,000 Ω</td></tr></table>"}));

/* ---- Foundations: Georg Ohm (history + rediscover-the-law sim) ---- */
STEPS.push({part:P_FOUND, nav:"Who was Georg Ohm?", title:"Who was Georg Ohm?",
  sub:"A struggling schoolteacher with homemade gear pried the law out of noisy data — and was mocked for it before being vindicated.",
  body(root){
    root.appendChild(el('p',{class:'lead',html:"<span class='key'>Georg Simon Ohm</span> (1789–1854) was the son of a self-taught locksmith in Erlangen, Bavaria, who drilled his sons in mathematics and physics at home. Georg became a <strong>secondary-school math and physics teacher</strong> — not a celebrated professor. That ordinary post mattered: the school where he taught in Cologne (around 1817) had a real physics laboratory, and he used it."}));
    root.appendChild(el('p',{html:"<strong>Why the law was needed.</strong> When Ohm began, electricity was mostly qualitative. Volta’s battery (1800) had only recently produced a steady current, and Ørsted had just shown (1820) that a current deflects a compass needle. People could make currents and watch their effects, but no one had a clean rule linking how hard you push (voltage) to how much flows (current). Growing interest in telegraphy and electrical machinery made that missing rule urgent."}));
    root.appendChild(el('p',{html:"<strong>How he cracked it.</strong> The batteries of his day drifted — their voltage sagged as they discharged, wrecking careful measurement. Ohm’s key move was to drop them for a <span class='key'>thermocouple</span>: two dissimilar metals joined, one junction in boiling water and the other in ice, giving a steady, repeatable driving voltage (the Seebeck effect, discovered just in 1821). He read the current from how far it twisted a magnetic needle on a torsion balance, an instrument descended from Coulomb’s. Then came the patient part: swap in wires of different length and record the deflection. Current fell in exact proportion to a wire’s length — its resistance — and rose with the driving force. Out fell I = V ÷ R."}));
    root.appendChild(el('p',{html:"<strong>The cold reception.</strong> He published in 1827 as a book — <em>Die galvanische Kette, mathematisch bearbeitet</em> (“The Galvanic Circuit Investigated Mathematically”). It landed badly. German academia leaned on a romantic, anti-mathematical view of nature, and influential figures waved it off. Stung, Ohm reportedly resigned his Cologne post and spent years in obscurity and money trouble."}));
    root.appendChild(el('p',{html:"<strong>Vindication.</strong> Recognition came from abroad first: Britain’s Royal Society gave him the <span class='key'>Copley Medal in 1841</span> and made him a foreign member. Late in life he finally won the chair he’d earned — professor of experimental physics at Munich, 1852 — two years before he died in 1854. The unit of resistance, the <strong>ohm (Ω)</strong>, carries his name."}));
    const svg=S('svg',{viewBox:'0 0 360 200'});
    const X0=60,X1=340,Y0=160,Y1=30, Imax=110;
    svg.appendChild(S('line',{x1:X0,y1:Y1,x2:X0,y2:Y0,stroke:'var(--line)'}));
    svg.appendChild(S('line',{x1:X0,y1:Y0,x2:X1,y2:Y0,stroke:'var(--line)'}));
    const yLab=S('text',{x:54,y:36,fill:'var(--faint)','font-size':'9','text-anchor':'end'}); yLab.textContent='I'; svg.appendChild(yLab);
    const xLab=S('text',{id:'ohmX',x:X1,y:174,fill:'var(--faint)','font-size':'9','text-anchor':'end'}); xLab.textContent='wire length'; svg.appendChild(xLab);
    const curve=S('polyline',{id:'ohmCv',points:'',fill:'none',stroke:'var(--phos-d)','stroke-width':2}); svg.appendChild(curve);
    const dot=S('circle',{id:'ohmDot',cx:X0,cy:Y1,r:5,fill:'var(--copper)'}); svg.appendChild(dot);
    const panel=el('div',{},[]);
    const cL=el('div',{class:'ctrl'},[el('label',{},[document.createTextNode('Test-wire length'),Object.assign(document.createElement('b'),{id:'ohmLv'})])]);
    const rngL=el('input',{type:'range',min:'1',max:'10',step:'0.1',value:'3'}); cL.appendChild(rngL);
    panel.appendChild(cL);
    const seg=el('div',{class:'seg'},[]); const bA=el('button',{class:'on'},[document.createTextNode('x = length')]); const bB=el('button',{},[document.createTextNode('x = 1 ÷ length')]);
    seg.appendChild(bA); seg.appendChild(bB); panel.appendChild(seg);
    panel.appendChild(readout([{k:'Resistance (∝ length)',id:'ohmR',u:'',cls:'amber'},{k:'Galvanometer',id:'ohmI',u:'mA'}]));
    root.appendChild(bench('OHM’S BENCH · 1826', svg, panel));
    let mode='L';
    const px=frac=>X0+frac*(X1-X0), py=I=>Y0-(I/Imax)*(Y0-Y1);
    const xf=L=> mode==='L' ? (L-1)/9 : ((1/L)-0.1)/(1-0.1);
    function drawCurve(){ let pts=''; for(let i=0;i<=60;i++){ const L=1+i/60*9, I=110/L; pts+=`${px(xf(L)).toFixed(1)},${py(I).toFixed(1)} `; } curve.setAttribute('points',pts); xLab.textContent = mode==='L'?'wire length':'1 ÷ length'; }
    function upd(){ const L=parseFloat(rngL.value), I=110/L;
      root.querySelector('#ohmLv').textContent=L.toFixed(1)+' units';
      root.querySelector('#ohmR').textContent=L.toFixed(1)+'×';
      root.querySelector('#ohmI').textContent=I.toFixed(0);
      dot.setAttribute('cx',px(xf(L))); dot.setAttribute('cy',py(I)); }
    rngL.addEventListener('input',upd);
    bA.addEventListener('click',()=>{mode='L';bA.classList.add('on');bB.classList.remove('on');drawCurve();upd();});
    bB.addEventListener('click',()=>{mode='invL';bB.classList.add('on');bA.classList.remove('on');drawCurve();upd();});
    drawCurve(); upd();
    root.appendChild(el('p',{class:'note',html:"Recreate his trick: a steady source, a wire you lengthen, a galvanometer. Raw current-vs-length is a curve — but flip the axis to <strong>1 ÷ length</strong> and it snaps into a straight line through the origin. Current is proportional to 1 ÷ resistance at fixed voltage. That line <em>is</em> Ohm’s law, and watching it appear is the move that convinced him."}));
  }});

 battery:{name:'Battery',year:1800,pre:[

STEPS.push({part:P_FOUND, nav:"Why it took so long", title:"Why didn’t anyone build this sooner?",
  sub:"People in 300 BCE were just as clever as us. What they lacked was a stack of earlier pieces — and electricity hides itself better than almost anything.",
  body(root){
    root.appendChild(el('p',{class:'lead',html:"Humans noticed electricity at least 4,500 years ago: Egyptian tomb art shows the electric catfish of the Nile, and in the 1st century CE the Roman physician Scribonius Largus recommended the shock of a torpedo ray for headaches. Rubbed amber and natural magnets (lodestones) were written about by the Greeks. Yet the first steady electric current came only in <strong>1800</strong>. Why the 2,400-year gap?"}));
    root.appendChild(el('p',{html:"Not because people were less intelligent. Every invention sits on top of earlier ones, and for electricity six kinds of piece had to exist first:"}));
    const why=el('table',{class:'map'});
    why.appendChild(el('tr',{},[el('th',{},[document.createTextNode('missing piece')]),el('th',{},[document.createTextNode('why it held things back')])]));
    [['Notice it','Electricity is invisible, silent and usually harmless at small scale. In nature it shows up only as lightning, sparks and a few strange fish, so there was little to study.'],
     ['Detect & measure it','You can’t study what you can’t detect. There was no instrument that reacted to current until 1820, and Ohm’s law (1827) needed one to be found.'],
     ['Make the materials','Zinc boils away before it can be smelted out of its ore, so Europe only made it in quantity in the 1700s. Vacuum tubes needed good vacuum pumps; transistors needed silicon purer than anything nature makes.'],
     ['Explain & predict it','Radio was predicted by Maxwell’s equations (1865) before anyone built it. Those equations needed calculus, invented in the late 1600s. Transistors needed quantum mechanics, from the 1920s.'],
     ['Share & build on results','Hand-copied scrolls drift with every copy and can be destroyed in one fire. The printing press (1440s) and scientific journals (1665) let results be checked and built on.'],
     ['A reason to pay for it','Big steps came when someone needed them: railways needed the telegraph, navies needed wireless, the phone network needed the transistor.']
    ].forEach(r=>why.appendChild(el('tr',{},[el('td',{class:'m'},[document.createTextNode(r[0])]),el('td',{},[document.createTextNode(r[1])])])));
    root.appendChild(why);
    root.appendChild(el('p',{html:"Pick an invention below. Each dot is one piece it needed, placed by <strong>how long before the invention</strong> it existed. The scale stretches recent years, so 10 and 100 years before get equal room. The <strong>last piece to arrive</strong> is the bottleneck: the invention can’t appear before it, and usually appears soon after."}));

    // ---- prerequisite map
    const W=340, X0=12, X1=W-12, rowH=22, top=26;
    // time is measured BACKWARDS from the invention, on a log scale: 1, 10, 100, 1,000 years before each get equal room
    let span=1, invYear=0; const XR=X1-34;
    const xOf=y=>X0+(1-Math.log10(Math.max(1,invYear+1-y))/span)*(XR-X0);
    const svg=S('svg',{viewBox:`0 0 ${W} ${top+PRECATS.length*rowH+30}`,role:'img','aria-label':'How long before the invention each piece it needed existed'});
    const ticksG=S('g',{}); svg.appendChild(ticksG);
    PRECATS.forEach(([k,label,col],i)=>{ const y=top+i*rowH+rowH/2;
      svg.appendChild(S('line',{x1:X0,y1:y,x2:X1,y2:y,stroke:'#262c35'}));
      const t=S('text',{x:X0,y:y-5,fill:col,'font-size':'8.5'}); t.textContent=label; svg.appendChild(t); });
    const inv=S('line',{id:'invLine',x1:0,y1:top-10,x2:0,y2:top+PRECATS.length*rowH,stroke:'var(--ink)','stroke-width':2}); svg.appendChild(inv);
    const invT=S('text',{id:'invT',x:0,y:top-12,fill:'var(--ink)','font-size':'9','text-anchor':'end'}); svg.appendChild(invT);
    const dotsG=S('g',{}); svg.appendChild(dotsG);
    const panel=el('div',{},[]);
    const seg=el('div',{class:'seg'},[]);
    Object.entries(INVENTIONS).forEach(([k,v],i)=>{ const b=el('button',{type:'button',class:i===0?'on':''},[document.createTextNode(v.name)]); b.dataset.k=k; seg.appendChild(b); });
    panel.appendChild(seg);
    panel.appendChild(readout([{k:'Invented',id:'pmYear',u:'',cls:'amber'},{k:'Earliest clue',id:'pmFirst',u:''},{k:'Last piece arrived',id:'pmLast',u:'',cls:'warn'},{k:'Then it took',id:'pmGap',u:''}]));
    root.appendChild(bench('PREREQUISITE MAP', svg, panel));
    const list=el('ol',{class:'otl pmlist','aria-label':'Pieces in order'}); root.appendChild(list);
    function yr(y){ return y<0 ? (-y)+' BCE' : String(y); }
    function show(k){
      const v=INVENTIONS[k]; const pre=[...v.pre].sort((a,b)=>a[1]-b[1]); const last=pre[pre.length-1];
      invYear=v.year; span=Math.log10(invYear+1-pre[0][1])*1.04;
      ticksG.innerHTML='';
      [1,10,100,1000].forEach(d=>{ if(Math.log10(d+1)>span) return; const x=xOf(invYear-d);
        ticksG.appendChild(S('line',{x1:x,y1:top-6,x2:x,y2:top+PRECATS.length*rowH,stroke:'var(--line)','stroke-dasharray':'2 3'}));
        const t=S('text',{x,y:top+PRECATS.length*rowH+14,fill:'var(--faint)','font-size':'8','text-anchor':'middle'}); t.textContent=(d===1?'1 yr':d.toLocaleString()+' yrs')+' before'; ticksG.appendChild(t); });
      dotsG.innerHTML='';
      pre.forEach(p=>{ const i=PRECATS.findIndex(c=>c[0]===p[0]); const y=top+i*rowH+rowH/2; const isLast=p===last;
        dotsG.appendChild(S('circle',{cx:xOf(p[1]),cy:y,r:isLast?6:4.5,fill:PRECATS[i][2],stroke:isLast?'var(--ink)':'none','stroke-width':2})); });
      const x=xOf(v.year); inv.setAttribute('x1',x); inv.setAttribute('x2',x); invT.setAttribute('x',Math.min(W-2,x+30)); invT.textContent=v.name+' '+v.year;

      root.querySelector('#pmFirst').textContent=pre[0][2]+' ('+(v.year-pre[0][1]).toLocaleString()+' yrs before)';
      root.querySelector('#pmLast').textContent=last[2];
      root.querySelector('#pmGap').textContent=(v.year-last[1])+' more years';
      list.innerHTML='';
      pre.forEach(p=>{ const c=PRECATS.find(c=>c[0]===p[0]); const li=el('li',{class:p===last?'last':''},[el('span',{class:'oy'},[document.createTextNode(p[2])]),
        el('span',{html:`<b style="color:${c[2]}">${c[1]}:</b> ${p[3]}${p===last?' <em class="bn">← last piece</em>':''}`})]); list.appendChild(li); });
      const missing=PRECATS.filter(c=>!pre.some(p=>p[0]===c[0]));
      missing.forEach(c=>list.appendChild(el('li',{class:'none'},[el('span',{class:'oy'},[document.createTextNode('—')]),el('span',{html:`<b style="color:${c[2]}">${c[1]}:</b> not needed. ${k==='battery'&&c[0]==='theory'?'Volta worked purely by experiment; the theory of why batteries work came decades later. That is partly why the battery could come first.':''}`})])));
    }
    seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); show(b.dataset.k); }));
    show('battery');
    root.appendChild(el('h3',{class:'h'},[document.createTextNode('Could the Romans have built a battery?')]));
    root.appendChild(el('p',{html:"In principle, almost: they had copper, iron and vinegar, which can make a feeble cell. But look at the map. They had no instrument that would show a current, no reason to look for one, and no theory telling them what they would be seeing. A battery with nothing to detect it and no question to answer is just a jar. That is the honest answer to “why not earlier”: the idea is rarely the bottleneck. The supporting stack is."}));
  }});

/* ---- Foundations: lost knowledge and eureka moments ---- */
STEPS.push({part:P_FOUND, nav:"Lost, kept & eureka", title:"What was lost, who kept the thread, and where the “eureka” really came from",
  sub:"Some brilliant ancient work really did vanish. But for electricity the evidence points one way — and the famous flashes of insight almost always came after years of groundwork.",
  body(root){
    root.appendChild(el('h3',{class:'h'},[document.createTextNode('Yes, a great deal was lost')]));
    root.appendChild(el('p',{class:'lead',html:"Your instinct is right that the surviving record is a small, lucky sample. Most ancient writing was on papyrus, parchment or wood, and survived only if someone kept recopying it for centuries."}));
    const lost=el('div',{class:'lostgrid'});
    [['Greek plays','Of roughly 70–90 plays by Aeschylus, 7 survive. Sophocles wrote over 120; 7 survive. Whole libraries of drama, science and history are known only by their titles.'],
     ['The Library of Alexandria','Not lost in one dramatic fire. It declined over centuries — scholars expelled, funding cut, parts burned in wars — until there was nothing left to lose.'],
     ['The Antikythera mechanism','A hand-cranked bronze calculator of the sky, made around 200 BCE, that predicted eclipses. Nothing of comparable complexity is known for more than a thousand years afterwards. Found by sponge divers in a shipwreck in 1900.'],
     ['The Archimedes Palimpsest','In 1229 a monk scraped a copy of Archimedes off its parchment and wrote prayers over it. Imaging between 1998 and 2008 recovered the hidden text, including his <em>Method</em>, which uses ideas close to calculus — 1,800 years early.'],
     ['Maya books','In 1562 the Spanish friar Diego de Landa burned Maya codices at Maní. Only four Maya books are known to survive today.'],
     ['Roman concrete','Some Roman harbour concrete still stands after 2,000 years in seawater. In 2023 MIT researchers showed that lime lumps in the mix let cracks heal themselves — a technique modern builders had to rediscover.']
    ].forEach(([t,d])=>lost.appendChild(el('div',{class:'lostcard'},[el('div',{class:'lt'},[document.createTextNode(t)]),el('div',{class:'ld',html:d})])));
    root.appendChild(lost);
    // survival bars
    const sv=S('svg',{viewBox:'0 0 340 92',role:'img','aria-label':'How many plays survive from three Greek playwrights'});
