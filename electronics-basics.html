const ORIGINS={
 "What electricity is":{thing:"the battery",verdict:'both',change:1,
  need:"Before 1800 the only electricity anyone could make was <em>static</em>: a spark from rubbing amber or glass, or a jar that dumped its charge in a split second. Nobody could produce a <strong>steady current</strong>, so nobody could study one. Every lesson in this app depends on the thing that fixed that.",
  how:"<strong>An accident, then an argument, then a deliberate experiment.</strong> In the 1780s Luigi Galvani saw dissected frog legs twitch when touched with two different metals, and concluded the electricity came from the animal (“animal electricity”). Alessandro Volta believed the two metals were the real source, and set out to prove it. In 1800 he stacked zinc and copper discs separated by brine-soaked cloth — his <em>pile</em> — and got a steady current with no animal involved.",
  shape:"Each pair of different metals gives a small, fixed voltage. Stacking pairs adds their voltages, exactly like stacking batteries in series. That is why your kit holds six 1.5 V AA cells to make 9 V, and why its power rail has a tap every 1.5 V (V1 to V6).",
  now:"<strong>Chemistry refined, principle unchanged.</strong> Wet cells that sloshed acid became sealed “dry” cells, then alkaline cells, then lithium. Each step chased the same goals: no spills, longer life, more energy per gram, safer to carry. Yet every one is still two different materials and an electrolyte, stacked to add voltage — Volta’s idea.",
  timeline:[["1780s","Galvani’s twitching frog legs"],["1800","Volta’s pile: the first steady current"],["1866","Leclanché wet cell"],["1880s","Sealed dry cell"],["1950s","Alkaline cell (Lewis Urry, Eveready)"],["1991","Rechargeable lithium-ion goes on sale (Sony)"]]},

 "The breadboard":{thing:"the breadboard",verdict:'built',change:0,
  need:"Engineers need to try a circuit, change it, and try again <em>before</em> soldering it or sending it to a factory. Soldering every experiment is slow and wrecks parts.",
  how:"<strong>Designed on purpose, named by a habit.</strong> In the 1920s radio hobbyists nailed parts and wires onto a wooden board — often a literal kitchen bread board — which is where the name comes from. The solderless version came later: Orville Thompson of DeVry Technical Institute filed a patent in 1960 for rows of holes joined by spring metal, and Ronald Portugal of E&L Instruments filed one in 1971 with holes 0.1 inch apart. That 1971 layout is the modern breadboard.",
  shape:"The 0.1-inch (2.54 mm) spacing exists because it matches the leg spacing of integrated-circuit chips, so a chip plugs straight in. Each short strip joins five holes, so one chip leg can connect to several parts. Long strips down the edges carry power and ground everywhere. Your kit’s blocks of five holes are the same idea.",
  now:"<strong>Barely changed since 1971.</strong> It does one job, and chip legs still use 0.1-inch spacing, so there has been no reason to redesign it. Its known limits — springy contacts that add resistance, and long parallel strips that act like tiny capacitors — make it poor for very fast or high-current circuits. For those, engineers move to a printed circuit board, not a better breadboard.",
  timeline:[["1920s","Radio parts nailed to wooden bread boards"],["1960","Thompson (DeVry) files solderless design"],["1971","Portugal (E&L Instruments) files the 0.1-inch layout"],["Today","Essentially the same board"]]},

 "Reading a schematic":{thing:"the schematic",verdict:'both',change:1,
  need:"Early electrical diagrams were pictures: drawings of the actual instruments and coils, wires and all. As telegraph, telephone and radio circuits grew, a picture of every part became unreadable, and what engineers needed to see was only <em>what connects to what</em>.",
  how:"<strong>Grew by habit, then was agreed on purpose.</strong> No one person invented the schematic. Engineers gradually swapped pictures for simple symbols in the late 1800s and early 1900s, and each country and company had its own versions. Standards bodies later fixed the symbols so a drawing could be read anywhere: in the US, IEEE Std 315 (1975); internationally, IEC 60617. Europe’s box-shaped resistor and America’s zig-zag both survive because both standards allow them.",
  shape:"A schematic throws away position, size and appearance on purpose. Two parts drawn side by side may be far apart on the real board. What it keeps is the one thing a circuit depends on: which points are joined. That is why it reads more like a subway map than a photograph.",
  now:"<strong>Same idea, now the master copy.</strong> Today the schematic is drawn in software first, and the board layout is generated from it. The program checks that every connection on the board matches the schematic exactly, so the drawing you read is the design itself.",
  timeline:[["1800s","Diagrams are pictures of the real apparatus"],["Early 1900s","Symbols replace pictures in telegraph and radio work"],["1975","IEEE Std 315 standardises US symbols"],["Today","Schematic capture software drives the board layout"]]},
 "Printed circuit boards":{thing:"the printed circuit board",verdict:'built',change:2,
  need:"Radios of the 1920s and 30s were wired by hand: every connection a separate wire, cut, routed and soldered point to point. It was slow, bulky, and every set could be wired slightly differently, or wrongly.",
  how:"<strong>Designed on purpose, by an outsider.</strong> Inventors had patented flat conductors on insulating boards since the early 1900s, but the practical printed circuit came from Paul Eisler, an engineer from Vienna who fled to Britain in 1936. Borrowing methods from printing, he etched the wiring out of copper foil bonded to a board, and built a working radio that way. British industry and government showed little interest; he even lost his patent rights to a publishing firm. Then the United States used printed circuits in artillery <em>proximity fuzes</em> during the Second World War, which needed to be small, identical and tough. His role as inventor was recognised only after a long legal fight. He clearly knew what it could become; it was everyone else who took convincing.",
  shape:"Why flat copper? Because it can be made like printing: one master pattern, thousands of identical boards, no wiring mistakes. Why plated holes? So one hole can join a part’s leg to copper on both sides. Why green? It is the colour of the epoxy solder mask that became standard; boards can be any colour.",
  now:"<strong>Reworked again and again.</strong> In the 1950s parts went through holes and whole boards were soldered in one pass through a wave of molten solder. From the 1980s <em>surface-mount</em> parts, soldered flat onto pads with no holes, took over and shrank everything. A phone board today stacks 10 or more copper layers joined by microscopic vias, but it is still Eisler’s idea: wiring that is made, not wired.",
  timeline:[["1903","Early patents for flat conductors on insulating boards"],["1936","Paul Eisler in London: an etched-copper printed circuit"],["1940s","Printed circuits in wartime proximity fuzes"],["1950s","Through-hole boards, wave soldering, mass production"],["1980s","Surface-mount parts take over"],["Today","Boards with 10+ layers and microscopic vias"]]},
 "Counters & registers":{thing:"the electronic counter",verdict:'built',change:1,
  need:"By the late 1920s physicists at the Cavendish Laboratory in Cambridge were splitting atoms and needed to count the alpha particles that came flying out. People counted them by eye as tiny flashes on a screen, and electromechanical counters were too slow to keep up when particles came fast.",
  how:"<strong>Designed on purpose, for physics.</strong> In 1929–30 C. E. Wynn-Williams, with H. M. Cave and F. A. B. Ward, built a <em>scale-of-two</em> counter from thyratrons (gas-filled switching tubes) and published it in 1932. Each stage passed on one pulse for every two it received, so a chain of stages cut a fast stream of particles down to a rate an ordinary mechanical counter could follow. Rutherford encouraged the work. There is no sign Wynn-Williams was thinking about computers: the computing link came later.",
  shape:"Why binary rather than counting in tens? A switch with two states is the most reliable thing you can build: it is either clearly on or clearly off, with no in-between to misread. A decimal stage needs ten distinguishable states, which early tubes could not hold steadily. Two states, chained, can count as high as you like.",
  now:"<strong>Same idea, unimaginably smaller and faster.</strong> In the Second World War Wynn-Williams’s counting know-how went to Bletchley Park, where he worked on the Heath Robinson code-breaking machines that led to Colossus. In 1981 the physicist R. V. Jones wrote in <em>Nature</em> that the modern computer is only possible because of an invention made by a physicist. Today every processor is full of counters and registers, and every quartz watch divides 32,768 vibrations a second by two, fifteen times over, to get one tick a second.",
  timeline:[["1918","Eccles and Jordan’s flip-flop (two tubes, one bit)"],["1929–32","Wynn-Williams’s scale-of-two counter, for counting alpha particles"],["1943–44","Heath Robinson and Colossus at Bletchley Park"],["1960s","Counters and registers on integrated circuits"],["Today","Billions of flip-flops in every processor"]]},
 "Kirchhoff’s laws":{thing:"Kirchhoff’s laws",verdict:'built',change:0,
  need:"Ohm’s law (1827) describes one resistor on one loop. Real circuits — telegraph networks, measuring bridges — branch and rejoin, and there was no general way to work out what every branch carries.",
  how:"<strong>Worked out on purpose, by a student.</strong> In 1845 Gustav Kirchhoff, aged 21 and still a student at Königsberg, generalised Ohm’s work into two rules that hold for any network: current is conserved at every junction, and voltage sums to zero around every loop. He went on to co-found spectroscopy with Robert Bunsen, discovering the elements caesium and rubidium from the colours of their light.",
  shape:"The two laws are bookkeeping for two things that can’t be created or destroyed: charge (so currents balance at a junction) and energy (so the voltages around a loop balance). That is why they are so simple, and why they never fail for ordinary circuits.",
  now:"<strong>Unchanged since 1845.</strong> They are exact as long as a circuit is small compared with the wavelengths involved; at radio and microwave frequencies engineers switch to field theory. Every circuit simulator applies them at every node — SPICE (UC Berkeley, 1973) and the trainer’s solver included.",
  timeline:[["1827","Ohm’s law: one part, one loop"],["1845","Kirchhoff’s two laws for any network"],["1859–60","Kirchhoff and Bunsen found spectroscopy"],["1973","SPICE circuit simulator"],["Today","Every chip is checked with them"]]},
 "Resistor":{thing:"the resistor",verdict:'built',change:1,
  need:"Once Ohm showed in 1827 that resistance was a measurable number, engineers could design with it — but only if they had parts with <em>known</em> resistance. Telegraph lines, measuring instruments, and later radios all needed exact, repeatable amounts of it to set currents and calibrate readings.",
  how:"<strong>Designed on purpose.</strong> Resistance itself was found: every material has some. The resistor as a part was engineered — a chosen material, cut to a chosen size, to give a chosen value. Early ones were coils of wire. The radio boom of the 1920s turned cheap carbon resistors into a mass-produced part, and the industry agreed on the colour-band code so a value could be read on a tiny part without printed digits.",
  shape:"Why odd values like 47 and 470 instead of 50 and 500? Resistors are made to a tolerance (say ±10%), so standard values are spaced so that each one’s tolerance range just touches the next: 10, 12, 15, 18, 22, 27, 33, 39, 47, 56, 68, 82, then repeat ×10. These <em>preferred numbers</em> (the E-series) cover every possible value with the fewest parts. Your kit’s resistor list follows them.",
  now:"<strong>Refined, not reinvented.</strong> Carbon composition gave way to carbon film, then metal film, then surface-mount chips smaller than a grain of rice. Each change bought better precision, lower electrical noise, more stability with heat, and parts small enough for machines to place. The physics and the job are exactly what Ohm described.",
  timeline:[["1827","Ohm publishes his law"],["1843","Wheatstone bridge makes resistance easy to measure"],["1920s","Mass-produced carbon resistors and the colour code"],["1950s","Preferred values (E-series) standardised"],["Today","Surface-mount chip resistors"]]},

 "LED":{thing:"the LED",verdict:'both',change:3,
  need:"For decades, nothing — the effect was a curiosity. The need showed up in the 1960s: the little indicator bulbs on panels, instruments and appliances ran hot, drew a lot of power, and burned out.",
  how:"<strong>Found in 1907, ignored for 55 years, then engineered.</strong> In 1906–07 H. J. Round at the Marconi company noticed a silicon carbide crystal glowing when current passed through it. Oleg Losev studied the effect in the 1920s, but no one found a use. In 1962 Nick Holonyak at General Electric deliberately made a material (gallium arsenide phosphide) that glowed visible red. By 1968 Monsanto was mass-producing red indicator LEDs and Hewlett-Packard was selling LED number displays.",
  shape:"An LED is a diode, so it is one-way and needs a forward voltage to turn on. Its colour is set by the semiconductor material, not by a coloured cover. Once on, it acts almost like a short circuit, which is why it always needs a series resistor — the reason Project 1 exists.",
  now:"<strong>Transformed.</strong> Early LEDs were dim red dots. Green, yellow and, finally, efficient blue (Shuji Nakamura at Nichia, 1993; with Isamu Akasaki and Hiroshi Amano, Nobel Prize 2014) made white light possible. Now LEDs light rooms, screens and runways. The driver was efficiency: an LED turns far more of its power into light than a filament bulb does.",
  timeline:[["1907","Round reports light from silicon carbide"],["1920s","Losev studies it; no practical use"],["1962","Holonyak: first visible red LED (GE)"],["1968","Monsanto indicators, HP displays"],["1993","Bright blue LED (Nakamura)"],["2014","Nobel Prize for the blue LED"]]},

 "The oscilloscope":{thing:"the oscilloscope",verdict:'built',change:2,
  need:"By the 1890s engineers were working with alternating current and fast-changing signals. A meter needle is far too slow to follow a voltage that reverses many times a second. They needed to <em>see</em> the shape of a signal, not just one number.",
  how:"<strong>Designed on purpose.</strong> In 1897 Ferdinand Braun built the cathode-ray tube: a beam of electrons, steered by the signal, drawing a glowing line on a coated screen. Over the next decades it became the oscilloscope. A key step came in 1947, when the new company Tektronix sold a scope with a <em>triggered sweep</em>, which starts each pass at the same point of a repeating wave so the trace holds still long enough to measure.",
  shape:"The grid of divisions, the volts/div and time/div knobs, and the trigger all come from the needs of that glowing-beam era: you measure by counting squares and multiplying by what each square is worth.",
  now:"<strong>Inside transformed, outside familiar.</strong> The glass tube is gone. Modern scopes sample the signal digitally and draw it on a flat screen, store it, and do maths on it. But the front panel still has volts/div, time/div and trigger, because they map directly onto the measurement and generations of technicians already know them.",
  timeline:[["1897","Braun’s cathode-ray tube"],["1947","Tektronix: triggered sweep"],["Later","Digital sampling scopes"],["Today","Same knobs, digital insides"]]},

 "Capacitor":{thing:"the capacitor",verdict:'found',change:2,
  need:"Nothing — no one set out to build it. It was found while experimenters tried to “bottle” electricity, and only later became essential, for tuning radios and smoothing power supplies.",
  how:"<strong>Found by accident, with a painful shock.</strong> In 1745 Ewald von Kleist, and in 1746 Pieter van Musschenbroek in Leiden, tried to store electricity in a jar of water. When they touched it they got a violent shock — far more charge than anyone expected. The <em>Leyden jar</em> was the first capacitor. Scientists then worked out that what mattered was two conductors separated by an insulator. The unit, the farad, honours Michael Faraday.",
  shape:"Capacitance grows with plate area and shrinks with the gap between plates. So engineers roll long, thin foils with a very thin insulator into a small can. The electrolytic capacitor goes furthest: its insulator is an oxide layer only molecules thick, which is how a part the size of a fingertip can hold hundreds of microfarads.",
  now:"<strong>Same principle since 1745, very different forms.</strong> Leyden jars became mica and paper capacitors, then electrolytics (from the 1890s), then the tiny multilayer ceramic chips found by the hundred in a phone. Radios needed tuning, power supplies needed smoothing, and electronics kept shrinking, so the form kept changing. The idea — two conductors, one insulator — never did.",
  timeline:[["1745","Von Kleist’s jar"],["1746","Musschenbroek’s Leyden jar"],["1890s","Electrolytic capacitor patented (Pollak)"],["Today","Multilayer ceramic chips"]]},

 "Diode & switches":{thing:"the diode",verdict:'both',change:3,
  need:"Early radio, around 1900, needed a <strong>detector</strong>: something that turned high-frequency radio waves into a signal an earphone could play. Later, every power supply needed to turn alternating current (AC) into steady direct current (DC). Both jobs need a one-way valve.",
  how:"<strong>Found several times, and engineered each time.</strong> In 1874 Ferdinand Braun noticed some crystals conduct better one way than the other. In the 1880s Thomas Edison saw current leak across a vacuum bulb to an extra electrode — the “Edison effect” — and found no use for it. In 1904 John Ambrose Fleming deliberately turned that effect into a vacuum-tube detector for Marconi’s radios. Crystal detectors with a “cat’s whisker” wire did the same job cheaply. Then in 1940 Russell Ohl at Bell Labs, studying silicon for radar detectors, found a slab whose two halves held different impurities; the boundary between them, the <em>p–n junction</em>, is the modern diode.",
  shape:"Silicon doped with a little phosphorus has spare electrons (n-type); doped with boron it has gaps called holes (p-type). Where the two meet, current flows easily one way and is blocked the other, and it takes about 0.6 V to push across. The stripe on the diode’s body marks the side the arrow points to, matching the bar in the symbol.",
  now:"<strong>Transformed in form, unchanged in job.</strong> A hot, fragile vacuum tube became a crystal, then a grain of silicon. Each step made it smaller, cheaper, cooler and more rugged — a large part of why it mattered for ships and aircraft. Wartime radar work pushed silicon purity forward. The job, a one-way valve, is exactly what Fleming built in 1904.",
  timeline:[["1874","Braun: one-way conduction in crystals"],["1880s","The Edison effect"],["1904","Fleming’s vacuum-tube diode"],["1940","Ohl finds the p–n junction (Bell Labs)"],["Today","Silicon diodes everywhere"]]},

 "Transistor":{thing:"the transistor",verdict:'built',change:3,
  need:"The Bell telephone network ran on vacuum-tube amplifiers and mechanical relays. Tubes ran hot, used a lot of power, and burned out; relays were slow and wore out. Bell Labs wanted a small, cool, solid replacement that could amplify and switch.",
  how:"<strong>Designed on purpose — the result of a targeted research programme.</strong> In December 1947 John Bardeen and Walter Brattain demonstrated the first working transistor, a point-contact device. Their group leader William Shockley worked out the more practical <em>junction</em> transistor in 1948. The three shared the 1956 Nobel Prize in Physics.",
  shape:"An NPN transistor is a thin slice of p-type silicon (the base) sandwiched between two n-type regions (collector and emitter). Because the base is so thin, a small current into it lets a much larger current cross from collector to emitter. Three regions, three legs. The NPN in your kit is essentially that 1948 junction design.",
  now:"<strong>Transformed.</strong> Germanium gave way to silicon (Texas Instruments, 1954). The integrated circuit (Kilby 1958, Noyce 1959) put many transistors on one chip, and the MOSFET (Atalla and Kahng, 1959) became the type used by the billion in every processor. Each step chased smaller size, lower power, lower cost and higher reliability. The idea — a small signal controlling a big one — has not changed.",
  timeline:[["1947","First transistor (Bardeen and Brattain)"],["1948","Junction transistor (Shockley)"],["1954","Silicon transistors (Texas Instruments)"],["1956","Nobel Prize"],["1958–59","Integrated circuit; MOSFET"],["Today","Billions on one chip"]]},

 "Logic gates":{thing:"the logic gate",verdict:'built',change:3,
  need:"Two separate needs met in the middle. Telephone exchanges and control systems were wired from relays by trial and error, with no theory to design them. Physicists counting cosmic rays needed a circuit that fired only when two detectors fired <em>at the same time</em>.",
  how:"<strong>Designed — once someone noticed the maths already existed.</strong> In 1854 George Boole published an algebra of true and false; it was pure mathematics with no machine in sight. In 1924 Walther Bothe and Hans Geiger invented the <em>coincidence method</em> (an AND), and by 1929–30 Bothe and Bruno Rossi had built electronic coincidence circuits; Bothe’s 1954 Nobel Prize was “for the coincidence method.” In 1937 Claude Shannon’s master’s thesis showed that relay circuits obey Boole’s algebra exactly, so switching circuits could be designed with mathematics instead of guesswork.",
  shape:"AND, OR and NOT are Boole’s three basic operations. NAND became the workhorse because it is cheap to build from transistors and any other gate can be made from NANDs alone — a fact Charles Sanders Peirce noted around 1880 and Henry Sheffer published in 1913.",
  now:"<strong>The logic has not changed since 1854; the hardware has changed completely.</strong> Relays gave way to vacuum tubes, then discrete transistors, then whole families of logic chips in the 1960s (such as TTL), then CMOS, which runs nearly every chip today. Each change made gates faster and cut the power each one uses, until billions fit in a processor.",
  timeline:[["1854","Boole’s algebra of logic"],["c. 1880","Peirce: NAND/NOR can build everything"],["1924","Bothe and Geiger’s coincidence method"],["1930","Electronic coincidence circuits (Bothe, Rossi)"],["1937","Shannon links relays to Boole"],["1960s","Logic gates sold as chips"]]},

 "Motor & coil":{thing:"the electromagnet, motor and speaker",verdict:'both',change:2,
  need:"Once Volta’s battery gave steady current, people wanted to know what else current could do — and soon, to make it do work: turn machines, signal over wires, make sound.",
  how:"<strong>Found, then engineered.</strong> In 1820 Hans Christian Ørsted saw a wire carrying current deflect a compass needle — the first proof that electricity makes magnetism. In 1821 Michael Faraday made a wire spin around a magnet, the first electric motor, though only as a demonstration. In 1825 William Sturgeon wound wire around an iron bar and made the first electromagnet. Practical motors followed through the 1800s. In 1925 Chester Rice and Edward Kellogg at General Electric designed the moving-coil cone loudspeaker.",
  shape:"Many turns of wire multiply the magnetic effect, and an iron core concentrates it — that is why it is a <em>coil</em>. In a motor, the current is switched back and forth at the right moments so the pushing never stops. In a speaker, the coil sits in a magnet’s gap and drives a light cone in and out with the signal.",
  now:"<strong>Motors reworked, speakers barely changed.</strong> Motors went from brushed to brushless with electronic controllers, gaining efficiency and life — which is why robotics can use them so precisely. The speaker in your phone is still Rice and Kellogg’s 1925 layout of magnet, coil and cone, because it already works well and costs little.",
  timeline:[["1820","Ørsted: current moves a compass"],["1821","Faraday’s spinning-wire motor"],["1825","Sturgeon’s electromagnet"],["1925","Rice and Kellogg’s cone speaker (GE)"],["Today","Brushless motors; same speaker design"]]},

 "P1 · Lit LED (DC)":{thing:"the indicator light",verdict:'built',change:1,
  need:"Machines need to tell people their state at a glance: power on, fault, ready. Panels used small filament and neon bulbs, which ran hot, drew power and burned out.",
  how:"<strong>A deliberate application.</strong> When Monsanto began mass-producing red LEDs in 1968, their first job was exactly this one: replacing indicator bulbs. The circuit you are about to build — a supply, a resistor and an LED — is that indicator light.",
  shape:"The resistor is not optional decoration. Because an LED acts almost like a short once it turns on, the resistor is what sets its current. Pick it with Ohm’s law, using the voltage left over after the LED takes its share.",
  now:"<strong>Barely changed.</strong> The LEDs got brighter and more efficient, but the circuit — resistor in series with an LED — is still on nearly every device you own, because it is the simplest thing that works.",
  timeline:[["Pre-1968","Filament and neon indicator bulbs"],["1968","Red LED indicators go on sale"],["Today","The same resistor-and-LED circuit everywhere"]]},

 "P2 · Blinker (timing)":{thing:"the astable multivibrator",verdict:'built',change:2,
  need:"During the First World War, French military radio needed a way to calibrate radio receivers and wavemeters at many frequencies.",
  how:"<strong>Designed on purpose.</strong> Henri Abraham and Eugène Bloch built it during the war and described it in 1919: two vacuum-tube amplifiers cross-coupled through resistor–capacitor networks, each switching the other off in turn. Unlike the smooth sine waves of other oscillators, it produced a square wave packed with harmonics — many frequencies at once — which made it ideal for calibration. They named it the <em>multivibrator</em> after those many harmonics.",
  shape:"Its rhythm comes from capacitors charging through resistors, so its timing is set by R × C, the same time constant from the capacitor lesson. Swapping the vacuum tubes for transistors kept the circuit exactly the same in shape.",
  now:"<strong>Same circuit, mostly replaced in practice.</strong> The two-transistor version is still built and taught, because it shows timing so clearly. But in 1971 the 555 timer chip packaged the job into one part, and today a microcontroller can blink a light in a single line of code. It evolved because designers wanted fewer parts and more precise, programmable timing.",
  timeline:[["1917–19","Abraham and Bloch’s vacuum-tube multivibrator"],["1950s","Transistor versions"],["1971","555 timer chip"],["Today","Microcontrollers do most blinking"]]},

 "P3 · Logic gate (digital)":{thing:"the logic decision circuit",verdict:'built',change:3,
  need:"Some actions must happen only when several conditions are true together: a machine that runs only if the guard is closed <em>and</em> the start button is pressed. That kind of rule is called an <em>interlock</em>.",
  how:"<strong>Designed on purpose, long before electronics.</strong> Railways in the mid-1800s built mechanical interlocking frames so a signalman physically could not set conflicting signals. Relays then did the same job electrically, and Shannon’s 1937 work let engineers design these rules with Boolean algebra. This project is that rule built from electronic gates.",
  shape:"Two inputs, one output, one fixed rule — exactly Boole’s AND, OR or NAND. The LED stands in for whatever the decision controls.",
  now:"<strong>The rule is unchanged; how it is built changed completely.</strong> Levers became relays, then gates, and today most industrial interlocks run as software on programmable logic controllers. The truth table you are about to fill in is the same one a railway signalman’s levers enforced.",
  timeline:[["1850s","Mechanical railway interlocking"],["1937","Shannon: switching circuits follow Boole"],["1960s","Logic gates on chips"],["Today","Interlocks in software controllers"]]},

 "P4 · Light switch (sensing)":{thing:"the light sensor",verdict:'both',change:2,
  need:"Streetlights, cameras and later phones needed to react to how bright it is without a person watching.",
  how:"<strong>Found by accident, then put to work.</strong> In 1873 Willoughby Smith was testing materials for undersea telegraph cables and used bars of selenium as high-value resistors. Their readings would not stay steady, and he traced the cause to light: selenium’s resistance dropped when light hit it. That accident is photoconductivity. Cadmium sulfide (CdS) cells, like the one in your kit, later became the cheap standard light sensor for automatic streetlights and camera light meters.",
  shape:"A photoresistor is simply a resistor whose value depends on light. On its own it doesn’t switch anything, so it is placed in a voltage divider to turn light into a voltage, and a transistor turns that voltage into on or off.",
  now:"<strong>Reworked.</strong> Cadmium is toxic, and Europe’s RoHS rules now severely restrict CdS photoresistors. Designers have moved to photodiodes, phototransistors and ambient-light-sensor chips, which react faster and are more precise. That is why a phone’s auto-brightness uses a dedicated sensor chip, not a CdS cell.",
  timeline:[["1873","Smith finds selenium reacts to light"],["Mid-1900s","CdS cells in streetlights and cameras"],["2000s","RoHS restricts cadmium in Europe"],["Today","Photodiode and sensor chips"]]}
};
const TRAINER_LINK={"Series & parallel":[[8,'Series Resistors',true],[9,'Parallel Resistors',true]],"P1 · Lit LED (DC)":[7,'Light Telegraph',true],"P2 · Blinker (timing)":[29,'How a Multivibrator Works',true],"P3 · Logic gate (digital)":[26,'Introducing the AND Gate',true],"P4 · Light switch (sensing)":[19,'Night Light',true]};
const VERDICT={found:['Found by accident','found'],built:['Designed on purpose','built'],both:['Found, then engineered','both']};
const CHANGE=['barely changed','refined','reworked','transformed'];
function originCard(nav){
  const o=ORIGINS[nav]; if(!o) return null;
  const d=el('details',{class:'origin'}); if(PROG.oc!==1) d.setAttribute('open','');
  const v=VERDICT[o.verdict];
  d.appendChild(el('summary',{},[ el('span',{class:'olabel'},[document.createTextNode('Before you start: where '+o.thing+' came from')]), el('span',{class:'verdict v-'+v[1]},[document.createTextNode(v[0])]) ]));
  const body=el('div',{class:'obody'});
  [['The problem it solved',o.need],['Found or designed?',o.how],['Why it’s shaped this way',o.shape]].forEach(([h,t])=>{ body.appendChild(el('h4',{},[document.createTextNode(h)])); body.appendChild(el('p',{html:t})); });
  body.appendChild(el('h4',{},[document.createTextNode('Then vs. now')]));
  const meter=el('div',{class:'evo',role:'img','aria-label':'Change since its origin: '+CHANGE[o.change]});
  CHANGE.forEach((c,i)=>meter.appendChild(el('span',{class:'evseg'+(i<=o.change?' on':'')+(i===o.change?' cur':'')},[document.createTextNode(c)])));
  body.appendChild(meter); body.appendChild(el('p',{html:o.now}));
  const tl=el('ol',{class:'otl','aria-label':'Timeline'});
  o.timeline.forEach(([y,t])=>tl.appendChild(el('li',{},[el('span',{class:'oy'},[document.createTextNode(y)]),el('span',{},[document.createTextNode(t)])])));
  body.appendChild(tl);
  d.appendChild(body);
  d.addEventListener('toggle',()=>{ PROG.oc=d.open?0:1; saveProg(); });
  return d;
}

let cur=0; const seen=new Set();
STEPS.forEach((s,i)=>{ if(PROG.seen.includes(s.nav)) seen.add(i); });
const tocEl=document.getElementById('toc'), mainEl=document.getElementById('main');
function buildTOC(){
  tocEl.innerHTML=''; let lastPart=null;
  STEPS.forEach((s,i)=>{
    if(s.part!==lastPart){ tocEl.appendChild(el('div',{class:'part'},[document.createTextNode(s.part)])); lastPart=s.part; }
    const b=el('button',{},[ el('span',{class:'n'},[document.createTextNode(s.quiz?'✓?':String(i+1).padStart(2,'0'))]), el('span',{},[document.createTextNode(s.nav)]), el('span',{class:'qbadge'}) ]);
    if(s.quiz) b.classList.add('isquiz');
    b.addEventListener('click',()=>{ go(i); closeMenu(); });
    b.dataset.i=i; tocEl.appendChild(b);
  });
  const reset=el('button',{class:'resetp',type:'button'},[document.createTextNode('Reset my progress')]);
  reset.addEventListener('click',()=>{
    if(reset.dataset.arm!=='1'){ reset.dataset.arm='1'; reset.textContent='Tap again to clear progress'; setTimeout(()=>{ reset.dataset.arm=''; reset.textContent='Reset my progress'; },3000); return; }
    PROG.at=null; PROG.seen=[]; PROG.quiz={}; saveProg(); seen.clear(); reset.dataset.arm=''; reset.textContent='Progress cleared'; go(0);
  });
  tocEl.appendChild(reset);
}
function paintTOC(){ tocEl.querySelectorAll('button[data-i]').forEach(b=>{ const i=+b.dataset.i, s=STEPS[i];
  b.classList.toggle('active',i===cur); b.classList.toggle('done',seen.has(i)&&i!==cur);
  const qb=b.querySelector('.qbadge'); if(qb) qb.textContent = (s.quiz && PROG.quiz[s.quizId]!=null) ? PROG.quiz[s.quizId]+'/'+s.qcount : ''; }); }
function goNav(nav){ const i=STEPS.findIndex(s=>s.nav===nav); if(i>=0) go(i); }
function go(i){
  if(i<0||i>=STEPS.length) return;
  clearAnims(); cur=i; seen.add(i);
  PROG.at=STEPS[i].nav; if(!PROG.seen.includes(STEPS[i].nav)) PROG.seen.push(STEPS[i].nav); saveProg();
  mainEl.innerHTML=''; window.scrollTo(0,0); mainEl.scrollTop=0;
  const s=STEPS[i];
  mainEl.appendChild(el('div',{class:'eyebrow'},[document.createTextNode(s.part+' · '+String(i+1).padStart(2,'0')+' / '+String(STEPS.length).padStart(2,'0'))]));
  mainEl.appendChild(el('h1',{class:'title'},[document.createTextNode(s.title)]));
  mainEl.appendChild(el('p',{class:'sub'},[document.createTextNode(s.sub)]));
  const oc=originCard(s.nav); if(oc) mainEl.appendChild(oc);
  try{ s.body(mainEl); }catch(e){ mainEl.appendChild(el('p',{class:'warnbox',html:'This lesson hit a snag rendering: '+(e&&e.message)})); }
  const tpl=TRAINER_LINK[s.nav], tp=tpl&&(Array.isArray(tpl[0])?null:tpl);
  if(tpl && Array.isArray(tpl[0])){ const box=el('div',{class:'handoff'},[ el('div',{class:'hot'},[document.createTextNode('Build it for real')]),
      el('p',{html:'Open these on the 500-in-1 breadboard, already wired. Flip the switch and watch the LED change; then use break-it mode to pull a resistor out of each.'}),
      el('div',{class:'hl'},tpl.map(t=>el('a',{class:'btn go',href:'electronics-trainer.html#p='+t[0]+'&from=learn'},[document.createTextNode(`#${t[0]} ${t[1]} ›`)]))),
      el('p',{class:'note'},[document.createTextNode('Works when both files are in the same folder. The breadboard has a link back, and this app reopens on this lesson.')]) ]); mainEl.appendChild(box); }
  if(tp){ const box=el('div',{class:'handoff'},[
      el('div',{class:'hot'},[document.createTextNode('Build it for real')]),
      el('p',{html: tp[2]
        ? `Open the 500-in-1 breadboard with kit project ${tp[0]}, <em>${tp[1]}</em>, already wired on the board. The circuit runs on the trainer’s real circuit solver, so you can change it and see what happens.`
        : `Open kit project ${tp[0]}, <em>${tp[1]}</em>, on the 500-in-1 trainer. <strong>Honest limit:</strong> this one runs as a behaviour model — the controls and lights work, but its wiring isn’t drawn on the breadboard yet. Wiring it fully is on the trainer’s queue.`}),
      el('a',{class:'btn go',href:'electronics-trainer.html#p='+tp[0]+'&from=learn'},[document.createTextNode('Open on the breadboard ›')]),
      el('p',{class:'note'},[document.createTextNode('Works when both files are in the same folder. The breadboard has a link back, and this app reopens on this lesson.')]) ]);
    mainEl.appendChild(box); }
  document.getElementById('prev').disabled = i===0;
  const nx=document.getElementById('next'); nx.textContent = i===STEPS.length-1 ? 'Done ✓' : 'Next ›';
  document.getElementById('stepLbl').textContent = (i+1)+' / '+STEPS.length+' · '+s.nav;
  document.getElementById('progBar').style.width = ((i+1)/STEPS.length*100)+'%';
  paintTOC();
}
document.getElementById('prev').addEventListener('click',()=>go(cur-1));
document.getElementById('next').addEventListener('click',()=>{ if(cur<STEPS.length-1) go(cur+1); });
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return; if(e.key==='ArrowRight')go(cur+1); if(e.key==='ArrowLeft')go(cur-1); });
const rm=document.getElementById('reduceMotion');
rm.addEventListener('change',()=>{ REDUCE=rm.checked; document.body.classList.toggle('reduce',REDUCE); go(cur); });
if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){ REDUCE=true; rm.checked=true; document.body.classList.add('reduce'); }

menuBtn.addEventListener('click',()=>{ tocEl.classList.toggle('open'); scrim.classList.toggle('show'); });

/* ---- glossary: every term the lessons introduce, each linked back to where it is taught ---- */
const GLOSS=[
 ['ampere (A)','The unit of current. 1 A is a lot for small electronics, so you will mostly see mA and µA.','First: the language'],
 ['astable multivibrator','A two-transistor circuit that flips back and forth on its own, timed by resistors charging capacitors. Makes blinkers and tones.','P2 · Blinker (timing)'],
 ['base / collector / emitter','The three legs of a bipolar transistor. A small current into the base controls a larger current from collector to emitter.','Transistor'],
 ['capacitance (C), farad (F)','How much charge a capacitor stores per volt. The farad is huge, so real parts are in µF, nF and pF.','Capacitor'],
 ['capacitor','Two plates that store charge. It blocks steady DC but responds to change, which makes timing and smoothing possible.','Capacitor'],
 ['circuit (loop)','A complete path from a source, through a load, and back. Current flows only when the loop is closed.','The circuit loop'],
 ['conventional current','Current drawn flowing from + to −, as positive charge would. It is the direction used in every formula.','Two kinds of current'],
 ['current (I)','The flow rate of charge, measured in amperes. The symbol I comes from the French “intensité du courant”.','What electricity is'],
 ['diode','A one-way valve for current. It conducts forward and blocks in reverse.','Diode & switches'],
 ['drift velocity','How fast individual electrons actually move through a wire: well under a millimeter per second.','How fast is electricity?'],
 ['electromagnet','A coil of wire that becomes a magnet while current flows. It is the working part of motors, speakers and relays.','Motor & coil'],
 ['electron flow','The real motion of electrons in a metal: from − to +, opposite to conventional current.','Two kinds of current'],
 ['forward voltage','The roughly fixed voltage a diode or LED holds once it is conducting (about 0.6 V for silicon, about 1.8 V for a red LED).','LED'],
 ['gain (β)','How many times larger a transistor’s load current is than its base current. About 100 in these lessons.','Transistor'],
 ['ground','The 0 V reference point that every other voltage is measured from. On this kit, the negative rail.','The breadboard'],
 ['hertz (Hz)','The unit of frequency: cycles per second.','The oscilloscope'],
 ['LED','Light-emitting diode. A diode that glows when it conducts. It always needs a resistor to limit its current.','LED'],
 ['logic gate','A circuit that turns on/off inputs into an on/off output by a fixed rule: AND, OR, NOT, NAND, XOR.','Logic gates'],
 ['node','Every point that is wired together and so sits at the same voltage. On the breadboard, one row within one block of five.','The breadboard'],
 ['oscilloscope (scope)','An instrument that draws voltage (up the side) against time (along the bottom), so you can see signals change.','The oscilloscope'],
 ['volts/div, time/div','A scope’s two zoom settings: how many volts, and how much time, one square of the grid stands for.','The oscilloscope'],
 ['period (T)','The time one full cycle of a repeating signal takes. Frequency is 1 ÷ period.','The oscilloscope'],
 ['frequency (f)','How many cycles happen each second, measured in hertz. f = 1 ÷ T.','The oscilloscope'],
 ['amplitude','How tall a signal gets, from 0 V to its peak.','The oscilloscope'],
 ['square wave','A signal that snaps between two levels, on and off, like the blinker’s LED drives.','P2 · Blinker (timing)'],
 ['XOR (exclusive OR)','A gate whose output is on only when its two inputs are different. Two of them, with an AND, add binary numbers.','See the flow: gates'],
 ['fluidic logic','Logic gates made from jets of air or liquid, with no moving parts. Used where electronics struggle, such as extreme heat or radiation.','See the flow: gates'],
 ['program','A changeable set of instructions that sets what a machine does, step by step — first as wound rope, then punched holes, then bits in memory.','Heron’s programmable cart'],
 ['stored program','Keeping a computer’s instructions in its own memory, in the same form as its data. First run on the Manchester Baby in 1948.','Bootstrapping'],
 ['bootstrapping','Starting from a tiny hand-entered or built-in routine and using it to load or build bigger tools, step by step.','Bootstrapping'],
 ['operating system','Software that loads and runs other programs and manages the machine — originally the human computer operator’s job, automated.','Bootstrapping'],
 ['series','Parts connected one after another on a single path. Same current through each; their voltages add up to the supply.','Series & parallel'],
 ['parallel','Parts connected side by side across the same two points. Same voltage across each; their currents add up.','Series & parallel'],
 ['junction','A point where three or more wires meet, so current can split or combine.','Kirchhoff’s laws'],
 ['schematic','A drawing of a circuit that shows only what connects to what, using standard symbols.','Reading a schematic'],
 ['net','Every point in a circuit that is joined together; all of them sit at the same voltage.','Reading a schematic'],
 ['reference designator','A part’s label, such as R1, Q1 or D1, used on the schematic, the board and the parts list alike.','Reading a schematic'],
 ['PCB','Printed circuit board: copper traces bonded to an insulating board, replacing hand-wired connections.','Printed circuit boards'],
 ['trace','A flat copper path on a circuit board that does the job of a wire.','Printed circuit boards'],
 ['via','A small plated hole that carries a connection from one copper layer of a board to another.','Printed circuit boards'],
 ['solder bridge','Solder that accidentally joins two points that should be separate: a short circuit.','Printed circuit boards'],
 ['cold joint','A solder joint made without enough heat: dull, grainy and only partly connected.','Printed circuit boards'],
 ['flip-flop','A circuit with two steady states (0 and 1) that stays in whichever one it was last set to: one bit of memory.','Counters & registers'],
 ['counter','Flip-flops chained so each one flips when the one before falls from 1 to 0. Together they count pulses in binary.','Counters & registers'],
 ['register','A row of flip-flops that store a number together, loaded in one clock tick.','Counters & registers'],
 ['shift register','A register that moves every bit one place along each clock tick: how numbers are sent down a single wire, one bit at a time.','Counters & registers'],
 ['clock','A steady train of pulses that tells digital circuits when to change.','Counters & registers'],
 ['Kirchhoff’s current law','At any junction, the current flowing in equals the current flowing out.','Kirchhoff’s laws'],
 ['Kirchhoff’s voltage law','Around any closed loop, the voltage rises and drops add up to zero.','Kirchhoff’s laws'],
 ['ohm (Ω)','The unit of resistance. Ω is the Greek capital letter omega.','First: the language'],
 ['Ohm’s law','V = I × R. Exact for resistors and wires; it does not hold for diodes, LEDs or transistors.','What electricity is'],
 ['ohmic / non-ohmic','An ohmic part has a straight I–V line (constant resistance). A non-ohmic part’s line bends.','When Ohm’s law applies'],
 ['photoresistor (CdS cell)','A resistor whose resistance drops in light. Used as a light sensor.','P4 · Light switch (sensing)'],
 ['power (P), watt (W)','The rate energy is used or turned to heat: P = V × I.','Resistor'],
 ['prefix','A label that moves a number by factors of 1000: µ (millionth), m (thousandth), k (thousand), M (million).','First: the language'],
 ['quantity vs. unit','The quantity is what you measure (current, I); the unit is the yardstick (amperes, A).','First: the language'],
 ['rectifier','Diodes arranged to turn alternating current (AC) into direct current (DC).','Diode & switches'],
 ['resistance (R)','How much a part restricts current, measured in ohms.','Resistor'],
 ['resistor','A part that limits current by a set amount, turning the extra energy into a little heat.','Resistor'],
 ['switch','A controllable gap in a circuit. Closed lets current flow; open stops it.','The circuit loop'],
 ['thermocouple','Two different metals joined together that produce a small, steady voltage when their two junctions are at different temperatures. Ohm used one as his power source.','Who was Georg Ohm?'],
 ['threshold','The voltage at which a part changes state, such as about 0.6 V to turn on a silicon transistor.','P4 · Light switch (sensing)'],
 ['time constant (τ)','τ = R × C. After one τ a capacitor is about 63% charged; after about 5τ it is effectively full.','Capacitor'],
 ['transistor','A part where a small current controls a much larger one. Used as an amplifier or as a switch.','Transistor'],
 ['truth table','A table listing a logic gate’s output for every combination of inputs.','Logic gates'],
 ['voltage (V), volt (V)','The push behind current, always measured between two points. Quantity and unit share the letter V.','What electricity is'],
 ['voltage divider','Two resistances in series. The voltage at the point between them is a fixed fraction of the supply, set by their ratio.','P4 · Light switch (sensing)']
];
const glossEl=document.getElementById('gloss'), glossList=document.getElementById('glossList'), glossQ=document.getElementById('glossQ');
function paintGloss(){
  const q=(glossQ.value||'').trim().toLowerCase(); glossList.innerHTML=''; let n=0;
  const hits=GLOSS.filter(([t,d])=>!q || t.toLowerCase().includes(q) || d.toLowerCase().includes(q));
  const rank=t=>{ t=t.toLowerCase(); return t.startsWith(q)?2:(t.includes(q)?1:0); };
  if(q) hits.sort((a,b)=>rank(b[0])-rank(a[0])); // names starting with the search first, then names containing it
  hits.forEach(([t,d,nav])=>{ n++;
    const row=el('div',{class:'gterm'},[ el('div',{class:'gt'},[document.createTextNode(t)]), el('div',{class:'gd'},[document.createTextNode(d)]) ]);
    if(STEPS.some(s=>s.nav===nav)){ const b=el('button',{class:'qsee',type:'button'},[document.createTextNode('Taught in: '+nav+' ›')]); b.addEventListener('click',()=>{ closeGloss(); goNav(nav); }); row.appendChild(b); }
    glossList.appendChild(row);
  });
  if(!n) glossList.appendChild(el('p',{class:'note'},[document.createTextNode('No term matches “'+glossQ.value+'”. Try a shorter word.')]));
}
function openGloss(){ glossEl.hidden=false; glossQ.value=''; paintGloss(); try{ glossQ.focus(); }catch(e){} }
function closeGloss(){ glossEl.hidden=true; try{ document.getElementById('glossBtn').focus(); }catch(e){} }
document.getElementById('glossBtn').addEventListener('click',openGloss);
document.getElementById('glossClose').addEventListener('click',closeGloss);
glossEl.addEventListener('click',e=>{ if(e.target===glossEl) closeGloss(); });
glossQ.addEventListener('input',paintGloss);
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !glossEl.hidden) closeGloss(); });

buildTOC();

  const at=want>=0?want:(PROG.at ? STEPS.findIndex(s=>s.nav===PROG.at) : -1); go(at>=0?at:0); }
window.__learn={ STEPS, go, goNav, PROG, GLOSS, get cur(){return cur;} }; // test hook
