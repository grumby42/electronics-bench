  if(X){ const P=(x,y,k)=>{ const a=0.6*x-0.45*y+110, b=0.22*x+0.3*y+8+OFF[k]; return [a,b]; };
    Object.entries(K.PADS).forEach(([k,[x,y,n]])=>{ const t=P(x,y,0), bt=P(x,y,4); root.appendChild(S('line',{x1:t[0],y1:t[1],x2:bt[0],y2:bt[1],stroke:st.hi===n?'#ffb35c':'#b06a30','stroke-width':k==='VIA'?2:3,opacity:.85})); });
    if(st.flow&&st.res.ib>0.05){ [['VIA',3,1],['QB',1,0]].forEach(([k,a,b])=>{ const [x,y]=K.PADS[k]; pcbFlow(root,[P(x,y,a),P(x,y,b)],st.res.ib*6,'#5ad2ff',st.flowEls); }); }
    LBL.forEach((t,k)=>{ const e=S('text',{x:4,y:30+OFF[k]+60,fill:'var(--muted)','font-size':'8'}); e.textContent=t; root.appendChild(e); }); }
  // current streams on copper
  if(st.flow){ const r=st.res, FT=st.mystery||st.fault; K.TR.forEach(t=>{ const [n,ly,p,role,part]=t; if(!(ly==='bot'?show.bot:show.top)) return; let m=role==='b'?r.ib:role==='c'?r.led:r.ib+r.led;
      if(FT==='crack'&&role!=='b') m=role==='e'?r.ib:0;
      const g=X?(ly==='top'?G[1]:G[3]):root; pcbFlow(g,p,m,'#5ad2ff',st.flowEls); }); }
  // probe tags
  st.probes.forEach(pr=>{ const [x,y]=K.PADS[pr.k]; let px=x,py=y; if(X){ px=0.6*x-0.45*y+110; py=0.22*x+0.3*y+8+OFF[1]; }
    const t=S('text',{x:px+8,y:py-8,fill:'#5ad2ff','font-size':'10','font-family':'var(--mono)',style:'paint-order:stroke;stroke:#0b0f14;stroke-width:3px;pointer-events:none'}); t.textContent=pr.v.toFixed(2)+'V'; root.appendChild(t); });
}
function pcbState(onChange){
  const st={sw:true,fault:'none',hi:null,flow:true,exploded:false,revealed:false,probing:false,probes:[],mystery:null,layers:{top:true,bot:true,mask:true,silk:true},flowEls:[]};
  st.res=PCBK.volts(st.sw,st.fault);
  st.recalc=()=>{ st.res=PCBK.volts(st.sw,st.mystery||st.fault); st.probes.forEach(p=>p.v=st.res.pad(p.k)); onChange(); };
  st.toggle=()=>{ st.sw=!st.sw; st.recalc(); };
  st.pick=n=>{ st.hi=st.hi===n?null:n; onChange(); };
  st.padTap=k=>{ if(st.probing){ st.probes=st.probes.filter(p=>p.k!==k).concat([{k,v:st.res.pad(k)}]).slice(-6); onChange(); } else st.pick(PCBK.PADS[k][2]); };
  return st;
}

STEPS.push({part:P_COMP, nav:"Reading a schematic", title:"Reading a schematic: the circuit’s map",
  sub:"A schematic shows what connects to what, and nothing else. Where parts sit, how long the wires are, what they look like: all left out on purpose. Learn six symbols and three rules and you can read most simple circuits.",
  body(root){
    root.appendChild(el('p',{class:'lead',html:"Every line is a perfect wire. Every part is a symbol. The circuit below is a <span class='key'>transistor switch</span>: closing SW1 lets a tiny current into Q1’s base, and Q1 then lets a much bigger current through the LED. Tap the switch to try it. Tap any wire to light up everything it connects to: that set of connected points is called a <span class='key'>net</span>."}));
    const svg=S('svg',{viewBox:'0 0 330 210',role:'img','aria-label':'Schematic of a battery, switch, two resistors, a transistor and an LED'}); const panel=el('div',{});
    const info=el('div',{class:'kwork',role:'status'});
    let quizI=0; const QZ=[['Tap the wire that carries the switch’s output to R1.','S'],['Tap the net Q1’s emitter connects to.','GND'],['Tap the net that joins R2 to the LED.','C1'],['Tap the wire between the LED and the transistor.','COL']];
    const qbox=el('div',{class:'kwork'});
    const st=pcbState(render); st.flow=false;
    st.pick=n=>{ st.hi=st.hi===n?null:n; if(quizI<QZ.length&&st.hi){ if(n===QZ[quizI][1]){ quizI++; qbox.dataset.last='right'; } else qbox.dataset.last='wrong'; } render(); };
    function render(){ drawSchematic(svg,st);
      info.innerHTML=st.hi?`<div class="kh">Net: ${PCBK.NETS[st.hi][0]}</div><p>Connects ${PCBK.NETS[st.hi][1]}. Every point on this net is at the same voltage${st.hi==='GND'?': notice the two ground symbols are one net, even though no wire joins them on the drawing':''}.</p>`:'<p>Tap a wire to see its net. Tap the switch to flip it.</p>';
      qbox.innerHTML=quizI<QZ.length?`<div class="kh">Find the net (${quizI+1} of ${QZ.length})</div><p>${QZ[quizI][0]}</p>${qbox.dataset.last==='wrong'?'<p class="note">Not that one. Follow the line from the part named in the question.</p>':qbox.dataset.last==='right'?'<p class="good">Right.</p>':''}`:'<div class="kh">All four found</div><p class="good">You can trace a net from part to part. That is the core skill of reading any schematic.</p>'; }
    root.appendChild(bench('SCHEMATIC', svg, panel)); panel.appendChild(info); root.appendChild(qbox);
    root.__schem={st,get quizI(){return quizI;}};
    render();
    root.appendChild(el('h3',{class:'h'},[document.createTextNode('Six symbols')]));
    root.appendChild(el('div',{class:'tscroll'},[el('table',{class:'ktab tt',html:"<tr><th>Symbol</th><th>Part</th><th>Read it as</th></tr><tr><td>long and short plates</td><td>Battery</td><td>The long plate is +. Several pairs = several cells.</td></tr><tr><td>zig-zag (or a plain box in Europe)</td><td>Resistor</td><td>A fixed amount of opposition to current. Value written beside it.</td></tr><tr><td>triangle into a bar</td><td>Diode</td><td>Current flows the way the triangle points, never back.</td></tr><tr><td>diode plus two arrows out</td><td>LED</td><td>A diode that gives off light.</td></tr><tr><td>bar with two lines, one with an arrow</td><td>NPN transistor</td><td>The arrow sits on the emitter and points the way current leaves.</td></tr><tr><td>three shrinking lines</td><td>Ground</td><td>The 0 V reference. Every ground symbol is the same net.</td></tr></table>"})]));
    root.appendChild(el('h3',{class:'h'},[document.createTextNode('Three rules')]));
    root.appendChild(el('ul',{class:'clean',html:"<li><b>A dot means joined.</b> Where wires meet at a dot (like the one above SW1), they are connected.</li><li><b>Crossing without a dot means not joined.</b> Two lines can cross on paper and have nothing to do with each other.</li><li><b>Labels tie things together.</b> Each part has a <em>reference designator</em> (R1, Q1, D1), and the same label always means the same part, on the drawing, the board and the parts list.</li>"}));
    root.appendChild(el('p',{class:'note',html:"Reading direction: schematics are usually drawn with the positive supply at the top, ground at the bottom, and signals flowing left to right, so current tends to flow downward across the page. It is a convention, not a rule; the connections are what count."}));
  }});

STEPS.push({part:P_COMP, nav:"Printed circuit boards", title:"Printed circuit boards: the circuit made solid",
  sub:"The same circuit, made the way nearly all electronics is made: copper paths on a fibreglass board. Peel the layers apart, watch current flow through the copper and through the holes, then find a fault with a probe.",
  body(root){
    root.appendChild(el('p',{class:'lead',html:"A printed circuit board (PCB) turns every wire of a schematic into a flat copper path called a <span class='key'>trace</span>. Each part’s legs go through <span class='key'>plated holes</span> lined with copper, so a hole joins the top and bottom copper. When two traces must cross, one hops to the other side of the board through a small plated hole called a <span class='key'>via</span>."}));
    const sch=S('svg',{viewBox:'0 0 330 210',role:'img','aria-label':'Schematic of the circuit'}), pcb=S('svg',{viewBox:'0 0 340 200',role:'img','aria-label':'Printed circuit board of the same circuit'});
    const panel=el('div',{}); const info=el('div',{class:'kwork',role:'status'});
    const st=pcbState(render);
    const tg=(lab,get,set)=>{ const b=el('button',{type:'button',class:'tog'},[document.createTextNode(lab)]); const sync=()=>b.classList.toggle('on',get()); b.addEventListener('click',()=>{ set(!get()); sync(); render(); }); sync(); return b; };
    const row1=el('div',{class:'ctrlrow'},[tg('Exploded layers',()=>st.exploded,v=>st.exploded=v),tg('Current flow',()=>st.flow,v=>st.flow=v),tg('Switch SW1',()=>st.sw,v=>{st.sw=v;st.recalc();})]);
    const row2=el('div',{class:'ctrlrow'},[tg('Top copper',()=>st.layers.top,v=>st.layers.top=v),tg('Bottom copper',()=>st.layers.bot,v=>st.layers.bot=v),tg('Solder mask',()=>st.layers.mask,v=>st.layers.mask=v),tg('Silkscreen',()=>st.layers.silk,v=>st.layers.silk=v)]);
    panel.appendChild(row1); panel.appendChild(row2);
    const fbox=el('div',{class:'ctrl'}); fbox.appendChild(el('label',{},[document.createTextNode('Break it')]));
    const sel=el('select',{'aria-label':'Choose a board fault'}); [['none','Working board'],['crack','Cracked trace'],['bridge','Solder bridge'],['cold','Cold solder joint'],['mys','Mystery fault (find it with the probe)']].forEach(([k,t])=>sel.appendChild(el('option',{value:k},[document.createTextNode(t)])));
    sel.addEventListener('change',()=>{ st.probes=[]; st.revealed=false; st.guess=null; if(sel.value==='mys'){ st.fault='none'; st.mystery=['crack','bridge','cold'][Math.floor(Math.random()*3)]; st.probing=true; } else { st.mystery=null; st.fault=sel.value; st.revealed=true; } st.recalc(); });
    fbox.appendChild(sel); panel.appendChild(fbox);
    const probeBtn=tg('Probe mode: tap pads to measure',()=>st.probing,v=>{ st.probing=v; if(!v) st.probes=[]; }); panel.appendChild(el('div',{class:'ctrlrow'},[probeBtn]));
    root.appendChild(bench('SAME CIRCUIT · TWO DRAWINGS', el('div',{class:'pcbpair'},[sch,pcb]), panel)); root.appendChild(info);
    const FX={crack:['Cracked trace','A hairline crack in the copper between D1 and Q1. The board looks fine, but the path is open: no current, so the LED stays dark even with the switch closed. Probe both ends of the trace: the LED end floats near 7.4 V, the transistor end sits at 0 V. Two different voltages on what should be one net means a break between them. Cracks come from flexing, heat cycles and drops.'],
      bridge:['Solder bridge','A blob of solder joins Q1’s base and collector pads, which sit close together. The LED now lights whether the switch is open or closed: current from the LED flows straight into the base. Probe: base and collector read the same voltage (0.72 V), which they never do in a working switch. Bridges come from too much solder or pads too close together.'],
      cold:['Cold solder joint','D1’s anode was soldered without enough heat, so the joint is grainy and barely touching. The LED glows very dimly. Probe: the anode pad reads about 8.7 V and the cathode 0.2 V, so the LED seems to have 8.5 V across it, far more than an LED ever drops when lit. The missing volts are being lost in the bad joint. Cold joints are the most common hand-soldering fault.']};
    function render(){ st.flowEls=[]; drawSchematic(sch,st); drawPCB(pcb,st);
      const r=st.res, f=st.mystery?null:st.fault, H=st.hi; let h='';
      if(H) h+=`<div class="kh">Net: ${PCBK.NETS[H][0]}</div><p>On the board this net is ${PCBK.TR.filter(t=>t[0]===H).length} trace${PCBK.TR.filter(t=>t[0]===H).length>1?'s':''}${H==='BASE'?', one on the top copper reached through the via so it can cross the ground trace below':''}. In the schematic it is just a line.</p>`;
      h+=`<p>LED current <b>${r.led.toFixed(1)} mA</b> (${r.led>3?'lit':r.led>0.3?'very dim':'dark'}) · base current <b>${r.ib.toFixed(2)} mA</b> · switch ${st.sw?'closed':'open'}.</p>`;
      if(f&&f!=='none') h+=`<div class="kh">${FX[f][0]}</div><p>${FX[f][1]}</p>`;
      if(st.mystery){ h+=`<div class="kh">Mystery fault</div><p>Something is wrong with this board. Flip the switch, watch the LED, then probe pads (probe mode is on) and accuse:</p><div class="hl mguess"></div>`; if(st.guess) h+=`<p class="note">${st.guess}</p>`; }
      if(st.probes.length) h+=`<p class="note">Probe readings (to ground): ${st.probes.map(p=>PCBK.PADS[p.k][3]+' '+p.v.toFixed(2)+' V').join(' · ')}</p>`;
      info.innerHTML=h;
      if(st.mystery){ const g=info.querySelector('.mguess'); Object.keys(FX).forEach(k=>{ const b=el('button',{type:'button',class:'btn'},[document.createTextNode(FX[k][0])]); b.addEventListener('click',()=>{ if(k===st.mystery){ st.fault=k; st.mystery=null; st.revealed=true; sel.value=k; st.guess=null; } else st.guess=`Not a ${FX[k][0].toLowerCase()}: ${k==='crack'?'with a crack the LED never lights at all, and two ends of one trace read differently.':k==='bridge'?'a bridge lights the LED even with the switch open.':'a cold joint leaves the LED dim, not dark or stuck on.'}`; render(); }); g.appendChild(b); }); }
      probeBtn.classList.toggle('on',st.probing); }
    root.__pcb={st,render,sel,FX};
    render();
    let last=0; rAFLoop(t=>{ const dt=Math.min(.05,t-last); last=t; st.flowEls.forEach(f=>{ f.__o-=f.__v*dt; f.setAttribute('stroke-dashoffset',f.__o.toFixed(1)); }); });
    root.appendChild(el('p',{html:"<b>What each layer does.</b> The <em>core</em> is fibreglass cloth set in epoxy (called FR-4): stiff, cheap, and an insulator. <em>Copper</em> is bonded to each side and etched away everywhere except the traces and pads. The green <em>solder mask</em> covers the copper except where parts are soldered, so solder can’t bridge between traces. The white <em>silkscreen</em> prints part outlines and labels like R1 and Q1, the same reference designators as on the schematic. Phones and computers use boards with 8 to 20 or more copper layers stacked up and joined by vias."}));
    root.appendChild(el('p',{class:'note',html:"Why fault-find with voltages? Most board faults are invisible: a crack can be thinner than a hair. A meter turns the invisible into numbers, and the rule is always the same: every point on one net should read the same voltage. Where two points that should match don’t, the fault is between them."}));
  }});

STEPS.push(recallStep(P_COMP,'comp',"Check: Components","Check yourself — Components",
  "Fourteen questions across the parts, the circuit laws, counting and circuit boards. Picture the sim if it helps — that’s retrieval too.",[
  {q:"On a circuit board, one end of a trace reads 7.4 V and the other end reads 0 V. What does that tell you?",
   o:["Both readings are normal","The trace is cracked somewhere between the two points","The battery is flat","The trace needs a thicker wire"],a:1,
   why:"Every point on one net should read the same voltage, because a good trace has almost no resistance. A big difference between two ends means the path is broken between them.",see:"Printed circuit boards"},
  {q:"A 4-bit counter never shows the numbers 4 to 15; it runs 0, 1, 2, 3 and starts again. Where is the fault most likely?",
   o:["The 1s stage","Between the 2s stage and the 4s stage","The clock is too fast","The 8s light has burned out"],a:1,
   why:"The 1s and 2s stages count fine (0–3 appear), but nothing above them ever changes, so the signal is lost after the 2s stage: a cut connection, or a dead 4s stage. The missing numbers point at the broken stage.",see:"Counters & registers"},
  {q:"You connect an LED straight across 9 V with no resistor. What happens?",
   o:["It glows at a safe brightness","It stays off because 9 V is too much","Nothing limits the current, so it overheats and fails","It glows dimly"],a:2,
   why:"Once on, an LED holds about 1.8 V and will pass far more current than it can survive. The series resistor takes up the rest of the voltage and sets a safe current (10–20 mA).",see:"LED"},
  {q:"Which of these parts does <em>not</em> follow Ohm’s law (is non-ohmic)?",
   o:["A carbon resistor","A length of copper wire","A diode","Two resistors in series"],a:2,
   why:"A diode barely conducts below its turn-on voltage, then conducts hard above it — a bent I–V curve, not a straight line. Resistors and wires are ohmic.",see:"When Ohm’s law applies"},
  {q:"A capacitor charges through a resistor. After one time constant (τ = R × C), roughly how full is it?",
   o:["10%","50%","63%","100%"],a:2,
   why:"After one τ it’s about 63% charged; after about 5τ it’s effectively full. Larger R or larger C means a longer τ.",see:"Capacitor"},
  {q:"A scope is set to <strong>2 V/div</strong> and <strong>0.5 s/div</strong>. A square wave is 3 squares tall, and one full cycle spans 2 squares. What are its amplitude and frequency?",
   o:["3 V and 2 Hz","6 V and 1 Hz","6 V and 2 Hz","1.5 V and 0.5 Hz"],a:1,
   why:"Height: 3 div × 2 V/div = 6 V. Period: 2 div × 0.5 s/div = 1 s, and frequency = 1 ÷ period = 1 Hz. Count squares, then multiply by what each square is worth.",see:"The oscilloscope"},
  {q:"A transistor with a gain of 100 gets 50 µA into its base. About how much current can flow through its load?",
   o:["0.5 µA","50 µA","5 mA","5 A"],a:2,
   why:"50 µA × 100 = 5,000 µA = 5 mA. A tiny base current controls a load current about 100 times larger — that multiplication is the whole idea.",see:"Transistor"},
  {q:"An AND gate has input A on (1) and input B off (0). What is the output?",
   o:["1","0","It depends on the voltage","It flickers"],a:1,
   why:"AND outputs 1 only when <em>both</em> inputs are 1. An OR gate would output 1 here.",see:"Logic gates"},
  {q:"Why does a motor usually sit behind a transistor or driver rather than connecting straight to a logic chip’s output?",
   o:["Motors only run on AC","A motor draws far more current than a chip’s output can supply","Logic chips can’t output any voltage","Motors damage transistors"],a:1,
   why:"Coils and motors pull large currents. The chip sends a small signal; the transistor switches the big current the motor needs.",see:"Motor & coil"},
  {q:"Which of these was <em>found by accident</em> while someone was trying to do something else?",
   o:["The transistor (Bell Labs, 1947)","The capacitor (the Leyden jar, 1745–46)","The solderless breadboard (1971)","The triggered oscilloscope (1947)"],a:1,
   why:"Von Kleist and Musschenbroek were trying to store electricity in a jar of water and got a violent shock. The other three came out of deliberate design work aimed at a known problem.",see:"Capacitor"},
  {q:"In the liquid picture of a NAND gate, why does the lamp go dark when A and B are both on?",
   o:["Both valves cut off the supply","Both drain valves open, so the liquid takes the easy path to the drain instead of through the lamp","The lamp runs out of power","The narrow pipe closes"],a:1,
   why:"NAND’s two valves sit in a row on a drain beside the lamp. Only when both open does the drain work, and liquid (or current) always prefers the easiest path, so the lamp starves. Nothing was switched off; the flow was diverted.",see:"See the flow: gates"},
  {q:"Two 100 Ω resistors are connected <em>in parallel</em>. What is their total resistance?",
   o:["200 Ω","100 Ω","50 Ω","0 Ω"],a:2,
   why:"In parallel, total = R1 × R2 ÷ (R1 + R2) = 10,000 ÷ 200 = 50 Ω. Two equal paths carry twice the current, which is what half the resistance means. In series they would add to 200 Ω.",see:"Series & parallel"},
  {q:"Old Christmas-light strings went completely dark when one bulb failed. Why?",
   o:["The other bulbs overheated","The bulbs were in series, so one open bulb broke the only path","The fuse blew","The bulbs were in parallel"],a:1,
   why:"In series there is one path for current. One open bulb breaks it, and current stops everywhere in the loop. In parallel, the others would have stayed lit.",see:"Series & parallel"},
  {q:"30 mA flows into a junction. One branch out carries 12 mA. How much flows in the other branch?",
   o:["42 mA","30 mA","18 mA","12 mA"],a:2,
   why:"Kirchhoff’s current law: what flows in must flow out. 30 = 12 + ?, so 18 mA.",see:"Kirchhoff’s laws"}
]));

/* ---- 10. Project 1: current-limited LED ---- */
STEPS.push({part:P_PROJ, nav:"P1 · Lit LED (DC)", title:"Project 1 — Light an LED safely",
  sub:"Functionally: pure resistive DC. The smallest complete, useful circuit there is — and the template for every powered output.",
  body(root){
    root.appendChild(el('p',{class:'lead',html:"Battery → resistor → LED → back to battery. That’s the whole project. The resistor sets a safe current; the LED turns it into light. Get this and you understand the output side of almost everything."}));
    root.appendChild(frame([
      ['Why it matters',"It’s the “hello world” of hardware. Every device that lights up, charges, or signals is managing current to a load exactly like this."],
      ['What it teaches',"Ohm’s Law in a real loop, series current, picking a resistor for a target current, and reading power dissipation."],
      ['What it tests',"Can you choose R so the LED is bright but safe (≈10–20&nbsp;mA)? Can you predict what happens if R is too small or the LED is backwards?"],
      ['Out in the world',"Indicator LEDs on every appliance, charger and dashboard status light; pull-up/pull-down current setting on any board."],
      ['Combines into',"Becomes the <span class='key'>output stage</span> for the next three projects — the thing a timer blinks, a gate enables, or a sensor switches on."]
    ]));
    const svg=S('svg',{viewBox:'0 0 340 150'});
    svg.appendChild(S('path',{d:'M40 110 V50 H300 V110 Z',fill:'none',stroke:'var(--line)','stroke-width':3}));
    svg.appendChild(S('rect',{x:120,y:38,width:46,height:24,rx:4,fill:'#caa46b',stroke:'#8a6a36'}));
    svg.appendChild(S('path',{d:'M210 38 L210 62 L234 50 Z',fill:'#3a2f1c',stroke:'var(--copper)'}));
    svg.appendChild(S('line',{x1:234,y1:36,x2:234,y2:64,stroke:'var(--copper)','stroke-width':3}));
    const led=S('circle',{id:'p1led',cx:222,cy:50,r:7,fill:'#2a2f37'}); const halo=S('circle',{id:'p1h',cx:222,cy:50,r:0,fill:'var(--copper)',opacity:.3});
    svg.appendChild(halo); svg.appendChild(led);
    const panel=el('div',{},[]);
    const cR=el('div',{class:'ctrl'},[el('label',{},[document.createTextNode('Resistor (9 V supply)'),Object.assign(document.createElement('b'),{id:'p1R'})])]);
    const rngR=el('input',{type:'range',min:'0',max:'1000',step:'10',value:'470'}); cR.appendChild(rngR);
    panel.appendChild(cR);
    panel.appendChild(readout([{k:'Current',id:'p1I',u:'mA'},{k:'Verdict',id:'p1V',u:''}]));
    root.appendChild(bench('PROJECT 1', svg, panel));
    function upd(){ const R=parseFloat(rngR.value), I=R<=0?1000:Math.max(0,(9-1.8)/R), mA=I*1000, b=Math.max(0,Math.min(1,mA/15));
      root.querySelector('#p1R').textContent=R+' Ω'; root.querySelector('#p1I').textContent=mA>999?'∞':mA.toFixed(1);
      const verd = mA>30?'too hot': mA<3?'dim': 'good'; const e=root.querySelector('#p1V'); e.textContent=verd; e.className='v '+(verd==='good'?'':(verd==='too hot'?'warn':'cool'));
      root.querySelector('#p1I').className='v '+(mA>30?'warn':''); led.setAttribute('fill', b>0.04?'var(--copper)':'#2a2f37'); halo.setAttribute('r',7+b*20); }
    rngR.addEventListener('input',upd); upd();
  }});

/* ---- 11. Project 2: multivibrator blinker ---- */
STEPS.push({part:P_PROJ, nav:"P2 · Blinker (timing)", title:"Project 2 — A self-blinking light",
  sub:"Functionally: timing & oscillation. Two transistors and two capacitors take turns, and steady DC becomes rhythm with no moving parts.",
  body(root){
    root.appendChild(el('p',{class:'lead',html:"An <span class='key'>astable multivibrator</span> has two sides that keep shutting each other off in turn. Each side waits while a capacitor charges through a resistor, then flips — so the LEDs alternate. The blink rate is set by <strong>R&nbsp;×&nbsp;C</strong>, the same time constant from the capacitor lesson."}));
    root.appendChild(frame([
      ['Why it matters',"It’s the first circuit that <em>does something on its own</em> over time. It manufactures timing — the basis of clocks, blinkers, and tones."],
      ['What it teaches',"RC timing turned into a repeating beat, positive feedback, and how to predict frequency from R and C."],
      ['What it tests',"Can you make it blink faster or slower on purpose? Do you see why bigger C or R means a slower blink?"],
      ['Out in the world',"Turn-signal flashers, blinking warning beacons, metronomes, simple alarm tones, and the clock that paces digital chips."],
      ['Combines into',"Feed its beat into a <span class='key'>logic gate</span> or counter and you get sequencing; send it to a speaker and you get sound; gate it with a sensor and you get a blinking alert that only runs when needed."]
    ]));
    const svg=S('svg',{viewBox:'0 0 340 150'});
    const L1=S('circle',{id:'mvL1',cx:110,cy:75,r:18,fill:'var(--copper)'}); const L2=S('circle',{id:'mvL2',cx:230,cy:75,r:18,fill:'#2a2f37'});
    const h1=S('circle',{id:'mvh1',cx:110,cy:75,r:0,fill:'var(--copper)',opacity:.3}); const h2=S('circle',{id:'mvh2',cx:230,cy:75,r:0,fill:'var(--copper)',opacity:.3});

    svg.appendChild(S('text',{x:230,y:115,fill:'var(--muted)','font-size':'10','text-anchor':'middle'})).textContent='LED B';
    const panel=el('div',{},[]);

    const cC=el('div',{class:'ctrl'},[el('label',{},[document.createTextNode('Timing capacitor'),Object.assign(document.createElement('b'),{id:'mvC'})])]);

    panel.appendChild(cR); panel.appendChild(cC);

    function half(){ const R=parseFloat(rngR.value)*1000, C=parseFloat(rngC.value)*1e-6; return 0.69*R*C; } // sec per side
    function labels(){ root.querySelector('#mvR').textContent=rngR.value+' kΩ'; root.querySelector('#mvC').textContent=rngC.value+' µF';
      const h=half(); root.querySelector('#mvT').textContent=(h*1000).toFixed(0); root.querySelector('#mvF').textContent=(1/(2*h)).toFixed(2); }
    // ---- which LED is lit is computed straight from the clock, so even blinks faster than the screen refresh are timed correctly
    const VS=9; let tNow=0, ep=0, hNow=half();
    const phaseAt=t=>{ const k=Math.floor((t-ep)/hNow); return ((k%2)+2)%2; };   // 0 → LED A lit, 1 → LED B lit
    const sc=makeScope({chans:[{name:'CH1 · LED A',color:'var(--copper)',step:true,zero:5},{name:'CH2 · LED B',color:'var(--phos)',step:true,zero:1}],vdiv:5,tdiv:0.5});
    const sp=el('div',{},[]);

    const blurNote=el('p',{class:'note',id:'mvBlur',style:'display:none',html:"<strong>Faster than your eye:</strong> above roughly 20 blinks a second your eye blends the flashes, so both LEDs look half-lit. The scope still sees every switch-over."});
    sp.appendChild(blurNote);
    sp.appendChild(el('p',{class:'note',html:"Each channel is high while its LED is lit. They are mirror images: one side is always on while the other is off. That is how “astable” looks on a scope."}));
    function retime(){ const h=half(); const keepPhase=phaseAt(tNow); ep=tNow-(keepPhase?h:0); hNow=h; // keep the current LED lit when the timing changes
      sc.set({tdiv:niceDiv(2*h*4/10)}); root.querySelector('#mvWin').textContent=fmtTime(10*sc.tdiv)+' ≈ '+(10*sc.tdiv/(2*h)).toFixed(1)+' cycles'; }
    function measure(){ // find rising edges of CH1 across the visible window, exactly as you'd count divisions on a real scope
      const win=10*sc.tdiv, tEnd=Math.max(tNow,win), t0=tEnd-win, n=4000; let prev=null, edges=[];
      for(let i=0;i<=n;i++){ const t=t0+win*i/n, a=phaseAt(t)===0; if(prev===false && a) edges.push(t); prev=a; }
      if(edges.length>=2){ const T=(edges[edges.length-1]-edges[0])/(edges.length-1);
        root.querySelector('#mvMP').textContent=fmtTime(T); root.querySelector('#mvMF').textContent=(1/T).toFixed(2)+' Hz'; }
      else { root.querySelector('#mvMP').textContent='need 2 cycles on screen'; root.querySelector('#mvMF').textContent='—'; } }
    function paint(){
      const tView=REDUCE?10*sc.tdiv:tNow, f=1/(2*hNow), fast=f>20 && !REDUCE;
      const a=phaseAt(tView)===0;

      else { L1.setAttribute('fill',a?'var(--copper)':'#2a2f37'); L2.setAttribute('fill',a?'#2a2f37':'var(--copper)'); h1.setAttribute('r',a?26:0); h2.setAttribute('r',a?0:26); }

    }
    rngR.addEventListener('input',()=>{ labels(); retime(); measure(); paint(); }); rngC.addEventListener('input',()=>{ labels(); retime(); measure(); paint(); });
    root.appendChild(scopeBench('SCOPE · BOTH LED DRIVES', sc, sp));
    labels(); retime();
    measure(); paint();
    let lastM=0; rAFLoop(t=>{ tNow=t; paint(); if(t-lastM>0.25){ lastM=t; measure(); } });
  }});

STEPS.push({part:P_CMP, nav:"Counting before computing", title:"Before computers: counting and keeping accounts",

  body(root){

    const tl=el('ol',{class:'otl','aria-label':'Timeline of counting and record-keeping'});
    [['~40,000 yrs ago','Notched bones','The Lebombo bone from southern Africa carries a row of cut notches. Whether they were a tally is debated, but marks standing for counts are among the oldest traces of record-keeping.'],
     ['~20,000 yrs ago','The Ishango bone','A bone from central Africa with grouped notches. Some researchers read arithmetic patterns in it; others see a simple tally. Either way, a count is being <em>stored</em> outside a human head.'],
     ['from ~8000 BCE','Clay tokens','Small clay shapes stood for goods: a cone for a measure of grain, a disc for a sheep. In the influential theory of archaeologist Denise Schmandt-Besserat, tokens were sealed in clay envelopes, marks pressed on the outside to show what was inside — and those marks became writing.'],

     ['~200 BCE','The Antikythera mechanism','Bronze gears that computed the positions of the sky. Arithmetic done by a machine, but fixed: it could only ever compute the one thing its gears were cut for.'],

STEPS.push({part:P_CMP, nav:"Heron’s programmable cart", title:"Heron’s cart: a program made of rope",
  sub:"In the 1st century CE, Heron of Alexandria built a cart that drove a set route on its own. To change the route, you rewound the rope.",
  body(root){
    root.appendChild(el('p',{class:'lead',html:"Heron described a cart powered by a <strong>falling weight</strong>. The weight pulls a rope wound around the cart’s axle. Wind the rope one way and the wheel turns forward; wind it the other way and it reverses; leave a slack loop hooked over a peg and the cart pauses until the slack is taken up. In modern reconstructions each drive wheel has its own axle and rope, so winding them differently makes the cart turn."}));
    root.appendChild(el('p',{html:"The <strong>way the rope is wound is the program</strong>. Build one below: each step adds one stretch of rope to both wheels. Then let the weight fall."}));
    const svg=S('svg',{viewBox:'0 0 340 236',role:'img','aria-label':'Top view of the cart driving its programmed route, with the two rope drums below'});
    const arena=S('g',{}); svg.appendChild(arena);
    arena.appendChild(S('rect',{x:4,y:4,width:332,height:168,rx:8,fill:'#141920',stroke:'var(--line)'}));
    for(let x=24;x<336;x+=20) arena.appendChild(S('line',{x1:x,y1:6,x2:x,y2:170,stroke:'#1b222b'}));
    for(let y=24;y<172;y+=20) arena.appendChild(S('line',{x1:6,y1:y,x2:334,y2:y,stroke:'#1b222b'}));
    const trail=S('polyline',{fill:'none',stroke:'var(--copper)','stroke-width':2.5,'stroke-linejoin':'round',points:''}); arena.appendChild(trail);
    const cart=S('g',{}); cart.appendChild(S('rect',{x:-11,y:-8,width:22,height:16,rx:3,fill:'#c8a46a',stroke:'#6b5330'}));
    cart.appendChild(S('rect',{x:-9,y:-11,width:8,height:4,rx:1,fill:'#333'})); cart.appendChild(S('rect',{x:-9,y:7,width:8,height:4,rx:1,fill:'#333'}));
    cart.appendChild(S('path',{d:'M11 0 L5 -4 L5 4 Z',fill:'#6b5330'})); arena.appendChild(cart);
    const drums=S('g',{}); svg.appendChild(drums);
    const panel=el('div',{},[]);
    const pal=el('div',{class:'seg'}); const MOVES=[['F','Forward','#e0922f'],['B','Back','#5b9bd6'],['L','Turn left','#a98bdb'],['R','Turn right','#46d39a'],['P','Pause','#69727e']];
    MOVES.forEach(([k,t])=>{ const b=el('button',{type:'button'},[document.createTextNode('+ '+t)]); b.dataset.k=k; pal.appendChild(b); }); panel.appendChild(pal);
    const pre=el('div',{class:'seg'}); [['Square','FRFRFRFR'],['Out and back','FFFLLFFF'],['Zig-zag','FLFRRFLF']].forEach(([n,p])=>{ const b=el('button',{type:'button'},[document.createTextNode(n)]); b.dataset.p=p; pre.appendChild(b); });
    panel.appendChild(el('div',{class:'note',style:'margin:0 0 6px'},[document.createTextNode('Or load a ready-wound rope:')])); panel.appendChild(pre);
    const ctl=el('div',{class:'seg'}); const run=el('button',{type:'button',class:'on'},[document.createTextNode('▶ Drop the weight')]), undo=el('button',{type:'button'},[document.createTextNode('Undo')]), clr=el('button',{type:'button'},[document.createTextNode('Rewind all')]);
    [run,undo,clr].forEach(b=>ctl.appendChild(b)); panel.appendChild(ctl);
    panel.appendChild(readout([{k:'Program',id:'hcProg',u:''},{k:'Steps',id:'hcN',u:'',cls:'amber'}]));
    root.appendChild(bench('HERON’S CART · c. 60 CE', svg, panel));
    // winding for each move: left wheel, right wheel (+1 forward, −1 reverse, 0 slack on a peg)
    const WIND={F:[1,1],B:[-1,-1],L:[-1,1],R:[1,-1],P:[0,0]};
    let prog='FRFRFRFR', anim=null;
    function drawDrums(active){
      drums.innerHTML=''; const y0=186, n=Math.max(prog.length,1), w=Math.min(26,300/n);
      ['Left wheel rope','Right wheel rope'].forEach((lab,wi)=>{ const y=y0+wi*24;
        const t=S('text',{x:4,y:y+4,fill:'var(--faint)','font-size':'8'}); t.textContent=lab; drums.appendChild(t);
        [...prog].forEach((k,i)=>{ const d=WIND[k][wi], x=74+i*w, col=d>0?'#e0922f':d<0?'#5b9bd6':'#3a414c', on=i===active;
          drums.appendChild(S('rect',{x,y:y-6,width:w-2,height:12,rx:3,fill:col,'fill-opacity':on?1:.55,stroke:on?'#fff':'none'}));
          if(d===0) drums.appendChild(S('circle',{cx:x+(w-2)/2,cy:y,r:2.5,fill:'#cfd6dd'})); }); });
      const lg=S('text',{x:74,y:y0+42,fill:'var(--faint)','font-size':'8'}); lg.textContent='orange = forward · blue = backward · grey + peg = slack (pause)'; drums.appendChild(lg);
    }
    function pose(t){ // exact: every move is either straight (equal windings), a turn on the spot (opposite windings) or a pause
      let x=110,y=120,a=0; const pts=[[x,y]];
      for(let i=0;i<prog.length && i<t;i++){ const f=Math.min(1,t-i), [vl,vr]=WIND[prog[i]];
        const dist=(vl+vr)/2*56*f, turn=(vr-vl)/2*(Math.PI/2)*f;
        if(turn){ const n=8; for(let j=1;j<=n;j++){ pts.push([x,y]); } a-=turn; }
        if(dist){ const n=10; for(let j=1;j<=n;j++) pts.push([x+Math.cos(a)*dist*j/n, y+Math.sin(a)*dist*j/n]); x+=Math.cos(a)*dist; y+=Math.sin(a)*dist; } }
      return {x,y,a,pts};
    }
    function show(t){ const p=pose(t); cart.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${(p.a*180/Math.PI).toFixed(1)})`);
      trail.setAttribute('points',p.pts.filter((_,i)=>i%2===0).map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')); drawDrums(t<prog.length?Math.floor(t):-1); }
    function labels(){ root.querySelector('#hcProg').textContent=prog?[...prog].map(k=>({F:'fwd',B:'back',L:'left',R:'right',P:'pause'})[k]).join(' · '):'(no rope wound)'; root.querySelector('#hcN').textContent=prog.length+' / 12'; }
    function stop(){ if(anim){ anim(); anim=null; } }
    function reset(){ stop(); labels(); show(0); }
    function go(){ stop(); if(!prog) return; if(REDUCE){ show(prog.length); return; }
      let t0=null, id, alive=true; const tick=ts=>{ if(!alive) return; if(t0===null) t0=ts; const t=(ts-t0)/1000*1.4; show(Math.min(t,prog.length)); if(t<prog.length) id=requestAnimationFrame(tick); };
      id=requestAnimationFrame(tick); anim=()=>{ alive=false; cancelAnimationFrame(id); }; anims.push(()=>{ if(anim) anim(); }); }
    pal.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ if(prog.length<12){ prog+=b.dataset.k; reset(); } }));
    pre.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ prog=b.dataset.p; reset(); go(); }));
    run.addEventListener('click',go); undo.addEventListener('click',()=>{ prog=prog.slice(0,-1); reset(); }); clr.addEventListener('click',()=>{ prog=''; reset(); });
    reset(); go();
    root.appendChild(el('h3',{class:'h'},[document.createTextNode('What makes this a program — and what it can’t do')]));
    root.appendChild(el('ul',{class:'clean',html:
      "<li><strong>It is a sequence.</strong> Instructions run one after another, in order, as the weight falls — like every program since.</li>"+
      "<li><strong>It can pause.</strong> A slack loop is a “wait” instruction.</li>"+
      "<li><strong>It can’t decide.</strong> There is no <em>if</em>: the cart can’t sense a wall and choose a new path. Decisions had to wait for logic — the gates you met earlier.</li>"+
      "<li><strong>The program is the hardware.</strong> To change it you physically rewind the rope. Separating the program from the machine took another 1,700 years.</li>"}));
    root.appendChild(el('p',{class:'note',html:"Heron’s design survives in his treatise on automata. Its drive is described as a programmable mechanism by modern researchers, including roboticist Noel Sharkey, who built a working reconstruction in 2007. Around 1206, al-Jazari described musical automata driven by a rotating drum with movable pegs — rearrange the pegs and the tune changes, an early swappable program."}));
  }});

STEPS.push({part:P_CMP, nav:"Punched cards", title:"Punched cards: when the program became separate from the machine",
  sub:"A hole or no hole. Jacquard used it to weave, Babbage to calculate, Hollerith to count a nation. It is the first binary program format.",
  body(root){
    root.appendChild(el('p',{class:'lead',html:"In 1804 Joseph Marie Jacquard patented a loom attachment controlled by a chain of punched cards, building on earlier French looms. Each card is one row of the cloth. Where the card has a <strong>hole</strong>, a hook passes through and lifts its thread; where there’s <strong>no hole</strong>, the hook is blocked. Hole = 1, no hole = 0."}));
    root.appendChild(el('p',{html:"The breakthrough: <strong>the same loom weaves any pattern</strong>. Change the cards, not the machine. Punch holes below (tap the cells), then weave."}));
    const COLS=12, ROWS=12; let deck=[];
    const PRESETS={Diamond:r=>{ const c=Math.abs(5.5-r); return Array.from({length:COLS},(_,i)=>Math.abs(5.5-i)+c<=5.5&&Math.abs(5.5-i)+c>=3.5?1:0); },
      Checker:r=>Array.from({length:COLS},(_,i)=>((Math.floor(i/3)+Math.floor(r/3))%2)),
      Stripes:r=>Array.from({length:COLS},(_,i)=>i%4<2?1:0), Blank:r=>new Array(COLS).fill(0)};
    function load(n){ deck=Array.from({length:ROWS},(_,r)=>PRESETS[n](r)); }
    load('Diamond');
    const svg=S('svg',{viewBox:'0 0 340 220',role:'img','aria-label':'Punched card deck on the left, woven cloth on the right'});
    const cardG=S('g',{}), clothG=S('g',{}); svg.appendChild(cardG); svg.appendChild(clothG);
    const hd=S('text',{x:8,y:12,fill:'var(--faint)','font-size':'8'}); hd.textContent='CARD DECK (tap to punch)'; svg.appendChild(hd);
    const hc=S('text',{x:200,y:12,fill:'var(--faint)','font-size':'8'}); hc.textContent='WOVEN CLOTH'; svg.appendChild(hc);
    const reader=S('rect',{x:6,y:0,width:162,height:15,rx:3,fill:'none',stroke:'var(--copper)','stroke-width':2,opacity:0}); svg.appendChild(reader);
    const panel=el('div',{},[]);
    const pseg=el('div',{class:'seg'}); Object.keys(PRESETS).forEach(n=>{ const b=el('button',{type:'button',class:n==='Diamond'?'on':''},[document.createTextNode(n)]); b.dataset.n=n; pseg.appendChild(b); }); panel.appendChild(pseg);
    const wv=el('button',{type:'button',class:'btn go',style:'width:100%;justify-content:center;margin:4px 0 12px'},[document.createTextNode('Weave the deck ›')]); panel.appendChild(wv);
    panel.appendChild(readout([{k:'Holes punched',id:'jqH',u:'',cls:'amber'},{k:'Bits of program',id:'jqB',u:''}]));
    root.appendChild(bench('JACQUARD LOOM · 1804', svg, panel));
    let woven=ROWS;
    function draw(hi){
      cardG.innerHTML=''; clothG.innerHTML='';
      for(let r=0;r<ROWS;r++){ const y=20+r*16;
        cardG.appendChild(S('rect',{x:8,y,width:158,height:13,rx:2,fill:'#d9c9a3',stroke:'#a8956b'}));
        for(let c=0;c<COLS;c++){ const hole=S('circle',{cx:16+c*12.6,cy:y+6.5,r:3.6,fill:deck[r][c]?'#15171c':'#c4b48e',stroke:deck[r][c]?'none':'#b3a27a',style:'cursor:pointer'});
          hole.addEventListener('click',()=>{ deck[r][c]^=1; pseg.querySelectorAll('button').forEach(b=>b.classList.remove('on')); woven=ROWS; draw(); counts(); }); cardG.appendChild(hole); }
        if(r<woven) for(let c=0;c<COLS;c++){ clothG.appendChild(S('rect',{x:200+c*11,y,width:10.4,height:15,fill:deck[r][c]?'#3a5f8f':'#e0922f'})); }
      }
      reader.setAttribute('opacity',hi!=null?1:0); if(hi!=null) reader.setAttribute('y',18+hi*16);
    }
    function counts(){ const h=deck.flat().reduce((a,b)=>a+b,0); root.querySelector('#jqH').textContent=h; root.querySelector('#jqB').textContent=(ROWS*COLS)+' (each spot: hole or not)'; }
    pseg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ load(b.dataset.n); pseg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); woven=ROWS; draw(); counts(); }));
    wv.addEventListener('click',()=>{ if(REDUCE){ woven=ROWS; draw(); return; } woven=0; let t0=null, alive=true, id; const tick=ts=>{ if(!alive) return; if(t0===null) t0=ts; const r=Math.floor((ts-t0)/220); woven=Math.min(ROWS,r); draw(r<ROWS?r:null); if(r<ROWS) id=requestAnimationFrame(tick); }; id=requestAnimationFrame(tick); anims.push(()=>{ alive=false; cancelAnimationFrame(id); }); });
    draw(); counts();
    root.appendChild(el('p',{class:'note',html:"Blue squares are where a hole lifted the blue lengthwise thread over the copper cross-thread. The program is 144 yes/no choices — 144 <em>bits</em>, though nobody called them that for another 140 years."}));
    const tl=el('ol',{class:'otl','aria-label':'From looms to data processing'});
    [['1804','Jacquard’s loom','Cards control a machine. Pattern (program) and loom (hardware) are finally separate.'],
     ['1837','Babbage’s Analytical Engine','Charles Babbage designs a general calculating engine in brass and steam, borrowing Jacquard’s cards: some cards for operations, others for numbers. It is never completed.'],
     ['1843','Ada Lovelace','Her notes on the engine include a step-by-step method for it to compute Bernoulli numbers, often called the first published program. She wrote that the engine “weaves algebraical patterns just as the Jacquard-loom weaves flowers and leaves” — and saw that it could work on anything representable as symbols, even music.'],
     ['1890','Hollerith’s census machines','Herman Hollerith’s punched cards record answers, not instructions: each hole is a fact about one person. Electric readers count them far faster than clerks could. His company later became IBM.']
    ].forEach(([y,t,d])=>tl.appendChild(el('li',{},[el('span',{class:'oy'},[document.createTextNode(y)]),el('span',{html:`<b>${t}.</b> ${d}`})])));
    root.appendChild(tl);
    root.appendChild(el('p',{html:"Two kinds of holes, two big ideas. Jacquard’s and Babbage’s cards held <strong>instructions</strong>; Hollerith’s held <strong>data</strong>. A modern computer stores both in the same memory, as the same kind of 1s and 0s. That idea — the stored program — is where the next lesson goes."}));
  }});

STEPS.push({part:P_CMP, nav:"Bootstrapping", title:"Programming without programming: the bootstrap ladder",
  sub:"How do you program the first computer when there is no software yet? By hand — then you use that to build the tool that makes the next step easier.",
  body(root){
    root.appendChild(el('p',{class:'lead',html:"The puzzle sounds impossible: you need software to write software. The answer is a <span class='key'>ladder</span>. The first rung is done by hand, with plugs and switches. Each rung is then used to build the next, easier one. Computer people still call starting up a machine “booting”, from pulling yourself up by your own bootstraps."}));
    root.appendChild(el('p',{html:"Below, the <strong>same tiny program</strong> — add two numbers, A + B, and keep the answer as C — is written at each rung. Tap a rung."}));
    const RUNGS=[
     ['1944–45','Plug cables and switches','Colossus (1944, code-breaking) and ENIAC (1945) had no stored program. You “wrote” a program by plugging cables between units and setting dials. Changing the problem could take days.',
      'Run a cable from accumulator 1 to accumulator 3.\nRun a cable from accumulator 2 to accumulator 3.\nSet accumulator 3 to “receive”.\nPress go.',
      'Colossus stayed secret until the 1970s, so for decades its builders couldn’t be credited — a “recognised later” story in its purest form.'],
     ['1948','Bits entered by hand','On 21 June 1948 the Manchester “Baby” ran the first program held in a computer’s own memory. Instructions were 1s and 0s, entered one bit at a time with switches.',
      '0001 0101   load A\n0010 0110   add B\n0011 0111   store in C\n(illustrative codes — each machine had its own)',
      'This is the stored program: instructions and data live in the same memory, like Hollerith’s and Babbage’s two kinds of holes combined.'],
     ['1949','A loader on paper tape','EDSAC at Cambridge (1949) started with a short built-in routine, the “initial orders” written by David Wheeler, that read programs from punched paper tape and translated simple letter codes into machine bits.',
      'A 5\nA 6\nT 7\n(punched on tape: Add, Add, Transfer)',
      'Now people write letters instead of bits, and the machine does the translating. The first tool built with the rung below.'],
     ['1950s','Assembly language','Short words for each machine instruction, translated by an <em>assembler</em> that was itself first written in machine code.',
      'LOAD  A\nADD   B\nSTORE C',
      'One line still equals one machine instruction, but humans can read it.'],
     ['1952–57','Compilers and languages','Grace Hopper’s A-0 (1952) and IBM’s FORTRAN (1957) let you write in something close to mathematics; a <em>compiler</em> turns it into machine instructions.',
      'C = A + B',
      'Many people doubted a program could write programs well. Hopper later said she was told computers could only do arithmetic.'],
     ['1956','The operating system','Running a computer was a human job: an operator loaded each program, ran it, and collected the results. GM-NAA I/O (1956, for the IBM 704) automated that job — load the next program, run it, move on.',
      '(no new code — the OS now loads and runs\n the program for you, one job after another)',
      'An operating system began as the computer operator, written as software.'],
     ['1960s →','Keyboards and terminals','Teleprinters — typewriter-like machines built for telegraph networks — became the first interactive terminals. Time-sharing let many people type to one computer at once.',
      '> C = A + B\n> PRINT C',
      'The keyboard came from the telegraph, which takes this whole story back to the trainer’s Lineage track.']
    ];
    const lad=el('div',{class:'ladder'}); const det=el('div',{class:'rungdet',role:'status'});
    function pick(i){ lad.querySelectorAll('.rung').forEach(r=>{ const on=+r.dataset.i===i; r.classList.toggle('on',on); r.setAttribute('aria-pressed',on); });
      const [y,t,d,code,why]=RUNGS[i];
      det.innerHTML=`<div class="rd-h">${y} · ${t}</div><p>${d}</p><div class="rd-k">A + B → C at this rung</div><pre>${code}</pre><p class="note">${why}</p>${i<RUNGS.length-1?`<p class="note"><b>Built next, using this rung:</b> ${RUNGS[i+1][1].toLowerCase()}.</p>`:''}`; }
    RUNGS.slice().reverse().forEach((r,ri)=>{ const i=RUNGS.length-1-ri; const b=el('button',{type:'button',class:'rung','aria-pressed':'false'},[el('span',{class:'ry'},[document.createTextNode(r[0])]),el('span',{},[document.createTextNode(r[1])])]); b.dataset.i=i; b.addEventListener('click',()=>pick(i)); lad.appendChild(b); });
    root.appendChild(el('div',{class:'ladwrap'},[lad,det])); pick(0);
    root.appendChild(el('p',{html:"Read the ladder from the bottom up and you have the answer to how we programmed before programming: with our hands, then with each tool we had just built. Every computer still starts this way — a tiny built-in routine loads a bigger loader, which loads the operating system."}));
  }});
