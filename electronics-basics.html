      const t=S('text',{x:0,y:y+12,fill:'var(--muted)','font-size':'10'}); t.textContent=n; sv.appendChild(t);
      sv.appendChild(S('rect',{x:70,y,width:w,height:16,rx:3,fill:'#262c35'}));
      sv.appendChild(S('rect',{x:70,y,width:w*k/tot,height:16,rx:3,fill:'var(--copper)'}));
      const r=S('text',{x:70+w+6,y:y+12,fill:'var(--ink)','font-size':'10','font-family':'var(--mono)'}); r.textContent=k+' of ~'+tot; sv.appendChild(r); });
    root.appendChild(el('div',{class:'bench'},[el('div',{class:'strip'},[el('span',{class:'dot'}),el('span',{class:'lbl'},[document.createTextNode('WHAT SURVIVED · PLAYS')])]),el('div',{class:'stage',style:'min-height:auto;padding:14px'},[sv])]));

    root.appendChild(el('h3',{class:'h'},[document.createTextNode('But was ancient electricity lost?')]));
    root.appendChild(el('p',{html:"Here the evidence is unusually clear, so it’s worth being straight about it. Electrical technology leaves things behind that survive well: metal wires, contacts, corrosion, workshops. None have been found. The two famous claims don’t hold up:"}));
    root.appendChild(el('ul',{class:'clean',html:
      "<li><strong>The “Baghdad battery”</strong> — clay jars with a copper tube and iron rod, found in 1936 at Khujut Rabu and dated roughly 3rd century BCE to 3rd century CE. Filled with acid, a copy can give about a volt. But no wires have ever been found with them, there is no way to connect to the sealed core, and archaeologists generally read them as storage or ritual jars.</li>"+
      "<li><strong>The Dendera “lightbulb”</strong> — a carving in an Egyptian temple that, read with its own inscriptions, shows a lotus flower and a snake from Egyptian religious imagery.</li>"}));
    root.appendChild(el('p',{html:"So the honest verdict: the ancient world’s lost genius was in <strong>mechanics, mathematics, astronomy and building</strong> — and that loss is real. Electricity is the one area where the gap really is “not yet”, for the reasons in the previous lesson."}));

    root.appendChild(el('h3',{class:'h'},[document.createTextNode('Who kept the thread — and got left out of the story')]));
    root.appendChild(el('p',{html:"“Omitted by the winners” happens less often through burning than through retelling: many Western histories skip straight from Greece to the Renaissance. The pieces electronics stands on came from all over:"}));
    const kept=el('table',{class:'map'});
    kept.appendChild(el('tr',{},[el('th',{},[document.createTextNode('when')]),el('th',{},[document.createTextNode('who & where')]),el('th',{},[document.createTextNode('why it matters here')])]));
    [['628','Brahmagupta, India','Rules for zero and the place-value numbers every calculation in this app uses'],
     ['800s','House of Wisdom, Baghdad','Greek science translated, kept and extended'],
     ['c. 1011–21','Ibn al-Haytham, Cairo','<em>Book of Optics</em>: test ideas with controlled experiments — the habit behind every lesson here'],
     ['1088','Shen Kuo, China','Describes the magnetic needle compass, including that it doesn’t point exactly north'],
     ['1440s','Printing press, Mainz','Copies stop drifting; knowledge stops dying in single fires']
    ].forEach(r=>kept.appendChild(el('tr',{},[el('td',{class:'m'},[document.createTextNode(r[0])]),el('td',{},[document.createTextNode(r[1])]),el('td',{html:r[2]})])));
    root.appendChild(kept);

    root.appendChild(el('h3',{class:'h'},[document.createTextNode('The “eureka” moments — and what came before them')]));
    root.appendChild(el('p',{html:"Tap each card to see the years behind the flash. Where a story comes only from the inventor’s own later account, it says so."}));
    const eg=el('div',{class:'eugrid'});
    [['1820','Ørsted','A compass needle jumps beside a current-carrying wire, during or just after a lecture (accounts differ on the details).','He already believed, from the philosophy of his day, that nature’s forces were connected, and had been looking for this link for years. He knew what the jump meant the moment he saw it.'],
     ['1831','Faraday','In late August a galvanometer twitches — but only at the instant he connects or disconnects a coil.','Through the 1820s he had tried, and failed, to get electricity out of magnetism. The breakthrough was noticing that a <em>change</em> was what mattered — the idea behind every generator and transformer since.'],
     ['1862','Maxwell','He calculates how fast his predicted electromagnetic waves should travel, and gets almost exactly the speed of light. He wrote that “we can scarcely avoid the inference that light consists in the transverse undulations of the same medium which is the cause of electric and magnetic phenomena.”','Years of turning Faraday’s pictures of “lines of force” into mathematics. The surprise came out of the equations, not a dream.'],
     ['1887','Hertz','He makes radio waves jump across his lab and detects them.','He was testing Maxwell’s theory, not inventing radio. He reportedly doubted the waves had any practical use — Marconi turned them into radio within a decade.'],
     ['1882','Tesla','By his own account, written in 1919, he was walking in a Budapest park reciting Goethe when the rotating magnetic field came to him whole, and he drew it in the sand.','The only witness is Tesla’s memory decades later, so treat the scene as his story. The years of obsession with making a motor work without sparking brushes are well documented.'],
     ['1947','Bardeen & Brattain','In December a gold-foil contact on germanium amplifies a signal: the first transistor.','Months of failed experiments with surface effects first. The breakthrough came from stubborn, daily lab work by a funded team.'],
     ['1958','Kilby','Newly hired at Texas Instruments, with no holiday earned, he works through the summer shutdown in a near-empty lab and sketches a whole circuit on one piece of semiconductor.','Years of frustration at wiring thousands of separate parts together by hand — the “tyranny of numbers” engineers complained about.'],
     ['1993','Nakamura','Bright blue LEDs at Nichia, after the world’s big labs had largely given up.','By his own account he kept working after being told to stop, and built and modified much of his own equipment.']
    ].forEach(([y,who,moment,before])=>{
      const c=el('button',{type:'button',class:'eucard','aria-expanded':'false'},[
        el('span',{class:'euy'},[document.createTextNode(y+' · '+who)]),
        el('span',{class:'eum',html:moment}),
        el('span',{class:'eub',html:'<b>The years before:</b> '+before}) ]);
      c.addEventListener('click',()=>{ const o=c.classList.toggle('flip'); c.setAttribute('aria-expanded',o); });
      eg.appendChild(c); });
    root.appendChild(eg);
    root.appendChild(el('p',{html:"The pattern is plain once they sit side by side. Louis Pasteur put it in 1854: <em>“chance favours only the prepared mind.”</em> The flash is the last piece clicking into a structure the person spent years building. (Doc Brown got his flux capacitor by hitting his head on the sink. Real “Great Scott!” moments need the groundwork.)"}));
  }});

/* ---- 1. The loop & the switch ---- */
STEPS.push({part:P_FOUND, nav:"The circuit loop", title:"Current only flows in a complete loop",
  sub:"A source, a path out, a load, and a path back. Break the loop anywhere and everything stops — that is all a switch does.",
  body(root){
    root.appendChild(el('p',{class:'lead',html:"Charge leaves the battery’s <span class='key'>+</span> terminal, travels through whatever you wired, and must return to the <span class='key'>–</span> terminal. No return path, no current. A circuit is a <strong>closed loop</strong>."}));
    root.appendChild(el('p',{html:"A <strong>switch</strong> is just a controllable gap in that loop. Closed = metal touches, loop complete, current flows. Open = gap, loop broken, nothing flows. Every power button, key, and relay in the world is this one idea."}));
    const svg=S('svg',{viewBox:'0 0 340 200'});
    const loop=S('path',{id:'loopP',d:'M60 150 V60 H150 M190 60 H280 V150 H60',fill:'none',stroke:'var(--line)','stroke-width':3,'stroke-linecap':'round'}); svg.appendChild(loop);
    // battery
    svg.appendChild(S('line',{x1:55,y1:140,x2:55,y2:160,stroke:'var(--copper)','stroke-width':5}));
    svg.appendChild(S('line',{x1:65,y1:145,x2:65,y2:155,stroke:'var(--copper)','stroke-width':3}));
    svg.appendChild(S('text',{x:40,y:158,fill:'var(--muted)','font-size':'10'})).textContent='9V';
    // lamp
    const bulb=S('circle',{id:'bulb',cx:280,cy:105,r:13,fill:'#2a2f37',stroke:'var(--line)'}); svg.appendChild(bulb);
    svg.appendChild(S('text',{x:280,y:140,fill:'var(--muted)','font-size':'10','text-anchor':'middle'})).textContent='lamp';
    // switch gap (150..190 top)
    const swArm=S('line',{id:'swArm',x1:150,y1:60,x2:185,y2:60,stroke:'var(--copper)','stroke-width':3,'stroke-linecap':'round'}); svg.appendChild(swArm);
    svg.appendChild(S('circle',{cx:150,cy:60,r:3,fill:'var(--copper)'}));
    svg.appendChild(S('circle',{cx:190,cy:60,r:3,fill:'var(--copper)'}));
    // moving charge dots along loop
    const dots=[]; for(let i=0;i<10;i++){ const c=S('circle',{r:3.5,fill:'var(--phos)',opacity:0}); dots.push(c); svg.appendChild(c);} 
    const panel=el('div',{},[]);
    const tog=el('div',{class:'tog on',id:'swTog'},[ el('span',{class:'sw'}), el('span',{id:'swTxt'},[document.createTextNode('Switch: CLOSED')]) ]);
    panel.appendChild(tog);
    panel.appendChild(el('div',{style:'height:12px'}));
    panel.appendChild(readout([{k:'Loop',id:'oLoop',u:''},{k:'Lamp',id:'oLamp',u:''}]));
    panel.appendChild(el('div',{class:'note',html:"Try opening the switch — the same break would happen if a wire fell off anywhere in the loop."}));
    root.appendChild(bench('LOOP BENCH', svg, panel));
    // path points for animation (closed loop perimeter)
    const path=[[60,150],[60,60],[150,60],[190,60],[280,60],[280,150],[60,150]];
    function ptAt(f){ // f 0..1 along path
      const segs=path.length-1; let d=f*segs; let i=Math.floor(d); let t=d-i; i=Math.min(i,segs-1);
      const a=path[i], b=path[i+1]; return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
    }
    let closed=true;
    function setState(){
      root.querySelector('#swArm').setAttribute('y2', closed?60:44);
      root.querySelector('#swArm').setAttribute('x2', closed?185:182);
      root.querySelector('#oLoop').textContent=closed?'complete':'broken';
      root.querySelector('#oLoop').className='v '+(closed?'':'warn');
      root.querySelector('#oLamp').textContent=closed?'ON':'off';
      root.querySelector('#oLamp').className='v '+(closed?'':'warn');
      bulb.setAttribute('fill', closed?'var(--copper)':'#2a2f37');
      bulb.setAttribute('filter', closed?'':''); bulb.setAttribute('stroke', closed?'var(--copper)':'var(--line)');
      root.querySelector('#swTxt').textContent='Switch: '+(closed?'CLOSED':'OPEN');
      root.querySelector('#swTog').className='tog '+(closed?'on':'');
    }
    tog.addEventListener('click',()=>{ closed=!closed; setState(); }); setState();
    rAFLoop(t=>{ dots.forEach((d,i)=>{ if(!closed){ d.setAttribute('opacity',0); return; } let f=((i/10)+ t*0.15)%1; const p=ptAt(f); d.setAttribute('cx',p[0]); d.setAttribute('cy',p[1]); d.setAttribute('opacity',.95); }); });
  }});

/* ---- Foundations: conventional vs electron current ---- */
STEPS.push({part:P_FOUND, nav:"Two kinds of current", title:"Two kinds of “current”",
  sub:"Engineers draw current flowing one way; the actual electrons go the other. Both are right — here’s why we keep the contradiction.",
  body(root){
    root.appendChild(el('p',{class:'lead',html:"<span class='key'>Conventional current</span> — the I in every equation — is defined as flowing from <strong>+</strong> to <strong>−</strong>, the way positive charge would move. But in a metal wire the things actually moving are <strong>electrons</strong>, which are negative, so they drift the opposite way: − to +."}));
    root.appendChild(el('p',{html:"<strong>Why we’re stuck with it.</strong> Benjamin Franklin, a century before anyone knew about electrons, guessed the “electric fluid” was positive and flowed + to −. Fifty-fifty odds, and he got it backwards. By the time J. J. Thomson identified the electron in 1897 as a negative particle moving the other way, Franklin’s convention was baked into every textbook and meter. Rather than rewrite everything, the field kept conventional current and added an asterisk."}));
    root.appendChild(el('p',{html:"<strong>Does it matter?</strong> For nearly all circuit work, no — Ohm’s and Kirchhoff’s laws give identical answers either way. The sign only bites when the carrier’s real charge matters: magnetic-force directions, the Hall effect, semiconductor internals. Knowing both keeps a physics text and an engineering text from seeming to contradict each other."}));
    root.appendChild(el('p',{html:"<strong>Verbiage corner.</strong> <strong>I</strong> for current comes from the French <em>intensité du courant</em>. The unit, the <strong>ampere</strong> (A), honors André-Marie Ampère, who built the mathematics of electromagnetism in the 1820s. “I amperes of current” quietly encodes two Frenchmen."}));
    const svg=S('svg',{viewBox:'0 0 340 180'});
    svg.appendChild(S('path',{d:'M50 140 V50 H290 V140 Z',fill:'none',stroke:'var(--line)','stroke-width':3}));
    svg.appendChild(S('line',{x1:45,y1:128,x2:45,y2:152,stroke:'var(--copper)','stroke-width':5}));
    svg.appendChild(S('line',{x1:55,y1:133,x2:55,y2:147,stroke:'var(--copper)','stroke-width':3}));
    const bulb=S('circle',{cx:170,cy:50,r:13,fill:'var(--copper)',stroke:'var(--copper)'}); const halo=S('circle',{cx:170,cy:50,r:24,fill:'var(--copper)',opacity:.18});
    svg.appendChild(halo); svg.appendChild(bulb);
    const dots=[]; for(let i=0;i<12;i++){const c=S('circle',{r:4,fill:'var(--blue)'}); dots.push(c); svg.appendChild(c);}
    const panel=el('div',{},[]);
    const tog=el('div',{class:'tog',id:'ccTog'},[el('span',{class:'sw'}),el('span',{id:'ccTxt'},[document.createTextNode('Showing: electron flow')])]);
    panel.appendChild(tog); panel.appendChild(el('div',{style:'height:12px'}));
    panel.appendChild(readout([{k:'Carriers',id:'ccCar',u:''},{k:'Direction',id:'ccDir',u:''}]));
    root.appendChild(bench('CHARGE-FLOW BENCH', svg, panel));
    const path=[[50,140],[50,50],[170,50],[290,50],[290,140],[50,140]];
    function ptAt(f){ f=((f%1)+1)%1; const segs=path.length-1; let d=f*segs,i=Math.floor(d),t=d-i; i=Math.min(i,segs-1); const a=path[i],b=path[i+1]; return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]; }
    let conventional=false;
    function setLbl(){ root.querySelector('#ccTxt').textContent='Showing: '+(conventional?'conventional current':'electron flow');
      root.querySelector('#ccTog').className='tog '+(conventional?'on':'');
      root.querySelector('#ccCar').textContent=conventional?'positive (model)':'electrons (real)';
      root.querySelector('#ccDir').textContent=conventional?'+ → −':'− → +';
      dots.forEach(d=>d.setAttribute('fill',conventional?'var(--copper)':'var(--blue)')); }
    tog.addEventListener('click',()=>{conventional=!conventional; setLbl();}); setLbl();
    rAFLoop(t=>{ dots.forEach((d,i)=>{ const dir=conventional?1:-1; const p=ptAt((i/12)+dir*t*0.12); d.setAttribute('cx',p[0]); d.setAttribute('cy',p[1]); }); });
    if(REDUCE){ dots.forEach((d,i)=>{const p=ptAt(i/12); d.setAttribute('cx',p[0]); d.setAttribute('cy',p[1]);}); }
  }});

/* ---- Foundations: speed of electricity ---- */
STEPS.push({part:P_FOUND, nav:"How fast is electricity?", title:"How fast is electricity, really?",
  sub:"Flip a switch and the bulb lights instantly — yet the electrons themselves crawl. Two very different speeds hide in one wire.",
  body(root){
    root.appendChild(el('p',{class:'lead',html:"Close a switch and the lamp lights essentially <strong>immediately</strong>. It’s tempting to picture electrons sprinting from battery to bulb. They don’t — a single electron <span class='key'>drifts at well under a millimeter per second</span>, slower than a snail."}));
    root.appendChild(el('p',{html:"<strong>The resolution.</strong> A wire is already packed full of free electrons everywhere — like a hose already full of water. Open the tap and water leaves the far end at once, even though any one molecule barely moved: the <em>push</em> travels through the full pipe almost instantly. In a wire that push is the <span class='key'>electromagnetic field</span>, which races along the wire at a large fraction of light speed and carries the energy through the space <em>around</em> the wire — not by electrons shuttling end to end."}));
    root.appendChild(el('p',{html:"<strong>Two timescales, same circuit.</strong> The signal/energy front moves at roughly half to nearly all of light speed — nanoseconds to cross a room. A given electron drifting that same distance would take minutes to hours. Close the switch below and watch the fast front light the bulb while the electrons barely budge."}));
    const svg=S('svg',{viewBox:'0 0 360 150'});
    svg.appendChild(S('line',{x1:40,y1:75,x2:300,y2:75,stroke:'var(--line)','stroke-width':3}));
    svg.appendChild(S('circle',{cx:40,cy:75,r:3,fill:'var(--copper)'}));
    const swArm=S('line',{id:'hfSw',x1:40,y1:75,x2:62,y2:60,stroke:'var(--copper)','stroke-width':3,'stroke-linecap':'round'}); svg.appendChild(swArm);
    svg.appendChild(S('circle',{cx:64,cy:75,r:3,fill:'var(--copper)'}));
    const halo=S('circle',{id:'hfHalo',cx:315,cy:75,r:0,fill:'var(--copper)',opacity:.3}); const bulb=S('circle',{id:'hfBulb',cx:315,cy:75,r:15,fill:'#2a2f37',stroke:'var(--line)'});
    svg.appendChild(halo); svg.appendChild(bulb);
    const front=S('line',{id:'hfFront',x1:64,y1:55,x2:64,y2:95,stroke:'var(--phos)','stroke-width':3,opacity:0}); svg.appendChild(front);
    const dots=[]; for(let i=0;i<14;i++){const c=S('circle',{cx:70+i*16,cy:75,r:3,fill:'var(--blue)',opacity:.5}); dots.push(c); svg.appendChild(c);}
    const panel=el('div',{},[]);
    const tog=el('div',{class:'tog',id:'hfTog'},[el('span',{class:'sw'}),el('span',{id:'hfTxt'},[document.createTextNode('Switch: OPEN')])]);
    panel.appendChild(tog);
    const cL=el('div',{class:'ctrl',style:'margin-top:14px'},[el('label',{},[document.createTextNode('Wire length'),Object.assign(document.createElement('b'),{id:'hfLv'})])]);
    const rngL=el('input',{type:'range',min:'1',max:'100',step:'1',value:'10'}); cL.appendChild(rngL);
    panel.appendChild(cL);
    panel.appendChild(readout([{k:'Signal front arrives in',id:'hfSig',u:'',cls:'amber'},{k:'One electron crosses in',id:'hfEl',u:'',cls:'cool'}]));
    root.appendChild(bench('SPEED BENCH', svg, panel));
    function human(s){ if(s<1e-6)return (s*1e9).toFixed(0)+' ns'; if(s<1e-3)return (s*1e6).toFixed(1)+' µs'; if(s<1)return (s*1e3).toFixed(1)+' ms'; if(s<60)return s.toFixed(1)+' s'; if(s<3600)return (s/60).toFixed(1)+' min'; if(s<86400)return (s/3600).toFixed(1)+' hr'; return (s/86400).toFixed(1)+' days'; }
    function calc(){ const L=parseFloat(rngL.value), vSig=2.1e8, vEl=1e-4;
      root.querySelector('#hfLv').textContent=L+' m';
      root.querySelector('#hfSig').textContent=human(L/vSig);
      root.querySelector('#hfEl').textContent=human(L/vEl); }
    rngL.addEventListener('input',calc); calc();
    let closed=false, last=0, frontX=64, lit=0;
    function setSw(){ root.querySelector('#hfTxt').textContent='Switch: '+(closed?'CLOSED':'OPEN'); root.querySelector('#hfTog').className='tog '+(closed?'on':''); swArm.setAttribute('y2',closed?75:60);
      if(!closed){ frontX=64; lit=0; front.setAttribute('opacity',0); bulb.setAttribute('fill','#2a2f37'); halo.setAttribute('r',0); }
      if(closed&&REDUCE){ frontX=300; lit=1; bulb.setAttribute('fill','var(--copper)'); halo.setAttribute('r',22); front.setAttribute('opacity',0); } }
    tog.addEventListener('click',()=>{ closed=!closed; setSw(); }); setSw();
    rAFLoop(t=>{ const dt=Math.min(.05,t-last); last=t; if(closed){
        if(frontX<300){ frontX=Math.min(300, frontX+dt*520); front.setAttribute('opacity',.9); front.setAttribute('x1',frontX); front.setAttribute('x2',frontX); }
        else { front.setAttribute('opacity',0); lit=Math.min(1,lit+dt*3); bulb.setAttribute('fill','var(--copper)'); halo.setAttribute('r',lit*22); }
        dots.forEach((d,i)=>{ let x=70+i*16+((t*4)%16); d.setAttribute('cx',x>300?x-240:x); }); } });
  }});

/* ---- 2. The breadboard ---- */
STEPS.push({part:P_FOUND, nav:"The breadboard", title:"How the breadboard secretly connects things",
  sub:"Holes that look separate are wired together underneath. Knowing which holes share a connection is 90% of not-frying your circuit.",
  body(root){
    root.appendChild(el('p',{class:'lead',html:"A breadboard is a grid of holes with hidden metal strips beneath. Push two component legs into holes on the <span class='key'>same hidden strip</span> and they are electrically joined — no solder needed."}));
    root.appendChild(el('p',{html:"On this kit, holes in the <strong>same row and same block of five</strong> are one connection point (one <span class='term'>node</span>). The long rails at top and bottom carry <strong>power</strong> and <strong>ground</strong> the whole way across. Tap any hole below to light up every hole electrically tied to it."}));
    const svg=S('svg',{viewBox:'0 0 360 210'});
    const cols=10, rows=5, x0=30, y0=50, dx=30, dy=26;
    const holes=[];
    // rails
    svg.appendChild(S('rect',{x:20,y:18,width:330,height:14,rx:4,fill:'#241d14',stroke:'var(--copper-d)'}));
    svg.appendChild(S('text',{x:14,y:29,fill:'var(--copper)','font-size':'9','text-anchor':'end'})).textContent='+';
    svg.appendChild(S('rect',{x:20,y:182,width:330,height:14,rx:4,fill:'#11201a',stroke:'var(--phos-d)'}));
    svg.appendChild(S('text',{x:14,y:193,fill:'var(--phos)','font-size':'9','text-anchor':'end'})).textContent='–';
    for(let c=0;c<cols;c++){ // rail holes
      const hx=x0+c*dx;
      holes.push(mk(hx,25,'P','rail+')); holes.push(mk(hx,189,'N','rail-'));
    }
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const blk=Math.floor(c/5);
      holes.push(mk(x0+c*dx, y0+r*dy, 'r'+r+'b'+blk, 'bb'));
    }
    function mk(x,y,node,kind){ const c=S('circle',{cx:x,cy:y,r:5,fill:'#2a2f37',stroke:'var(--line)'}); c.dataset.node=node; c.dataset.kind=kind; svg.appendChild(c); return c; }
    // block divider line
    svg.appendChild(S('line',{x1:x0+5*dx-dx/2,y1:42,x2:x0+5*dx-dx/2,y2:y0+rows*dy,stroke:'var(--line)','stroke-dasharray':'3 4'}));
    const panel=el('div',{},[]);
    panel.appendChild(readout([{k:'Tapped node',id:'oNode',u:''},{k:'Holes joined',id:'oJoin',u:''}]));
    panel.appendChild(el('div',{class:'note',html:"Same color glow = same wire underneath. Notice the gap splits each row into two separate nodes."}));
    root.appendChild(bench('BREADBOARD BENCH', svg, panel));
    let sel=null;
    function paint(){
      holes.forEach(h=>{ const on=sel && h.dataset.node===sel; h.setAttribute('fill', on? 'var(--copper)':'#2a2f37'); h.setAttribute('stroke', on?'var(--copper)':'var(--line)'); });
      const n = sel? holes.filter(h=>h.dataset.node===sel).length : 0;
      root.querySelector('#oNode').textContent= sel? prettyNode(sel) : '—';

    function prettyNode(s){ if(s==='P')return '+ rail'; if(s==='N')return '– rail'; return s.replace('r','row ').replace('b',' / block '); }
    holes.forEach(h=>h.addEventListener('click',()=>{ sel=h.dataset.node; paint(); }));
    paint();
  }});

STEPS.push(recallStep(P_FOUND,'found',"Check: Foundations","Check yourself — Foundations",
  "Six questions on the notation and the basic ideas. No sliders; just what you can pull from memory.",[
  {q:"A 12 V source pushes current through 300 Ω. What current flows?",
   o:["0.04 mA","40 mA","4 A","3,600 A"],a:1,
   why:"I = V ÷ R = 12 ÷ 300 = 0.04 A. <em>Milli</em> means a thousandth, so 0.04 A × 1000 = 40 mA — the same current, written in a friendlier unit.",see:"What electricity is"},
  {q:"In <span style='font-family:var(--mono)'>I = 0.04 A</span>, what are the “I” and the “A”?",
   o:["Both mean amps","I is the quantity (current); A is the unit (amperes)","I is the unit; A is the quantity","I means intensity, which is different from current"],a:1,
   why:"Letters in a formula are quantities; letters after a number are units. I names <em>what</em> is measured (current), A names the yardstick (amperes) — like d = 5 m for distance and meters.",see:"First: the language"},
  {q:"A resistor is labeled <strong>4.7 kΩ</strong>. How many ohms is that?",
   o:["4.7","47","470","4,700"],a:3,
   why:"k (kilo) means × 1000, so 4.7 × 1000 = 4,700 Ω. Ω is the Greek letter omega, the symbol for ohms.",see:"First: the language"},
  {q:"Close a switch and a lamp across the room lights almost instantly, yet each electron drifts slower than a millimeter per second. Why?",
   o:["Electrons speed up when the switch closes","The wire is already full of electrons, and the push (the electromagnetic field) travels through it at near light speed","The lamp has its own stored electrons","Light from the switch travels to the lamp"],a:1,
   why:"Like a hose already full of water: open the tap and water leaves the far end at once. The field carries the push and the energy fast; individual electrons barely move.",see:"How fast is electricity?"},
  {q:"Which way does <em>conventional current</em> flow, and which way do the electrons actually move?",
   o:["Both + to −","Both − to +","Conventional + to −; electrons − to +","Conventional − to +; electrons + to −"],a:2,
   why:"Franklin guessed + to − before electrons were known. Electrons are negative, so in a metal wire they drift the other way. The math comes out the same either way.",see:"Two kinds of current"},
  {q:"On this kit’s breadboard, two holes sit in the same row but in different blocks of five. Are they connected?",
   o:["Yes — the whole row is one strip","No — each block of five in a row is its own node","Only when power is on","Only the rails are ever connected"],a:1,
   why:"Holes in the same row <em>and</em> the same block of five share one hidden strip (one node). The gap between blocks splits a row into separate nodes.",see:"The breadboard"},
  {q:"Why did Alessandro Volta build the first battery in 1800?",
   o:["To power the first electric light","To prove the electricity in Galvani’s twitching frog legs came from the two metals, not the animal","Because a telegraph company paid him to","He stumbled on it while cleaning metal plates"],a:1,
   why:"Galvani’s accidental observation started an argument. Volta designed the pile on purpose to settle it — and in doing so made the first steady current, which every later lesson depends on.",see:"What electricity is"},
  {q:"People noticed electric fish and rubbed amber thousands of years ago. What mainly kept the battery from appearing until 1800?",
   o:["Ancient people weren’t clever enough","The supporting pieces weren’t there yet: no detector, zinc was very hard to make, and no one had a reason to look","Religious bans on electricity","The idea was invented once and deliberately hidden"],a:1,
   why:"An invention can’t come before its last prerequisite. For the battery the late pieces were a way to detect charge, zinc in quantity (it boils away during smelting), scientific journals, and Galvani’s puzzle to explain.",see:"Why it took so long"},
  {q:"What is the strongest evidence against the “Baghdad battery” being an ancient electrical device?",
   o:["It was found in the wrong country","No wires or connections have ever been found with it, and its core is sealed with no way to connect to it","It can’t produce any voltage at all","It was proven to be a modern fake"],a:1,
   why:"Copies filled with acid can give about a volt, so the chemistry isn’t the issue. What’s missing is everything that would show it was used: wires, contacts, anything to power. Archaeologists generally read the jars as storage or ritual objects.",see:"Lost, kept & eureka"}
]));

function flowLine(layer,flowEls,pts,mA,col){ // a wire with moving streaks; speed and brightness follow the current
  const p=pts.map(q=>q.join(',')).join(' ');
  layer.appendChild(S('polyline',{points:p,fill:'none',stroke:'#3a4350','stroke-width':6,'stroke-linejoin':'round','stroke-linecap':'round'}));
  layer.appendChild(S('polyline',{points:p,fill:'none',stroke:col||'var(--copper)','stroke-width':3,'stroke-opacity':mA>0.05?0.9:0.25,'stroke-linejoin':'round','stroke-linecap':'round'}));
  if(mA>0.05){ const f=S('polyline',{points:p,fill:'none',stroke:'#fff','stroke-width':2,'stroke-opacity':Math.min(.95,.35+mA/40),'stroke-dasharray':'3 9','stroke-linecap':'round'}); f.__v=Math.min(110,10+mA*2.4); f.__o=0; layer.appendChild(f); flowEls.push(f); }
}
function resGlyph(layer,x,y,horiz,label,watts){ // resistor body that glows with the power it turns into heat
  const w=horiz?46:18, h=horiz?18:46, glow=Math.min(1,watts/0.12);
  if(glow>0.02) layer.appendChild(S('rect',{x:x-w/2-6,y:y-h/2-6,width:w+12,height:h+12,rx:10,fill:'var(--red)',opacity:glow*.35}));
  layer.appendChild(S('rect',{x:x-w/2,y:y-h/2,width:w,height:h,rx:4,fill:'#caa46b',stroke:'#8a6a36'}));
  const t=S('text',{x:horiz?x:x+16,y:horiz?y-15:y+4,fill:'var(--ink)','font-size':'9.5','text-anchor':horiz?'middle':'start','font-family':'var(--mono)'}); t.textContent=label; layer.appendChild(t);
}
STEPS.push({part:P_COMP, nav:"Series & parallel", title:"Series and parallel: one path or many",
  sub:"There are only two ways to connect two parts: one after the other, or side by side. Almost every circuit is built from these two patterns, and each has its own simple rules.",
  body(root){
    root.appendChild(el('p',{class:'lead',html:"In <span class='key'>series</span>, parts sit one after the other on a single path, so every bit of current has to go through all of them. In <span class='key'>parallel</span>, parts sit side by side between the same two points, so the current splits and each part gets the full voltage."}));
    root.appendChild(el('p',{html:"Flip between the two, change the resistors, and watch the streaks: their speed is the current. Then pull one resistor out and see what each arrangement does."}));
    const svg=S('svg',{viewBox:'0 0 340 210',role:'img','aria-label':'A battery driving two resistors, in series or in parallel'}); const layer=S('g',{}); svg.appendChild(layer);
    const panel=el('div',{});
    const seg=el('div',{class:'seg'}); [['s','Series'],['p','Parallel']].forEach(([k,t],i)=>{ const b=el('button',{type:'button',class:i===0?'on':''},[document.createTextNode(t)]); b.dataset.k=k; seg.appendChild(b); }); panel.appendChild(seg);
    const mk=(lab,id,val)=>{ const c=el('div',{class:'ctrl'},[el('label',{},[document.createTextNode(lab),Object.assign(document.createElement('b'),{id})])]); const r=el('input',{type:'range',min:'100',max:'1000',step:'10',value:String(val),'aria-label':lab}); c.appendChild(r); panel.appendChild(c); return r; };
    const r1=mk('R1','spR1',300), r2=mk('R2','spR2',600);
    const pull=el('div',{class:'tog',tabindex:'0',role:'switch','aria-checked':'false'},[el('span',{class:'sw'}),el('span',{},[document.createTextNode('Pull R2 out')])]); panel.appendChild(el('div',{style:'margin:0 0 12px'},[pull]));
    panel.appendChild(readout([{k:'Total resistance',id:'spRt',u:'Ω',cls:'amber'},{k:'Battery current',id:'spIt',u:'mA'},{k:'R1: current · voltage',id:'sp1',u:''},{k:'R2: current · voltage',id:'sp2',u:''}]));
    root.appendChild(bench('SERIES / PARALLEL BENCH', svg, panel));
    const rules=el('div',{class:'fgsay',role:'status'}); root.appendChild(rules);
    const V=9; let mode='s', out=false, flowEls=[];
    function draw(){
      const R1=+r1.value, R2=+r2.value; layer.innerHTML=''; flowEls=[];
      let Rt,It,I1,I2,V1,V2;
      if(mode==='s'){ Rt=out?Infinity:R1+R2; It=out?0:V/Rt; I1=I2=It; V1=It*R1; V2=out?0:It*R2; }
      else { Rt=out?R1:R1*R2/(R1+R2); I1=V/R1; I2=out?0:V/R2; It=I1+I2; V1=V; V2=out?0:V; }
      const m=x=>x*1000;
      // battery
      layer.appendChild(S('line',{x1:28,y1:96,x2:52,y2:96,stroke:'var(--copper)','stroke-width':5})); layer.appendChild(S('line',{x1:33,y1:106,x2:47,y2:106,stroke:'var(--copper)','stroke-width':3}));
      const bt=S('text',{x:8,y:104,fill:'var(--muted)','font-size':'9'}); bt.textContent='9 V'; layer.appendChild(bt);
      if(mode==='s'){
        flowLine(layer,flowEls,[[40,96],[40,40],[95,40]],m(It)); flowLine(layer,flowEls,[[145,40],[195,40]],m(It)); flowLine(layer,flowEls,[[245,40],[300,40],[300,180],[40,180],[40,106]],m(It));
        resGlyph(layer,120,40,true,'R1 '+R1+'Ω',I1*I1*R1); if(!out) resGlyph(layer,220,40,true,'R2 '+R2+'Ω',I2*I2*R2); else { const g=S('text',{x:220,y:46,fill:'var(--red)','font-size':'15','text-anchor':'middle','font-weight':'700'}); g.textContent='✕ gap'; layer.appendChild(g); }
      } else {
        flowLine(layer,flowEls,[[40,96],[40,40],[110,40]],m(It)); flowLine(layer,flowEls,[[110,40],[145,40]],m(I1)); flowLine(layer,flowEls,[[195,40],[230,40]],m(I1));
        flowLine(layer,flowEls,[[110,40],[110,120],[145,120]],m(I2)); flowLine(layer,flowEls,[[195,120],[230,120],[230,40]],m(I2));
        flowLine(layer,flowEls,[[230,40],[300,40],[300,180],[40,180],[40,106]],m(It));
        resGlyph(layer,170,40,true,'R1 '+R1+'Ω',I1*I1*R1); if(!out) resGlyph(layer,170,120,true,'R2 '+R2+'Ω',I2*I2*R2); else { const g=S('text',{x:170,y:126,fill:'var(--red)','font-size':'15','text-anchor':'middle','font-weight':'700'}); g.textContent='✕ gap'; layer.appendChild(g); }
        [[110,40],[230,40]].forEach(([x,y])=>layer.appendChild(S('circle',{cx:x,cy:y,r:4,fill:'var(--ink)'})));
      }
      const lab=S('text',{x:170,y:200,fill:'var(--faint)','font-size':'8.5','text-anchor':'middle'}); lab.textContent='streak speed = current · red glow = heat in the resistor'; layer.appendChild(lab);
      root.querySelector('#spR1').textContent=R1+' Ω'; root.querySelector('#spR2').textContent=R2+' Ω';
      root.querySelector('#spRt').textContent=isFinite(Rt)?Rt.toFixed(0):'∞ (open)';
      root.querySelector('#spIt').textContent=m(It).toFixed(1);
      root.querySelector('#sp1').textContent=m(I1).toFixed(1)+' mA · '+V1.toFixed(2)+' V';
      root.querySelector('#sp2').textContent=out?'removed':m(I2).toFixed(1)+' mA · '+V2.toFixed(2)+' V';
      pull.className='tog'+(out?' on':''); pull.setAttribute('aria-checked',out);
      rules.innerHTML = mode==='s'
        ? (out ? "<strong>Series, one part removed:</strong> the only path is broken, so <em>everything</em> stops — R1 included, even though nothing happened to it. That is why old strings of Christmas lights, wired in series, all went dark when one bulb failed."
               : `<strong>Series rules.</strong> One path, so the <b>same current</b> (${m(It).toFixed(1)} mA) flows through both. <b>Resistances add</b>: ${R1} + ${R2} = ${R1+R2} Ω. <b>Voltages add</b> to the battery: ${V1.toFixed(2)} + ${V2.toFixed(2)} = 9.00 V — the bigger resistor takes the bigger share. Your kit’s six AA cells are in series too: their voltages add to 9 V.`)
        : (out ? `<strong>Parallel, one part removed:</strong> R1 carries on exactly as before (${m(I1).toFixed(1)} mA) because it still has its own complete path to the battery. Only the total drops. That is why every outlet and light in a house is wired in parallel: one burned-out bulb doesn’t black out the room.`
               : `<strong>Parallel rules.</strong> Both sit across the battery, so each gets the <b>same voltage</b> (9 V). <b>Currents add</b>: ${m(I1).toFixed(1)} + ${m(I2).toFixed(1)} = ${m(It).toFixed(1)} mA. More paths means <b>less total resistance</b>: ${R1} × ${R2} ÷ (${R1} + ${R2}) = ${Rt.toFixed(0)} Ω — always less than the smallest one.`);
    }
    seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ mode=b.dataset.k; seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); draw(); }));
    [r1,r2].forEach(r=>r.addEventListener('input',draw));

    [['Current','Same through every part','Splits; branch currents add up'],['Voltage','Splits; the parts’ voltages add up to the supply','Same across every part'],['Total resistance','R1 + R2 (grows)','R1 × R2 ÷ (R1 + R2) (shrinks)'],['One part fails open','Everything stops','The others keep working'],['You see it in','Battery packs, a resistor limiting an LED','House wiring, car headlights, power strips']]
      .forEach(r=>tbl.appendChild(el('tr',{},[el('td',{class:'m'},[document.createTextNode(r[0])]),el('td',{},[document.createTextNode(r[1])]),el('td',{},[document.createTextNode(r[2])])])));
    root.appendChild(tbl);
  }});

/* ---- Components: Kirchhoff's laws ---- */
STEPS.push({part:P_COMP, nav:"Kirchhoff’s laws", title:"Kirchhoff’s two laws: nothing lost at a junction, nothing gained around a loop",
  sub:"Ohm’s law handles one part. These two rules handle any circuit, however tangled — and they are what every circuit simulator, including the trainer’s, actually solves.",
  body(root){
    root.appendChild(el('p',{class:'lead',html:"<span class='key'>The current law</span>: at any junction, the current flowing in equals the current flowing out. Charge can’t pile up or vanish — like water at a pipe fitting. <span class='key'>The voltage law</span>: walk all the way around any closed loop, adding every rise and every drop, and you get exactly zero — like a hike that ends where it began has no net change in height."}));
    root.appendChild(el('p',{html:"Here R1 feeds a junction that splits into R2 and R3. Tap the junction to check the current law; walk either loop to check the voltage law. Change the resistors and both laws keep holding."}));
    const svg=S('svg',{viewBox:'0 0 340 210',role:'img','aria-label':'R1 in series with R2 and R3 in parallel'}); const layer=S('g',{}); svg.appendChild(layer);
    const panel=el('div',{});
    const mk=(lab,id,val)=>{ const c=el('div',{class:'ctrl'},[el('label',{},[document.createTextNode(lab),Object.assign(document.createElement('b'),{id})])]); const r=el('input',{type:'range',min:'100',max:'1000',step:'10',value:String(val),'aria-label':lab}); c.appendChild(r); panel.appendChild(c); return r; };
    const r1=mk('R1','kR1',200), r2=mk('R2','kR2',300), r3=mk('R3','kR3',600);
    const seg=el('div',{class:'seg'}); [['j','Check the junction'],['a','Walk loop A (via R2)'],['b','Walk loop B (via R3)']].forEach(([k,t],i)=>{ const b=el('button',{type:'button',class:i===0?'on':''},[document.createTextNode(t)]); b.dataset.k=k; seg.appendChild(b); }); panel.appendChild(seg);
    root.appendChild(bench('KIRCHHOFF BENCH', svg, panel));
    const work=el('div',{class:'kwork',role:'status'}); root.appendChild(work);
    const V=9; let view='j', flowEls=[], walkT=0;
    const LOOPS={a:[[40,170],[40,40],[90,40],[150,40],[190,40],[190,80],[190,130],[190,170],[40,170]], b:[[40,170],[40,40],[90,40],[150,40],[190,40],[280,40],[280,80],[280,130],[280,170],[190,170],[40,170]]};
    let dot=null;
    function solve(){ const R1=+r1.value,R2=+r2.value,R3=+r3.value, Rp=R2*R3/(R2+R3), I=V/(R1+Rp), V1=I*R1, Vx=V-V1, I2=Vx/R2, I3=Vx/R3; return {R1,R2,R3,Rp,I,V1,Vx,I2,I3}; }
    function draw(){
      const s=solve(), m=x=>(x*1000); layer.innerHTML=''; flowEls=[];
      layer.appendChild(S('line',{x1:28,y1:96,x2:52,y2:96,stroke:'var(--copper)','stroke-width':5})); layer.appendChild(S('line',{x1:33,y1:106,x2:47,y2:106,stroke:'var(--copper)','stroke-width':3}));
      const bt=S('text',{x:8,y:104,fill:'var(--muted)','font-size':'9'}); bt.textContent='9 V'; layer.appendChild(bt);
      flowLine(layer,flowEls,[[40,96],[40,40],[95,40]],m(s.I)); flowLine(layer,flowEls,[[145,40],[190,40]],m(s.I));
      flowLine(layer,flowEls,[[190,40],[190,80]],m(s.I2)); flowLine(layer,flowEls,[[190,130],[190,170]],m(s.I2));
      flowLine(layer,flowEls,[[190,40],[280,40],[280,80]],m(s.I3)); flowLine(layer,flowEls,[[280,130],[280,170],[190,170]],m(s.I3));
      flowLine(layer,flowEls,[[190,170],[40,170],[40,106]],m(s.I));
      resGlyph(layer,120,40,true,'R1',s.I*s.I*s.R1); resGlyph(layer,190,105,false,'R2',s.I2*s.I2*s.R2); resGlyph(layer,280,105,false,'R3',s.I3*s.I3*s.R3);
      const jx=S('circle',{cx:190,cy:40,r:view==='j'?8:5,fill:view==='j'?'var(--copper)':'var(--ink)',stroke:'#fff','stroke-width':view==='j'?2:0,style:'cursor:pointer'}); jx.addEventListener('click',()=>setView('j')); layer.appendChild(jx);
      const jt=S('text',{x:198,y:30,fill:'var(--copper)','font-size':'9'}); jt.textContent='junction'; layer.appendChild(jt);
      if(view!=='j'){ layer.appendChild(S('polyline',{points:LOOPS[view].map(q=>q.join(',')).join(' '),fill:'none',stroke:'var(--violet)','stroke-width':2,'stroke-dasharray':'6 5',opacity:.9})); dot=S('circle',{r:6,fill:'var(--violet)',stroke:'#fff','stroke-width':1.5}); layer.appendChild(dot); }
      ['kR1','kR2','kR3'].forEach((id,i)=>root.querySelector('#'+id).textContent=[s.R1,s.R2,s.R3][i]+' Ω');
      const f=(x,d=2)=>x.toFixed(d);
      if(view==='j') work.innerHTML=`<div class="kh">Current law at the junction</div>
        <table class="ktab"><tr><td>In, from R1</td><td class="num">${f(m(s.I),1)} mA</td></tr><tr><td>Out, down R2</td><td class="num">${f(m(s.I2),1)} mA</td></tr><tr><td>Out, down R3</td><td class="num">${f(m(s.I3),1)} mA</td></tr>
        <tr class="sum"><td>In − out</td><td class="num">${f(m(s.I)-m(s.I2)-m(s.I3),3)} mA</td></tr></table>
        <p>Nothing piles up. The current splits in inverse proportion to resistance: R2 is ${(s.R3/s.R2).toFixed(2)}× ${s.R2<s.R3?'smaller':'bigger'} than R3, so it carries ${(s.I2/s.I3).toFixed(2)}× the current.</p>`;
      else { const viaR=view==='a'?['R2',s.I2,s.R2]:['R3',s.I3,s.R3]; const steps=[['Start at the battery’s − terminal',0],['Up through the battery',+V],['Down through R1 (current × R1)',-s.V1],[`Down through ${viaR[0]} (current × ${viaR[0]})`,-viaR[1]*viaR[2]]];
        let run=0; work.innerHTML=`<div class="kh">Voltage law around loop ${view.toUpperCase()}</div><table class="ktab">`+steps.map(([t,dv],i)=>{ run+=dv; return `<tr class="kst" data-i="${i}"><td>${t}</td><td class="num">${i?(dv>=0?'+':'')+f(dv)+' V':''}</td><td class="num run">${f(run)} V</td></tr>`; }).join('')+
        `<tr class="sum"><td>Back where you started</td><td></td><td class="num">${f(Math.abs(run)<1e-9?0:run)} V</td></tr></table><p>The battery lifts the charge 9 V; the resistors on the way round use up exactly 9 V. R2 and R3 sit across the same two points, so both loops see the same ${f(s.Vx)} V drop across them — which is the parallel rule, proved.</p>`; walkT=0; }
    }
    function setView(k){ view=k; seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.k===k)); draw(); }
    seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.k)));
    [r1,r2,r3].forEach(r=>r.addEventListener('input',draw));
    draw();
    const along=(path,f)=>{ let L=0; const seg=[]; for(let i=1;i<path.length;i++){ const d=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]); seg.push(d); L+=d; } let t=f*L; for(let i=0;i<seg.length;i++){ if(t<=seg[i]){ const g=t/seg[i]; return [path[i][0]+(path[i+1][0]-path[i][0])*g,path[i][1]+(path[i+1][1]-path[i][1])*g]; } t-=seg[i]; } return path[path.length-1]; };
    let last=0; rAFLoop(t=>{ const dt=Math.min(.05,t-last); last=t; flowEls.forEach(f=>{ f.__o-=f.__v*dt; f.setAttribute('stroke-dashoffset',f.__o.toFixed(1)); });
      if(view!=='j'&&dot){ walkT=(walkT+dt/5)%1; const p=along(LOOPS[view],walkT); dot.setAttribute('cx',p[0]); dot.setAttribute('cy',p[1]); } });
    root.appendChild(el('p',{html:"Why this matters beyond homework: write the current law at every junction of a circuit and you get one equation per junction. Solve them together and you know every voltage and current in the circuit. That method — <em>nodal analysis</em> — is exactly what the trainer’s solver does every time you change something, and it is the core of the SPICE circuit simulator (1973) that chip designers still build on."}));
  }});

/* ---- Components: when Ohm's law applies (I-V curves) ---- */
STEPS.push({part:P_COMP, nav:"When Ohm’s law applies", title:"When Ohm’s law applies — and when it doesn’t",
  sub:"Ohm’s law is a straight line. Most of the interesting parts in this kit are bent on purpose.",
  body(root){
    root.appendChild(el('p',{class:'lead',html:"Plot current against voltage for a part. A plain <span class='key'>resistor</span> gives a straight line through the origin — double the voltage, double the current — with slope 1 ÷ R. That line <em>is</em> Ohm’s law, and the part is called <strong>ohmic</strong>."}));
    root.appendChild(el('p',{html:"Here’s the twist you flagged: V = I × R isn’t a law of nature, it’s a property some materials happen to have over some range. Many of the most useful parts are <strong>non-ohmic</strong> — their curve bends, so their effective resistance changes with conditions:"}));
    root.appendChild(el('ul',{class:'clean',html:
      "<li>A <strong>filament lamp</strong> heats up as current rises, its resistance climbs, and the curve flattens.</li>"+
      "<li>A <strong>diode / LED</strong> blocks almost entirely below its turn-on voltage, then conducts hard above it — a hockey stick, not a line. (You meet these next.)</li>"+
      "<li>A <strong>transistor</strong>’s whole job is letting a third terminal reshape this curve.</li>"}));
    root.appendChild(el('p',{html:"So memorize V = I × R and lean on it constantly — it rules every resistor and every wire — but hold it as a <em>special case</em>. The moment a part’s curve bends, “resistance” becomes “it depends,” and that bend is exactly what makes diodes, sensors, and amplifiers possible. That’s the amusing part: the first law you learn is one the cleverest parts break on purpose."}));
    const svg=S('svg',{viewBox:'0 0 340 200'});
    const X0=50,X1=320,Yz=150,Ytop=24,Ybot=178, Vmin=-2,Vmax=6,Imax=110;
    const vx=V=>X0+(V-Vmin)/(Vmax-Vmin)*(X1-X0), iy=I=>Yz-(I/Imax)*(Yz-Ytop);
    svg.appendChild(S('line',{x1:vx(0),y1:Ytop,x2:vx(0),y2:Ybot,stroke:'var(--line)','stroke-width':1.5}));
    svg.appendChild(S('line',{x1:X0,y1:Yz,x2:X1,y2:Yz,stroke:'var(--line)','stroke-width':1.5}));
    svg.appendChild(S('text',{x:vx(0)+4,y:Ytop+8,fill:'var(--faint)','font-size':'9'})).textContent='I';
    svg.appendChild(S('text',{x:X1,y:Yz-4,fill:'var(--faint)','font-size':'9','text-anchor':'end'})).textContent='V';
    const curve=S('polyline',{id:'ivCv',points:'',fill:'none',stroke:'var(--phos-d)','stroke-width':2.5}); svg.appendChild(curve);
    const dot=S('circle',{id:'ivDot',cx:vx(0),cy:Yz,r:5,fill:'var(--copper)'}); svg.appendChild(dot);
    const panel=el('div',{},[]);
    const seg=el('div',{class:'seg'},[]); ['Resistor','Lamp','Diode'].forEach((g,i)=>{const b=el('button',{class:i===0?'on':''},[document.createTextNode(g)]); b.dataset.c=g; seg.appendChild(b);}); panel.appendChild(seg);
    const cV=el('div',{class:'ctrl'},[el('label',{},[document.createTextNode('Applied voltage'),Object.assign(document.createElement('b'),{id:'ivV'})])]);
    const rngV=el('input',{type:'range',min:'-2',max:'6',step:'0.1',value:'2'}); cV.appendChild(rngV);
    panel.appendChild(cV);
    panel.appendChild(readout([{k:'Current',id:'ivI',u:'a.u.'},{k:'Effective R = V÷I',id:'ivR',u:'',cls:'amber'},{k:'Verdict',id:'ivVerd',u:''}]));
    root.appendChild(bench('I–V BENCH', svg, panel));
    let comp='Resistor';
    function I_of(V){
      if(comp==='Resistor') return (Imax/Vmax)*V;
      if(comp==='Lamp'){ const s=Math.sign(V); return s*(Imax/Math.pow(Vmax,0.55))*Math.pow(Math.abs(V),0.55); }
      if(V<=0.6) return Math.max(0,(V-0.6)*0.5);
      return Math.min(Imax,(V-0.6)*(Imax/(Vmax-0.6)));
    }
    const clamp=I=>Math.max(-Imax,Math.min(Imax,I));
    function drawCurve(){ let pts=''; for(let i=0;i<=80;i++){ const V=Vmin+i/80*(Vmax-Vmin); const y=Math.max(Ytop,Math.min(Ybot,iy(clamp(I_of(V))))); pts+=`${vx(V).toFixed(1)},${y.toFixed(1)} `; } curve.setAttribute('points',pts); }
    function upd(){ const V=parseFloat(rngV.value), I=I_of(V);
      root.querySelector('#ivV').textContent=V.toFixed(1)+' V';
      root.querySelector('#ivI').textContent=I.toFixed(0);
      root.querySelector('#ivR').textContent= comp==='Resistor'?'constant':(Math.abs(I)<1?'—':'changes');
      const verd=comp==='Resistor'?'ohmic':'non-ohmic'; const e=root.querySelector('#ivVerd'); e.textContent=verd; e.className='v '+(verd==='ohmic'?'':'amber');
      dot.setAttribute('cx',vx(V)); dot.setAttribute('cy',Math.max(Ytop,Math.min(Ybot,iy(clamp(I))))); }
    seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{comp=b.dataset.c; seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); drawCurve(); upd();}));
    rngV.addEventListener('input',upd); drawCurve(); upd();
  }});

/* ---- 4. LED ---- */
STEPS.push({part:P_COMP, nav:"LED", title:"LED — light, with a catch",

  body(root){
    root.appendChild(el('p',{class:'lead',html:"An <span class='key'>LED</span> only passes current one way (long leg = <strong>+</strong>). Once it turns on it holds a roughly fixed <strong>forward voltage</strong> (~1.8 V here) and tries to pass <em>unlimited</em> current. Left alone on 9 V it burns out instantly."}));
    root.appendChild(el('p',{html:"The fix is the resistor you just met: it soaks up the leftover voltage and sets a safe current (10–20 mA is plenty). Slide the resistor toward zero and watch what happens — this is the single most common beginner mistake in electronics."}));
    const svg=S('svg',{viewBox:'0 0 340 200'});
    svg.appendChild(S('line',{x1:30,y1:100,x2:110,y2:100,stroke:'var(--copper)','stroke-width':3}));
    svg.appendChild(S('rect',{x:110,y:86,width:46,height:28,rx:4,fill:'#caa46b',stroke:'#8a6a36'}));
    svg.appendChild(S('text',{x:133,y:128,fill:'var(--muted)','font-size':'9','text-anchor':'middle'})).textContent='R';
    svg.appendChild(S('line',{x1:156,y1:100,x2:200,y2:100,stroke:'var(--copper)','stroke-width':3}));
    // LED triangle + bar
    svg.appendChild(S('path',{d:'M200 86 L200 114 L224 100 Z',fill:'#3a2f1c',stroke:'var(--copper)'}));
    svg.appendChild(S('line',{x1:224,y1:84,x2:224,y2:116,stroke:'var(--copper)','stroke-width':3}));
    svg.appendChild(S('line',{x1:224,y1:100,x2:310,y2:100,stroke:'var(--copper)','stroke-width':3}));
    const glow=S('circle',{id:'led',cx:212,cy:100,r:7,fill:'#2a2f37'}); svg.appendChild(glow);
    const halo=S('circle',{id:'halo',cx:212,cy:100,r:0,fill:'var(--copper)',opacity:.25}); svg.insertBefore(halo,glow);
    const panel=el('div',{},[]);
    const cR=el('div',{class:'ctrl'},[el('label',{},[document.createTextNode('Series resistor'),Object.assign(document.createElement('b'),{id:'lvR'})])]);
    const rngR=el('input',{type:'range',min:'0',max:'1000',step:'10',value:'470'}); cR.appendChild(rngR);
    panel.appendChild(cR);
    panel.appendChild(readout([{k:'LED current',id:'lI',u:'mA'},{k:'Brightness',id:'lB',u:'%'}]));
    const w=el('div',{class:'warnbox',id:'lWarn',style:'display:none'}); w.textContent='Over 30 mA — the LED is cooking. In a real circuit it would be dead by now.';
    panel.appendChild(w);
    root.appendChild(bench('LED BENCH', svg, panel));
    function upd(){
      const R=parseFloat(rngR.value), V=9, Vf=1.8;
      let I = R<=0 ? 9/8 /*~limited only by tiny wire R*/ : Math.max(0,(V-Vf)/R);
      const mA=I*1000; const bright=Math.max(0,Math.min(1,mA/15));
      root.querySelector('#lvR').textContent=R+' Ω';
      root.querySelector('#lI').textContent=mA>999?'∞':mA.toFixed(1);
      root.querySelector('#lI').className='v '+(mA>30?'warn':'');
      root.querySelector('#lB').textContent=(bright*100).toFixed(0);
      glow.setAttribute('fill', bright>0.04? 'var(--copper)':'#2a2f37');
      halo.setAttribute('r', 7+bright*22);

  }});

/* ---- Components: the oscilloscope (vocabulary first, then a live scope) ---- */
STEPS.push({part:P_COMP, nav:"The oscilloscope", title:"The oscilloscope — watching voltage over time",
  sub:"A meter tells you the voltage right now. A scope draws it as time passes, which is how you actually see a blink, a charge curve, or a tone.",
  body(root){
    root.appendChild(el('p',{class:'lead',html:"Everything so far has been <em>steady</em>: one voltage, one current, one number. The next lessons are about things that <strong>change</strong> — capacitors filling, lights blinking. For that you need an <span class='key'>oscilloscope</span> (“scope”): a screen that plots <strong>voltage up the side</strong> against <strong>time along the bottom</strong>, writing the line as it goes."}));
    root.appendChild(el('p',{html:"Same rule as the first lesson: the words before the picture. Every scope in the world uses these:"}));
    const vt=el('table',{class:'map'});
    vt.appendChild(el('tr',{},[el('th',{},[document.createTextNode('term')]),el('th',{},[document.createTextNode('what it means')])]));
    [['trace','The line the scope draws. Its height is the voltage at that moment.'],
     ['graticule','The grid on the screen: 10 squares across, 8 squares up.'],
     ['division','One square of that grid. Measurements are counted in divisions.'],
     ['volts/div','How many volts one square stands for vertically. Your vertical zoom.'],
     ['time/div','How much time one square stands for horizontally. Your horizontal zoom. The whole screen shows 10 × that.'],
     ['0 V marker','The little arrow on the left edge that shows where 0 V (ground) sits.'],
     ['amplitude','How tall the signal gets, from 0 V to its peak.'],
     ['period (T)','How long one full cycle of a repeating signal takes: one “on” plus one “off”.'],
     ['frequency (f)','How many cycles happen per second, in hertz (Hz). f = 1 ÷ T.']
    ].forEach(r=>vt.appendChild(el('tr',{},[el('td',{class:'m'},[document.createTextNode(r[0])]),el('td',{},[document.createTextNode(r[1])])])));
    root.appendChild(vt);
    root.appendChild(el('p',{html:"Now try one. Pick a signal, then change the two zoom knobs and watch what moves. Count divisions to measure: a square wave that is 4.5 squares tall at 2 V/div is 4.5 × 2 = 9 V."}));

    const sc=makeScope({chans:[{name:'CH1',color:'var(--phos)',step:true}],vdiv:2,tdiv:0.5,zeroDiv:1});
    const panel=el('div',{},[]);
    const seg=el('div',{class:'seg'},[]);
    [['dc','Battery'],['sw','Switch'],['sq','Square wave']].forEach(([k,t],i)=>{ const b=el('button',{type:'button',class:i===2?'on':''},[document.createTextNode(t)]); b.dataset.k=k; seg.appendChild(b); });
    panel.appendChild(seg);
    const tog=el('div',{class:'tog',id:'osSw',tabindex:'0',role:'switch','aria-checked':'false'},[el('span',{class:'sw'}),el('span',{id:'osSwT'},[document.createTextNode('Switch: OPEN')])]);
    const togWrap=el('div',{style:'margin:0 0 12px;display:none'},[tog]); panel.appendChild(togWrap);
    const cF=el('div',{class:'ctrl'},[el('label',{},[document.createTextNode('Square-wave frequency'),Object.assign(document.createElement('b'),{id:'osFv'})])]);
    const rngF=el('input',{type:'range',min:'0.2',max:'4',step:'0.1',value:'1','aria-label':'Square-wave frequency'}); cF.appendChild(rngF); panel.appendChild(cF);
    const vSel=selectCtrl('Volts/div (vertical zoom)','osV',[1,2,5],2,v=>v+' V/div');
    const tSel=selectCtrl('Time/div (horizontal zoom)','osT',[0.1,0.2,0.5,1],0.5,v=>fmtTime(v)+'/div');
    panel.appendChild(vSel.wrap); panel.appendChild(tSel.wrap);
    panel.appendChild(readout([{k:'Amplitude',id:'osA',u:'V',cls:'amber'},{k:'Period T',id:'osP',u:''},{k:'Frequency f',id:'osFq',u:''},{k:'Screen width',id:'osW',u:''}]));
    root.appendChild(scopeBench('SCOPE BENCH', sc, panel));

    let src='sq', closed=false, swEv=[[-1e9,0]], tNow=0;
    const V=9;
    function sig(t){
      if(src==='dc') return [V];
      if(src==='sw'){ let s=0; for(const e of swEv){ if(e[0]<=t) s=e[1]; else break; } return [s?V:0]; }
      const f=parseFloat(rngF.value); return [((t*f)%1+1)%1<0.5?V:0];
    }
    function render(){ sc.drawFn(Math.max(tNow,10*sc.tdiv),sig); }
    function readouts(){
      const f=parseFloat(rngF.value);
      root.querySelector('#osFv').textContent=f.toFixed(1)+' Hz';
      root.querySelector('#osA').textContent= src==='sw'&&!closed ? '0' : V.toFixed(1);
      root.querySelector('#osP').textContent= src==='sq' ? fmtTime(1/f) : 'not repeating';
      root.querySelector('#osFq').textContent= src==='sq' ? f.toFixed(1)+' Hz' : '—';
      root.querySelector('#osW').textContent= '10 × '+fmtTime(sc.tdiv)+' = '+fmtTime(10*sc.tdiv);
      togWrap.style.display = src==='sw' ? 'block':'none'; cF.style.display = src==='sq' ? 'block':'none';
    }
    function flip(){ closed=!closed; swEv.push([REDUCE ? 5*sc.tdiv : Math.max(tNow,10*sc.tdiv),closed?1:0]);
      tog.className='tog'+(closed?' on':''); tog.setAttribute('aria-checked',closed); root.querySelector('#osSwT').textContent='Switch: '+(closed?'CLOSED':'OPEN'); readouts(); render(); }
    tog.addEventListener('click',flip); tog.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); flip(); } });
    seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ src=b.dataset.k; seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); readouts(); render(); }));
    rngF.addEventListener('input',()=>{ readouts(); render(); });
    vSel.sel.addEventListener('change',()=>{ sc.set({vdiv:parseFloat(vSel.sel.value)}); render(); });
    tSel.sel.addEventListener('change',()=>{ sc.set({tdiv:parseFloat(tSel.sel.value)}); readouts(); render(); });
    readouts(); render();
    rAFLoop(t=>{ tNow=t+10*sc.tdiv; render(); });
    root.appendChild(el('p',{class:'note',html:"Things to notice: switching to <strong>5 V/div</strong> makes the same 9 V look shorter, because each square now holds more volts. Switching to <strong>0.1 s/div</strong> spreads the wave out, because the whole screen now covers only 1 second. Neither knob changes the signal. They only change how you look at it."}));
    root.appendChild(el('p',{class:'note',html:"<strong>Honest scale note:</strong> this bench runs slow enough to watch the line being drawn. Real scopes measure signals millions of times faster, and use a <em>trigger</em> to start each sweep at the same point of a repeating wave so it appears to stand still. The knobs and the counting work the same way. NEETS Module 16, <em>Introduction to Test Equipment</em>, covers real scopes."}));
  }});

/* ---- 5. Capacitor ---- */
STEPS.push({part:P_COMP, nav:"Capacitor", title:"Capacitor — the tiny rechargeable bucket",
  sub:"A capacitor stores charge and releases it. It can’t pass steady DC, but it loves change — which is exactly what makes timing and filtering possible.",
  body(root){
    root.appendChild(el('p',{class:'lead',html:"A <span class='key'>capacitor</span> is two plates that hold charge like a bucket holds water. Connect it to a supply through a resistor and it <strong>fills up</strong> on a curve; disconnect and let it drain and it <strong>empties</strong> on a curve."}));
    root.appendChild(el('p',{html:"How fast is set by the <span class='term'>time constant</span> <strong>τ = R × C</strong>. After one τ the bucket is ~63% full; after about 5τ it’s basically done. This predictable timing is the heartbeat of blinkers, tones, and clocks — and the same part smooths out noisy power. Tap charge and discharge, and change R or C to feel τ."}));
    const svg=S('svg',{viewBox:'0 0 340 200'});
    // graph axes
    svg.appendChild(S('line',{x1:40,y1:30,x2:40,y2:160,stroke:'var(--line)'}));
    svg.appendChild(S('line',{x1:40,y1:160,x2:320,y2:160,stroke:'var(--line)'}));
    svg.appendChild(S('text',{x:34,y:34,fill:'var(--faint)','font-size':'9','text-anchor':'end'})).textContent='V';
    svg.appendChild(S('text',{x:318,y:174,fill:'var(--faint)','font-size':'9','text-anchor':'end'})).textContent='time';
    const curve=S('polyline',{id:'cv',points:'',fill:'none',stroke:'var(--phos)','stroke-width':2.5}); svg.appendChild(curve);
    const dot=S('circle',{id:'cdot',cx:40,cy:160,r:4,fill:'var(--copper)'}); svg.appendChild(dot);
    // bucket
    svg.appendChild(S('rect',{x:280,y:40,width:34,height:110,rx:4,fill:'none',stroke:'var(--blue)'}));
    const fill=S('rect',{id:'cfill',x:282,y:148,width:30,height:0,fill:'var(--blue)',opacity:.55}); svg.appendChild(fill);
    const panel=el('div',{},[]);
    const seg=el('div',{class:'seg'},[]);
    const bC=el('button',{},[document.createTextNode('Charge ▲')]); const bD=el('button',{},[document.createTextNode('Discharge ▼')]);
    seg.appendChild(bC); seg.appendChild(bD); panel.appendChild(seg);
    const cR=el('div',{class:'ctrl'},[el('label',{},[document.createTextNode('Resistor'),Object.assign(document.createElement('b'),{id:'cvR'})])]);
    const rngR=el('input',{type:'range',min:'1',max:'100',step:'1',value:'20'}); cR.appendChild(rngR);
    const cC=el('div',{class:'ctrl'},[el('label',{},[document.createTextNode('Capacitor'),Object.assign(document.createElement('b'),{id:'cvC'})])]);
    const rngC=el('input',{type:'range',min:'10',max:'1000',step:'10',value:'100'}); cC.appendChild(rngC);
    panel.appendChild(cR); panel.appendChild(cC);
    panel.appendChild(readout([{k:'Time constant τ',id:'cTau',u:'ms',cls:'amber'},{k:'Charge',id:'cPct',u:'%',cls:'cool'}]));

    const vAt=t=>{ let s=null; for(const g of segs){ if(g.t0<=t) s=g; else break; } if(!s) return 0; return s.target+(s.v0-s.target)*Math.exp(-(t-s.t0)/s.tau); };

    function startT(){ return REDUCE ? sc.tdiv : tNow; } // reduced motion: draw a still picture with the change near the left edge
    function newSeg(){ const t0=startT(); const v0=REDUCE?(segs.length?vAt(t0+1e9):0):vAt(t0);
      if(REDUCE) segs=[]; segs=segs.filter(g=>g.t0<t0); segs.push({t0,v0,target:charging?VS:0,tau:Math.max(1e-4,tau())});
      const keep=tNow-12*sc.tdiv; while(segs.length>1 && segs[1].t0<keep) segs.shift(); }
    function refs(){ const v63=charging?VS*0.632:VS*0.368; sc.set({refs:[{v:VS,label:'supply 9 V',color:'var(--faint)'},{v:v63,label:(charging?'63% after 1τ':'37% left after 1τ'),color:'var(--copper)'}]}); }
    function labels(){ root.querySelector('#cvR').textContent=rngR.value+' kΩ'; root.querySelector('#cvC').textContent=rngC.value+' µF';

    bD.addEventListener('click',()=>{charging=false; bD.classList.add('on'); bC.classList.remove('on'); newSeg(); refs(); paint();});
    bC.classList.add('on');
    rngR.addEventListener('input',onRC); rngC.addEventListener('input',onRC);

      const tView = REDUCE ? 10*sc.tdiv : tNow;

    sp.appendChild(el('p',{class:'note',html:"The time/div sets itself to about one τ per square, so the curve always fits. Watch the trace cross the copper line one square after you press Charge — that crossing <em>is</em> the time constant, measured."}));
    root.appendChild(scopeBench('SCOPE · RC CHARGE', sc, sp));
    root.appendChild(el('p',{class:'note',html:"This now runs in real time: with 20 kΩ and 100 µF, τ = 20,000 × 0.0001 = 2 s, so it takes about 2 real seconds to reach 63% and about 10 s to fill. Try 1 kΩ and 10 µF (τ = 10 ms): the charge is over faster than you can see, but the scope still catches the curve."}));
